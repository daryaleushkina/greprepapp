# Запросы к базе: SQL в internal/db/queries → типизированный Go в internal/db (go generate ./internal/db).
version: "2"
sql:
  - engine: postgresql
    schema: internal/migrations
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          # Целые — в int Go: числа из запросов приходят как int, и без этого каждое пришлось бы приводить
          # к int32 вручную (gosec G115). Выход за пределы столбца pgx возвращает ошибкой, а не обрезает.
          - db_type: pg_catalog.int4
            go_type: int
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: int
              pointer: true
          - db_type: pg_catalog.int2
            go_type: int
