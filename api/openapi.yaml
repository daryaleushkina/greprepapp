openapi: 3.1.0
# Договор между сервером Go и всеми клиентами: веб (мини-апп и сайт), админка, Swift, Kotlin.
# Источник правды — этот файл; код по нему генерируется (docs/HANDOFF.md, «Договор API»).
#
# Осторожное подмножество OpenAPI 3.1 — его понимают все четыре генератора:
#   • без oneOf / anyOf / allOf (генератор Kotlin их не поддерживает);
#   • у каждого объекта additionalProperties: false — сервер (ogen) отклоняет лишние поля с 400;
#   • отсутствие значения — необязательное поле; исключение ActiveExam: nullable enum через type
#     [string, null], без union-схем, проверяется тестами Go, веба, Swift и Kotlin;
#   • securitySchemes генератор Swift игнорирует — токен там добавляет своя прослойка.
info:
  title: GrePrepApp API
  version: 0.1.0
  description: >-
    Ошибка — всегда тело Error с машинным кодом и id запроса; тот же id — в заголовке X-Request-Id
    каждого ответа. Вход: сайт — кука __Host-session, мини-апп и приложения — Authorization: Bearer.

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Жив ли сервер и какая сборка (сверка после выкладки)
      tags: [public]
      security: []
      responses:
        '200':
          description: Сервер отвечает, база доступна
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        default: { $ref: '#/components/responses/Error' }

  /api/auth/telegram-mini-app:
    post:
      operationId: signInWithTelegramMiniApp
      summary: Вход из мини-аппа по initData (подпись проверяется ключом бота)
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramMiniAppSignIn' }
      responses:
        '200':
          description: Вошёл; токен — в теле (мини-апп хранит его в памяти)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        default: { $ref: '#/components/responses/Error' }

  /api/auth/oidc:
    post:
      operationId: signInWithIdToken
      summary: Вход по id_token Apple или Google, полученному на устройстве
      description: >-
        Родная кнопка Apple и Credential Manager Google отдают id_token прямо на устройстве. Сервер
        проверяет подпись по ключам компании, издателя, получателя, срок и nonce.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdTokenSignIn' }
      responses:
        '200':
          description: Вошёл
          headers:
            Set-Cookie:
              description: Только при transport=cookie — __Host-session, HttpOnly, Secure, SameSite=Strict
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        default: { $ref: '#/components/responses/Error' }

  /api/auth/oidc/code:
    post:
      operationId: signInWithAuthorizationCode
      summary: Вход по коду авторизации (Telegram везде, Apple на сайте и Android)
      description: >-
        Код обменивается на id_token на сервере: для обмена нужен секрет клиента, на устройство он не
        попадает. PKCE — обязательно.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizationCodeSignIn' }
      responses:
        '200':
          description: Вошёл
          headers:
            Set-Cookie:
              description: Только при transport=cookie
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        default: { $ref: '#/components/responses/Error' }

  /api/auth/dev:
    post:
      operationId: signInForDevelopment
      summary: Вход подменой — локально, в тестах и на стенде; в бою 404
      description: >-
        Включается переменной DEV_AUTH=1, которую сервер отказывается принять вместе с APP_ENV=production
        (проверено тестом). Тем же путём e2e заводит своего пользователя на каждый тест.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevSignIn' }
      responses:
        '200':
          description: Вошёл
          headers:
            Set-Cookie:
              description: Только при transport=cookie
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        default: { $ref: '#/components/responses/Error' }

  /api/auth/logout:
    post:
      operationId: signOut
      summary: Выйти на этом устройстве — сессия удаляется сразу
      tags: [auth]
      responses:
        '204':
          description: Сессии больше нет; на сайте кука стёрта
          headers:
            Set-Cookie:
              description: Стирает __Host-session
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }

  /api/me:
    get:
      operationId: getMe
      summary: Кто вошёл
      tags: [account]
      responses:
        '200':
          description: Пользователь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Error' }

  /api/exams:
    get:
      operationId: getExams
      summary: Экзамены и разделы в порядке прохождения
      tags: [public]
      security: []
      responses:
        '200':
          description: Доступные экзамены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamList' }
        default: { $ref: '#/components/responses/Error' }

  /api/me/exam:
    put:
      operationId: setActiveExam
      summary: Выбрать активный экзамен аккаунта (решение Даши 09.10.2026)
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamChoice' }
      responses:
        '200':
          description: Пользователь с выбранным экзаменом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Error' }

  /api/today:
    get:
      operationId: getToday
      summary: Лента шагов на сегодня (экран «Сегодня»)
      tags: [today]
      responses:
        '200':
          description: Шаги по порядку; конец ленты виден
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Today' }
        default: { $ref: '#/components/responses/Error' }

  /api/trainings/options:
    get:
      operationId: getTrainingOptions
      summary: Что можно собрать в конструкторе тренировки (макеты R1, R2)
      description: >-
        Типы заданий с темами и числом доступных заданий (пустую выборку не собрать), готовые наборы и прошлая
        тренировка — чтобы «Начать» было видно сразу. Только проверенные задания.
      tags: [trainings]
      parameters:
        - name: exam
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Exam' }
        - name: types
          in: query
          required: true
          description: >-
            Типы заданий, которые клиент умеет показывать. Других сервер не присылает ни в списке, ни в наборах:
            новый тип на сервере не ломает уже установленные версии приложений.
          schema:
            type: array
            minItems: 1
            maxItems: 20
            items: { $ref: '#/components/schemas/QuestionType' }
      responses:
        '200':
          description: Варианты конструктора
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingOptions' }
        default: { $ref: '#/components/responses/Error' }

  /api/trainings:
    post:
      operationId: startTraining
      summary: Начать тренировку — сессия со всеми заданиями и разборами сразу
      description: >-
        Всё нужное для сессии приходит одним ответом, чтобы начатая тренировка дожила без сети (PRODUCT.md,
        «Operating Context»). Задания — только проверенные, сначала те, что человек ещё не решал. Нет ни
        одного подходящего — 409 no_questions. Нет доступа к тренировкам — 403 forbidden.
      tags: [trainings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainingRequest' }
      responses:
        '201':
          description: Сессия создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingSession' }
        default: { $ref: '#/components/responses/Error' }

  /api/trainings/{trainingId}:
    get:
      operationId: getTraining
      summary: Своя тренировка — продолжить с того же вопроса или посмотреть разбор
      description: Чужая или несуществующая — 404 not_found, не 403, чтобы id чужих сессий не подтверждались.
      tags: [trainings]
      parameters:
        - $ref: '#/components/parameters/TrainingId'
      responses:
        '200':
          description: Сессия с ответами, которые уже дошли до сервера
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingSession' }
        default: { $ref: '#/components/responses/Error' }

  /api/trainings/{trainingId}/answers:
    post:
      operationId: submitTrainingAnswers
      summary: Ответы, накопленные на устройстве (в том числе без сети)
      description: >-
        Повторная отправка безопасна: ответ на позицию заменяется, а не дублируется. В «Практике» остаётся первый
        ответ (разбор уже показан), в «Проверке» — самый поздний по answeredAt (очередь без сети может прийти не
        по порядку). Сервер сам проверяет ответ по ключу — клиенту для статистики не верит. После завершения
        сессии ответы не принимаются (409 training_finished).
      tags: [trainings]
      parameters:
        - $ref: '#/components/parameters/TrainingId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerBatch' }
      responses:
        '204':
          description: Записано
        default: { $ref: '#/components/responses/Error' }

  /api/trainings/{trainingId}/finish:
    post:
      operationId: finishTraining
      summary: Закончить тренировку — итог и что повторить (макет R15)
      description: Повторный вызов возвращает тот же итог.
      tags: [trainings]
      parameters:
        - $ref: '#/components/parameters/TrainingId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainingFinish' }
      responses:
        '200':
          description: Итог
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingSummary' }
        default: { $ref: '#/components/responses/Error' }

  /api/questions/{questionId}/reports:
    post:
      operationId: reportQuestion
      summary: «Сообщить об ошибке» в задании — в очередь админки
      tags: [trainings]
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionReport' }
      responses:
        '204':
          description: Принято
        default: { $ref: '#/components/responses/Error' }

  /api/client-errors:
    post:
      operationId: reportClientError
      summary: Ошибка на клиенте — в таблицу client_errors
      description: >-
        Можно без входа (ошибка до входа тоже важна). Размер тела и частота ограничены на сервере.
      tags: [public]
      security:
        - {}
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientError' }
      responses:
        '204':
          description: Записано
        default: { $ref: '#/components/responses/Error' }

  /api/admin/review-queue:
    get:
      operationId: getReviewQueue
      summary: Очередь контента на проверку Даши (админка)
      description: Только роль admin; остальным — 403 forbidden.
      tags: [admin]
      responses:
        '200':
          description: Очередь; в каркасе пустая
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewQueue' }
        default: { $ref: '#/components/responses/Error' }

security:
  - bearerAuth: []
  - cookieAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Токен сессии — мини-апп и приложения
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-session
      description: Токен сессии — сайт и админка

  parameters:
    TrainingId:
      name: trainingId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Error:
      description: Любая ошибка — машинный код, текст для журнала, id запроса
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
          description: >-
            Машинный код: bad_request, unauthorized, forbidden, not_found, too_many_requests,
            invalid_init_data, invalid_id_token, no_questions, training_finished, internal. Клиент показывает текст по коду, а не message.
          examples: [unauthorized]
        message:
          type: string
          description: Для журнала и разработчика, не для экрана
        requestId:
          type: string

    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Коммит сборки — сверка «в бою новое» после выкладки

    SessionTransport:
      type: string
      enum: [bearer, cookie]
      description: >-
        bearer — токен в теле (мини-апп, приложения); cookie — токен только в куке __Host-session
        (сайт, админка), в теле его нет.

    TelegramMiniAppSignIn:
      type: object
      additionalProperties: false
      required: [initData]
      properties:
        initData:
          type: string
          minLength: 1
          maxLength: 4096
          description: Сырая строка initData от Telegram

    IdentityProvider:
      type: string
      enum: [telegram, apple, google]

    IdTokenSignIn:
      type: object
      additionalProperties: false
      required: [provider, idToken, nonce, transport]
      properties:
        provider: { $ref: '#/components/schemas/IdentityProvider' }
        idToken:
          type: string
          minLength: 1
          maxLength: 8192
        nonce:
          type: string
          minLength: 16
          maxLength: 128
          description: Тот же nonce, что ушёл провайдеру; сервер сверяет его с токеном
        displayName:
          type: string
          maxLength: 128
          description: >-
            Имя, которое Apple отдаёт приложению только при первом входе (в id_token его нет). Берётся
            только для нового аккаунта.
        transport: { $ref: '#/components/schemas/SessionTransport' }
        clientKind: { $ref: '#/components/schemas/ClientKind' }
        locale:
          $ref: '#/components/schemas/Locale'
          description: >-
            Язык интерфейса на устройстве. Берётся только для нового аккаунта: у существующего вход язык не
            меняет. Нет поля — русский.

    AuthorizationCodeSignIn:
      type: object
      additionalProperties: false
      required: [provider, code, codeVerifier, redirectUri, transport]
      properties:
        provider: { $ref: '#/components/schemas/IdentityProvider' }
        code:
          type: string
          minLength: 1
          maxLength: 2048
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
          description: PKCE (RFC 7636)
        redirectUri:
          type: string
          minLength: 1
          maxLength: 512
          description: Должен совпасть с одним из зарегистрированных у провайдера
        nonce:
          type: string
          minLength: 16
          maxLength: 128
        transport: { $ref: '#/components/schemas/SessionTransport' }
        clientKind: { $ref: '#/components/schemas/ClientKind' }
        locale:
          $ref: '#/components/schemas/Locale'
          description: >-
            Язык интерфейса на устройстве. Берётся только для нового аккаунта: у существующего вход язык не
            меняет. Нет поля — русский.

    DevSignIn:
      type: object
      additionalProperties: false
      required: [name, transport]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Имя тестового пользователя; один и тот же name — один и тот же пользователь
        role: { $ref: '#/components/schemas/Role' }
        transport: { $ref: '#/components/schemas/SessionTransport' }
        clientKind: { $ref: '#/components/schemas/ClientKind' }
        locale:
          $ref: '#/components/schemas/Locale'
          description: >-
            Язык интерфейса на устройстве. Берётся только для нового аккаунта: у существующего вход язык не
            меняет. Нет поля — русский.

    ClientKind:
      type: string
      enum: [web, telegram, ios, macos, android, admin]

    Session:
      type: object
      additionalProperties: false
      required: [expiresAt, user]
      properties:
        token:
          type: string
          description: Только при transport=bearer; хранить в Keychain / Keystore, в мини-аппе — в памяти
        expiresAt:
          type: string
          format: date-time
          description: Когда сессия истечёт без активности
        user: { $ref: '#/components/schemas/User' }

    Role:
      type: string
      enum: [user, admin]

    Locale:
      type: string
      enum: [ru, en]

    User:
      type: object
      additionalProperties: false
      required: [id, name, role, locale, identities, activeExam]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role: { $ref: '#/components/schemas/Role' }
        locale: { $ref: '#/components/schemas/Locale' }
        activeExam: { $ref: '#/components/schemas/ActiveExam' }
        identities:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/LinkedIdentity' }

    LinkedIdentity:
      type: object
      additionalProperties: false
      required: [provider, linkedAt]
      properties:
        provider: { $ref: '#/components/schemas/IdentityProvider' }
        linkedAt:
          type: string
          format: date-time

    Exam:
      type: string
      enum: [gre, toefl]

    ActiveExam:
      type: [string, 'null']
      enum: [gre, toefl, null]
      description: Новый аккаунт без экзамена; выбор общий для всех устройств

    ExamChoice:
      type: object
      additionalProperties: false
      required: [exam]
      properties:
        exam: { $ref: '#/components/schemas/Exam' }

    ExamInfo:
      type: object
      additionalProperties: false
      required: [id, sections]
      properties:
        id: { $ref: '#/components/schemas/Exam' }
        sections:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Section' }

    ExamList:
      type: object
      additionalProperties: false
      required: [exams]
      properties:
        exams:
          type: array
          items: { $ref: '#/components/schemas/ExamInfo' }

    Section:
      type: string
      enum: [verbal, quant, words, essay, reading, listening, writing, speaking]

    StepState:
      type: string
      enum: [done, current, next]

    TodayStep:
      type: object
      additionalProperties: false
      required: [id, section, title, minutes, state]
      properties:
        id:
          type: string
        section: { $ref: '#/components/schemas/Section' }
        title:
          type: string
          description: На языке интерфейса человека
        minutes:
          type: integer
          minimum: 1
          maximum: 240
        state: { $ref: '#/components/schemas/StepState' }

    Today:
      type: object
      additionalProperties: false
      required: [date, steps]
      properties:
        date:
          type: string
          format: date
        steps:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/TodayStep' }

    ClientError:
      type: object
      additionalProperties: false
      required: [message, clientKind, appVersion, occurredAt]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
        stack:
          type: string
          maxLength: 16000
        route:
          type: string
          maxLength: 512
          description: Экран или путь, без параметров с личными данными
        requestId:
          type: string
          maxLength: 64
          description: X-Request-Id запроса, после которого случилась ошибка, если был
        clientKind: { $ref: '#/components/schemas/ClientKind' }
        appVersion:
          type: string
          minLength: 1
          maxLength: 64
        occurredAt:
          type: string
          format: date-time

    ReviewQueue:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ReviewItem' }

    ReviewItem:
      type: object
      additionalProperties: false
      required: [id, kind, title]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [question, word, theory, essay_prompt]
        title:
          type: string

    # ---------- Тренировки ----------

    QuestionType:
      type: string
      enum: [text_completion, sentence_equivalence, quantitative_comparison, multiple_choice]
      description: >-
        Первый срез тренировок — задания с выбором ответа (решение Даши 06.10.2026): Text Completion (1–3
        пропуска), Sentence Equivalence (два ответа из шести), Quantitative Comparison, обычный выбор в
        математике. Reading Comprehension, ввод числа и несколько верных — следующими срезами.

    Difficulty:
      type: string
      enum: [easy, medium, hard]

    TrainingMode:
      type: string
      enum: [practice, check]
      description: >-
        practice — разбор после каждого вопроса, без таймера, вместо пропуска «Не знаю»; check — разбор в
        конце, таймер темпа экзамена, пропустить и вернуться можно, время вышло — сессия кончилась.

    LocalizedText:
      type: object
      additionalProperties: false
      required: [ru, en]
      properties:
        ru: { type: string }
        en: { type: string }

    DifficultyCounts:
      type: object
      additionalProperties: false
      required: [easy, medium, hard]
      description: Сколько проверенных заданий каждой сложности
      properties:
        easy: { type: integer, minimum: 0 }
        medium: { type: integer, minimum: 0 }
        hard: { type: integer, minimum: 0 }

    TrainingTopic:
      type: object
      additionalProperties: false
      required: [id, title, available]
      properties:
        id: { type: string, maxLength: 64 }
        title: { $ref: '#/components/schemas/LocalizedText' }
        available: { $ref: '#/components/schemas/DifficultyCounts' }

    TrainingType:
      type: object
      additionalProperties: false
      required: [section, questionType, paceSeconds, topics]
      properties:
        section: { $ref: '#/components/schemas/Section' }
        questionType: { $ref: '#/components/schemas/QuestionType' }
        paceSeconds:
          type: integer
          minimum: 1
          description: >-
            Темп экзамена на вопрос (Verbal — 90 с, Quant — 105 с): время «Проверки» и оценка «~12 мин» на кнопке
        topics:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/TrainingTopic' }

    TrainingPreset:
      type: object
      additionalProperties: false
      required: [kind, request]
      properties:
        kind:
          type: string
          maxLength: 32
          description: >-
            Открытый список, не enum: новые виды появятся без обновления приложений, а клиент пропускает
            незнакомые. Сейчас — last («Как в прошлый раз») и timed («Проверка на время»: все доступные типы
            раздела, 12 вопросов, как секция экзамена); «Мои ошибки» и «Слабая тема» — с фичей «что повторить».
        request: { $ref: '#/components/schemas/TrainingRequest' }

    TrainingOptions:
      type: object
      additionalProperties: false
      required: [types, presets, maxQuestions]
      properties:
        types:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/TrainingType' }
        presets:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/TrainingPreset' }
        maxQuestions:
          type: integer
          minimum: 1
          description: Больше этого числа вопросов в одной тренировке не бывает

    TrainingRequest:
      type: object
      additionalProperties: false
      required: [exam, section, questionTypes, count, mode]
      properties:
        exam: { $ref: '#/components/schemas/Exam' }
        section: { $ref: '#/components/schemas/Section' }
        questionTypes:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { $ref: '#/components/schemas/QuestionType' }
          description: Конструктор даёт один тип; «Проверка на время» — все типы раздела вперемешку (макет R16)
        topicIds:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 64 }
          description: Пусто или нет — все темы
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        count:
          type: integer
          minimum: 1
          maximum: 50
        mode: { $ref: '#/components/schemas/TrainingMode' }

    QuestionOption:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id: { type: string, maxLength: 16 }
        text: { type: string, maxLength: 500 }

    OptionGroup:
      type: object
      additionalProperties: false
      required: [options]
      properties:
        options:
          type: array
          minItems: 2
          maxItems: 6
          items: { $ref: '#/components/schemas/QuestionOption' }

    OptionExplanation:
      type: object
      additionalProperties: false
      required: [optionId, text]
      properties:
        optionId: { type: string, maxLength: 16 }
        text:
          $ref: '#/components/schemas/LocalizedText'
          description: Почему соблазняет и чем плох

    Explanation:
      type: object
      additionalProperties: false
      required: [solution, options]
      description: >-
        Разбор пишется заранее (PRODUCT.md, «Разбор ошибок»): почему верен ключ и почему соблазняет и не подходит
        каждый неверный вариант. Текст простой; *слово* — выделение (английские слова в русском тексте).
      properties:
        solution:
          $ref: '#/components/schemas/LocalizedText'
          description: Почему верен ключ — под «Верно / Неверно. Верный ответ — A» (макеты R4, R6)
        options:
          type: array
          maxItems: 18
          items: { $ref: '#/components/schemas/OptionExplanation' }
          description: «Почему не …?» — по неверным вариантам

    Question:
      type: object
      additionalProperties: false
      required: [id, questionType, section, topicId, topicTitle, difficulty, prompt, groups, selectCount, answer, explanation]
      properties:
        id: { type: string, format: uuid }
        questionType: { $ref: '#/components/schemas/QuestionType' }
        section: { $ref: '#/components/schemas/Section' }
        topicId: { type: string, maxLength: 64 }
        topicTitle: { $ref: '#/components/schemas/LocalizedText' }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        prompt:
          type: string
          maxLength: 4000
          description: >-
            Текст задания на английском. Пропуски Text Completion и Sentence Equivalence — «___» по порядку
            групп вариантов.
        condition:
          type: string
          maxLength: 500
          description: Условие над величинами Quantitative Comparison (например, «0 < x < 1»)
        quantityA: { type: string, maxLength: 500 }
        quantityB: { type: string, maxLength: 500 }
        groups:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: '#/components/schemas/OptionGroup' }
          description: Группа — один пропуск Text Completion; у остальных типов одна группа
        selectCount:
          type: integer
          minimum: 1
          maximum: 2
          description: Сколько вариантов выбрать в группе (Sentence Equivalence — 2)
        answer:
          type: array
          minItems: 1
          maxItems: 3
          items: { type: string, maxLength: 16 }
          description: >-
            Верные варианты. Приходит вместе с заданием: проверка без сети идёт на устройстве; сервер
            проверяет ответ сам и статистику клиенту не доверяет.
        explanation: { $ref: '#/components/schemas/Explanation' }

    GivenAnswer:
      type: object
      additionalProperties: false
      required: [position, optionIds, dontKnow, flagged, answeredAt, elapsedMs]
      properties:
        position: { type: integer, minimum: 0, maximum: 49 }
        optionIds:
          type: array
          maxItems: 3
          items: { type: string, maxLength: 16 }
          description: Пусто — не ответил (пропустил или «Не знаю»)
        dontKnow:
          type: boolean
          description: «Не знаю» в «Практике» — для «что повторить» это ошибка; только с пустым optionIds
        flagged:
          type: boolean
          description: Отметка «вернуться» в «Проверке»
        answeredAt: { type: string, format: date-time }
        elapsedMs:
          type: integer
          minimum: 0
          maximum: 86400000

    TrainingItem:
      type: object
      additionalProperties: false
      required: [position, question]
      properties:
        position: { type: integer, minimum: 0, maximum: 49 }
        question: { $ref: '#/components/schemas/Question' }
        answer: { $ref: '#/components/schemas/GivenAnswer' }
        correct:
          type: boolean
          description: Проверка сервера; нет — ответа нет или он ещё не дошёл

    TrainingSession:
      type: object
      additionalProperties: false
      required: [id, mode, section, questionTypes, startedAt, items]
      properties:
        id: { type: string, format: uuid }
        exam:
          $ref: '#/components/schemas/Exam'
          description: Необязательное только для чтения сохранённых сессий старого формата; сервер возвращает всегда
        mode: { $ref: '#/components/schemas/TrainingMode' }
        section: { $ref: '#/components/schemas/Section' }
        questionTypes:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: '#/components/schemas/QuestionType' }
        startedAt: { type: string, format: date-time }
        timeLimitSeconds:
          type: integer
          minimum: 1
          description: Только у «Проверки» — темп секции экзамена
        finishedAt: { type: string, format: date-time }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/TrainingItem' }

    AnswerBatch:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/GivenAnswer' }

    TrainingFinish:
      type: object
      additionalProperties: false
      required: [finishedAt, timedOut]
      properties:
        finishedAt: { type: string, format: date-time }
        timedOut:
          type: boolean
          description: Время «Проверки» вышло — оставшиеся вопросы «не успел»

    TopicToReview:
      type: object
      additionalProperties: false
      required: [topicId, title, mistakes, positions]
      properties:
        topicId: { type: string, maxLength: 64 }
        title: { $ref: '#/components/schemas/LocalizedText' }
        mistakes: { type: integer, minimum: 1 }
        positions:
          type: array
          maxItems: 50
          items: { type: integer, minimum: 0 }

    TrainingSummary:
      type: object
      additionalProperties: false
      required: [correct, total, unanswered, durationSeconds, review]
      properties:
        correct: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 1 }
        unanswered:
          type: integer
          minimum: 0
          description: Без ответа — «Не знаю», пропущенные и не успел
        durationSeconds: { type: integer, minimum: 0 }
        review:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/TopicToReview' }
          description: 1–3 темы, где больше всего ошибок, — «Что повторить»

    QuestionReport:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [question, answer, explanation, translation, other]
          description: Где ошибка — в задании, в ответе, в разборе, в переводе, другое (макет R17)
        text: { type: string, maxLength: 2000 }
        trainingId: { type: string, format: uuid }
