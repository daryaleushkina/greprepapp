# Параллельная сборка с кэшем конфигурации: повторная сборка не перечитывает скрипты. Потоков — не больше шести,
# демон гаснет через 15 минут простоя, Kotlin-демон — до 2 ГБ: это общие потолки Мака (~/.gradle/gradle.properties),
# здесь они не перекрываются. Память демона задаёт проект — 4 ГБ, как у соседних: память Мака общая со всеми
# сессиями и их эмуляторами, а 6 ГБ вместе с процессами тестов и Kotlin-демоном — больше 10 ГБ на одну сборку.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
