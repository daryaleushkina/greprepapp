# Версии сверены по Maven Central и Google Maven 06.10.2026: последние стабильные (решение Даши 06.10.2026 —
# «стек самый современный»). Альфы и беты не берём: приложение идёт в магазин, а их API меняется между выпусками.
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
hilt = "2.60.1"
androidx-hilt = "1.4.0"
compose-bom = "2026.09.00"
activity = "1.13.0"
appcompat = "1.8.0"
core = "1.19.1"
core-splashscreen = "1.2.0"
lifecycle = "2.11.0"
navigation3 = "1.2.0"
okhttp = "5.5.0"
retrofit = "3.0.0"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
openapi-generator = "7.25.0"
junit = "4.13.2"
robolectric = "4.17"
roborazzi = "1.76.0"
androidx-test-core = "1.7.0"
androidx-test-ext-junit = "1.3.0"
espresso = "3.7.0"
kover = "0.9.11"
ktlint-gradle = "14.2.0"
