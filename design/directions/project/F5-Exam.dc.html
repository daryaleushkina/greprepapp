<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Е · Шаги — Пробный экзамен</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1B1E28}a:hover{color:#5A6070}
button,input{font:inherit}
button{cursor:pointer}
button,a,label{-webkit-tap-highlight-color:transparent;transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
button:active,a:active{transform:scale(0.98)}
:focus-visible{outline:2px solid #1B1E28;outline-offset:2px}
::selection{background:#E2F3EE;color:#1B1E28}
input[type=radio]:checked{border-color:#1B1E28 !important;background:#1B1E28 !important;box-shadow:inset 0 0 0 4px #FFFFFF}
label:has(input:checked){box-shadow:inset 0 0 0 1.5px #1B1E28 !important}
@media (prefers-reduced-motion: reduce){button,a,label{transition:none}button:active,a:active{transform:none}}
@media (prefers-reduced-transparency: reduce){.glass{background:#FFFFFF!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
</style>
</helmet>
<!-- Экзамен — строгий белый лист; управление на английском, как на настоящем GRE (решение Даши) -->
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: 'Onest', system-ui, sans-serif; color: #1B1E28; background: #FFFFFF; display: flex; flex-direction: column">

  <button type="button" class="glass" aria-label="Назад" style="position: absolute; z-index: 5; top: 8px; left: 12px; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.62); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid rgba(0, 0, 0, 0.06); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 8px 24px rgba(0, 0, 0, 0.08); color: #1B1E28; display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg>
  </button>
  <button type="button" class="glass" aria-label="Меню" style="position: absolute; z-index: 5; top: 8px; right: 12px; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.62); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid rgba(0, 0, 0, 0.06); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 8px 24px rgba(0, 0, 0, 0.08); color: #1B1E28; display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"></circle><circle cx="12" cy="12" r="1.7" fill="currentColor"></circle><circle cx="18.5" cy="12" r="1.7" fill="currentColor"></circle></svg>
  </button>

  <main lang="en" style="flex: 1; min-height: 0; overflow: hidden; padding: 68px 20px 0; display: flex; flex-direction: column">

    <!-- Шапка секции без коробки: название, таймер, лента секций -->
    <section aria-label="Current section" style="flex: none; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <h1 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">Quantitative Reasoning</h1>
        <span role="timer" aria-label="Time remaining 14 minutes 32 seconds" style="font-size: 22px; line-height: 26px; font-weight: 600; font-variant-numeric: tabular-nums">14:32</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <span style="font-size: 15px; line-height: 20px; color: #5A6070; font-variant-numeric: tabular-nums">Section 1 of 2 · Question 7 of 12</span>
        <button type="button" style="margin: -8px -8px -8px 0; height: 44px; padding: 0 8px; border: 0; background: transparent; color: #1B1E28; font-size: 15px; font-weight: 500; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; text-decoration-color: rgba(27, 30, 40, 0.25)">Hide Time</button>
      </div>
      <!-- Секции экзамена — та же лента шагов, что и на главной -->
      <ol aria-label="Sections" style="list-style: none; margin: 12px 0 0; padding: 0; position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
        <li aria-hidden="true" style="position: absolute; left: 10%; right: 10%; top: 5.25px; height: 1.5px; background: rgba(27, 30, 40, 0.12)"></li>
        <li aria-hidden="true" style="position: absolute; left: 10%; width: 60%; top: 5.25px; height: 1.5px; background: #11735F"></li>
        <li style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #11735F"></span>
          <span style="font-size: 13px; line-height: 16px; color: #5A6070">AW</span>
        </li>
        <li style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #11735F"></span>
          <span style="font-size: 13px; line-height: 16px; color: #5A6070">Verbal 1</span>
        </li>
        <li style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #11735F"></span>
          <span style="font-size: 13px; line-height: 16px; color: #5A6070">Verbal 2</span>
        </li>
        <li aria-current="step" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span aria-hidden="true" style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 3px solid #11735F; box-shadow: 0 0 0 4px rgba(17, 115, 95, 0.14)"></span>
          <span style="font-size: 13px; line-height: 16px; font-weight: 600; color: #11735F">Quant 1</span>
        </li>
        <li style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span aria-hidden="true" style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 1.5px solid rgba(27, 30, 40, 0.22)"></span>
          <span style="font-size: 13px; line-height: 16px; color: #5A6070">Quant 2</span>
        </li>
      </ol>
    </section>

    <div role="toolbar" aria-label="Exam tools" style="flex: none; margin-top: 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button type="button" aria-pressed="false" style="height: 44px; border: 0; border-radius: 22px; background: #F2F3F6; color: #1B1E28; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5h10v15.5l-5-3.5-5 3.5z"></path></svg>
        Mark
      </button>
      <button type="button" style="height: 44px; border: 0; border-radius: 22px; background: #F2F3F6; color: #1B1E28; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="4.5" width="6" height="6" rx="1.5"></rect><rect x="13.5" y="4.5" width="6" height="6" rx="1.5"></rect><rect x="4.5" y="13.5" width="6" height="6" rx="1.5"></rect><rect x="13.5" y="13.5" width="6" height="6" rx="1.5"></rect></svg>
        Review
      </button>
      <button type="button" style="height: 44px; border: 0; border-radius: 22px; background: #F2F3F6; color: #1B1E28; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="3.5" width="13" height="17" rx="2.5"></rect><path d="M8.5 7.5h7"></path><path d="M9 12h.01"></path><path d="M12 12h.01"></path><path d="M15 12h.01"></path><path d="M9 16h.01"></path><path d="M12 16h.01"></path><path d="M15 16h.01"></path></svg>
        Calculator
      </button>
    </div>

    <p style="flex: none; margin: 24px 0 0; font-size: 17px; line-height: 24px; font-weight: 500">Compare Quantity A and Quantity B.</p>
    <p style="flex: none; margin: 10px 0 0; text-align: center; font-size: 20px; line-height: 26px"><i>x</i> &gt; 0</p>

    <div style="flex: none; margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-radius: 18px; box-shadow: inset 0 0 0 1px #E3E6EC">
      <div style="padding: 12px 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; box-shadow: inset -1px 0 0 #E3E6EC">
        <span style="font-size: 14px; line-height: 20px; color: #5A6070">Quantity A</span>
        <span style="font-size: 22px; line-height: 30px">(<i>x</i> + 1)²</span>
      </div>
      <div style="padding: 12px 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 4px">
        <span style="font-size: 14px; line-height: 20px; color: #5A6070">Quantity B</span>
        <span style="font-size: 22px; line-height: 30px"><i>x</i>² + 1</span>
      </div>
    </div>

    <!-- Выбран первый; верность в экзамене не показывается -->
    <div role="radiogroup" aria-label="Answer choices" style="flex: none; margin-top: 16px; display: flex; flex-direction: column; gap: 8px">
      <label style="min-height: 50px; box-sizing: border-box; border-radius: 16px; box-shadow: inset 0 0 0 1px #E3E6EC; background: #FFFFFF; padding: 12px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 16px; line-height: 22px">
        <input type="radio" name="f5-answer" value="a" checked style="appearance: none; -webkit-appearance: none; margin: 0; flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #8A90A0; background: #FFFFFF; cursor: pointer">
        <span>Quantity A is greater.</span>
      </label>
      <label style="min-height: 50px; box-sizing: border-box; border-radius: 16px; box-shadow: inset 0 0 0 1px #E3E6EC; background: #FFFFFF; padding: 12px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 16px; line-height: 22px">
        <input type="radio" name="f5-answer" value="b" style="appearance: none; -webkit-appearance: none; margin: 0; flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #8A90A0; background: #FFFFFF; cursor: pointer">
        <span>Quantity B is greater.</span>
      </label>
      <label style="min-height: 50px; box-sizing: border-box; border-radius: 16px; box-shadow: inset 0 0 0 1px #E3E6EC; background: #FFFFFF; padding: 12px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 16px; line-height: 22px">
        <input type="radio" name="f5-answer" value="c" style="appearance: none; -webkit-appearance: none; margin: 0; flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #8A90A0; background: #FFFFFF; cursor: pointer">
        <span>The two quantities are equal.</span>
      </label>
      <label style="min-height: 50px; box-sizing: border-box; border-radius: 16px; box-shadow: inset 0 0 0 1px #E3E6EC; background: #FFFFFF; padding: 12px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 16px; line-height: 22px">
        <input type="radio" name="f5-answer" value="d" style="appearance: none; -webkit-appearance: none; margin: 0; flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #8A90A0; background: #FFFFFF; cursor: pointer">
        <span>The relationship cannot be determined from the information given.</span>
      </label>
    </div>
  </main>

  <!-- Back — SecondaryButton, Next — MainButton Telegram -->
  <nav lang="en" aria-label="Question navigation" style="flex: none; position: relative; padding: 8px 16px 24px; background: #FFFFFF; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: -28px; height: 28px; background: linear-gradient(rgba(255, 255, 255, 0), #FFFFFF); pointer-events: none"></span>
    <button type="button" style="height: 50px; border: 0; border-radius: 12px; background: #F2F3F6; color: #1B1E28; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; font-weight: 600">Back</button>
    <button type="button" style="height: 50px; border: 0; border-radius: 12px; background: #1B1E28; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; font-weight: 600">Next</button>
  </nav>

</div>
</x-dc>

</body>
</html>
