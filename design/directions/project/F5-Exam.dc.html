<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Шаг — Пробный экзамен</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&amp;display=swap">
<style>
body{margin:0}
a{color:#1E2230}a:hover{color:#565C6B}
button{font:inherit;cursor:pointer}
button,a,label{-webkit-tap-highlight-color:transparent;transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
button:active,a:active{transform:scale(0.98)}
:focus-visible{outline:3px solid #1E2230;outline-offset:3px}
::selection{background:#DDF3EC;color:#1E2230}
input[type=radio]:checked{border-color:#1E2230 !important;background:#1E2230 !important;box-shadow:inset 0 0 0 4px #FFFFFF}
label:has(input:checked){box-shadow:inset 0 0 0 2px #1E2230 !important;background:#F5F7FB !important}
@media (prefers-reduced-motion: reduce){button,a,label{transition:none}button:active,a:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: 'Nunito', sans-serif; color: #1E2230; background: #FFFFFF; display: flex; flex-direction: column">

  <header style="flex: none; height: 52px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 6px; background: #FFFFFF">
    <div style="display: flex; justify-content: flex-start">
      <button type="button" style="height: 44px; padding: 0 10px 0 2px; border: 0; border-radius: 12px; background: transparent; color: #1E2230; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 2px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"></path></svg>
        Назад
      </button>
    </div>
    <div style="font-size: 17px; line-height: 22px; font-weight: 800; letter-spacing: -0.01em">Шаг</div>
    <div style="display: flex; justify-content: flex-end">
      <button type="button" aria-label="Меню" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: #EEF0F4; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="3.5" cy="9" r="1.6" fill="#1E2230"></circle><circle cx="9" cy="9" r="1.6" fill="#1E2230"></circle><circle cx="14.5" cy="9" r="1.6" fill="#1E2230"></circle></svg>
        </span>
      </button>
    </div>
  </header>

  <!-- Экзамен — один в один как настоящий: управление на английском (решение Даши). Цвет раздела — только в полосе секции -->
  <main lang="en" style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 14px">

    <section aria-label="Current section" style="background: #DDF3EC; border-radius: 20px; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
        <h1 style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 800">Quantitative Reasoning</h1>
        <span style="font-size: 14px; line-height: 20px; font-weight: 700; color: #1C7A5E; white-space: nowrap; font-variant-numeric: tabular-nums">Section 1 of 2</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <span style="font-size: 15px; line-height: 20px; font-weight: 700; font-variant-numeric: tabular-nums">Question 7 of 12</span>
        <div style="display: flex; align-items: center; gap: 10px">
          <span role="timer" aria-label="Time remaining 14 minutes 32 seconds" style="font-size: 20px; line-height: 24px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.01em">14:32</span>
          <button type="button" style="height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: #FFFFFF; color: #1E2230; font-size: 14px; font-weight: 800; box-shadow: inset 0 0 0 1px rgba(28, 122, 94, 0.4)">Hide Time</button>
        </div>
      </div>
      <ol aria-label="Sections" style="list-style: none; margin: 4px 0 0; padding: 0; position: relative; display: grid; grid-template-columns: repeat(5, 1fr)">
        <li aria-hidden="true" style="position: absolute; left: 10%; right: 10%; top: 8px; height: 2px; border-radius: 1px; background: rgba(28, 122, 94, 0.28)"></li>
        <li aria-hidden="true" style="position: absolute; left: 10%; width: 60%; top: 8px; height: 2px; border-radius: 1px; background: #1C7A5E"></li>
        <li style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px">
          <span aria-hidden="true" style="margin: 2px 0; width: 14px; height: 14px; border-radius: 50%; background: #1C7A5E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #DDF3EC">
            <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 12.5l4 4 9-9"></path></svg>
          </span>
          <span style="font-size: 13px; line-height: 18px; font-weight: 700; color: #1E2230">AW</span>
        </li>
        <li style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px">
          <span aria-hidden="true" style="margin: 2px 0; width: 14px; height: 14px; border-radius: 50%; background: #1C7A5E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #DDF3EC">
            <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 12.5l4 4 9-9"></path></svg>
          </span>
          <span style="font-size: 13px; line-height: 18px; font-weight: 700; color: #1E2230">Verbal 1</span>
        </li>
        <li style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px">
          <span aria-hidden="true" style="margin: 2px 0; width: 14px; height: 14px; border-radius: 50%; background: #1C7A5E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #DDF3EC">
            <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 12.5l4 4 9-9"></path></svg>
          </span>
          <span style="font-size: 13px; line-height: 18px; font-weight: 700; color: #1E2230">Verbal 2</span>
        </li>
        <li aria-current="step" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px">
          <span aria-hidden="true" style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 4px solid #1C7A5E; box-shadow: 0 0 0 3px #DDF3EC"></span>
          <span style="font-size: 13px; line-height: 18px; font-weight: 800; color: #1C7A5E">Quant 1</span>
        </li>
        <li style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px">
          <span aria-hidden="true" style="margin: 3px 0; width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 2px solid #1C7A5E; box-shadow: 0 0 0 3px #DDF3EC"></span>
          <span style="font-size: 13px; line-height: 18px; font-weight: 700; color: #1E2230">Quant 2</span>
        </li>
      </ol>
    </section>

    <div role="toolbar" aria-label="Exam tools" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px">
      <button type="button" aria-pressed="false" style="height: 44px; border: 0; border-radius: 14px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #D9DDE6; color: #1E2230; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5h10v15.5l-5-3.5-5 3.5z"></path></svg>
        Mark
      </button>
      <button type="button" style="height: 44px; border: 0; border-radius: 14px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #D9DDE6; color: #1E2230; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="4.5" width="6" height="6" rx="1.5"></rect><rect x="13.5" y="4.5" width="6" height="6" rx="1.5"></rect><rect x="4.5" y="13.5" width="6" height="6" rx="1.5"></rect><rect x="13.5" y="13.5" width="6" height="6" rx="1.5"></rect></svg>
        Review
      </button>
      <button type="button" style="height: 44px; border: 0; border-radius: 14px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #D9DDE6; color: #1E2230; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="3.5" width="13" height="17" rx="2.5"></rect><path d="M8.5 7.5h7"></path><path d="M9 12h.01"></path><path d="M12 12h.01"></path><path d="M15 12h.01"></path><path d="M9 16h.01"></path><path d="M12 16h.01"></path><path d="M15 16h.01"></path></svg>
        Calculator
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px; padding-top: 4px">
      <p style="margin: 0; font-size: 16px; line-height: 23px; font-weight: 600">Compare Quantity A and Quantity B.</p>

      <p style="margin: 0; text-align: center; font-size: 22px; line-height: 28px; font-weight: 400"><span style="font-style: italic">x</span> &gt; 0</p>

      <div style="display: grid; grid-template-columns: 1fr 1fr; border-radius: 16px; box-shadow: inset 0 0 0 1.5px #D9DDE6">
        <div style="padding: 12px 14px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: inset -1.5px 0 0 #D9DDE6">
          <span style="font-size: 14px; line-height: 20px; font-weight: 800; color: #565C6B">Quantity A</span>
          <span style="font-size: 24px; line-height: 30px; font-weight: 400">(<span style="font-style: italic">x</span> + 1)²</span>
        </div>
        <div style="padding: 12px 14px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span style="font-size: 14px; line-height: 20px; font-weight: 800; color: #565C6B">Quantity B</span>
          <span style="font-size: 24px; line-height: 30px; font-weight: 400"><span style="font-style: italic">x</span>² + 1</span>
        </div>
      </div>

      <!-- Выбран первый; верность в экзамене не показывается -->
      <div role="radiogroup" aria-label="Answer choices" style="display: flex; flex-direction: column; gap: 8px">
        <label style="min-height: 52px; box-sizing: border-box; border-radius: 16px; box-shadow: inset 0 0 0 1.5px #D9DDE6; background: #FFFFFF; padding: 12px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 16px; line-height: 22px; font-weight: 600">
          <input type="radio" name="qc-answer" value="a" checked style="appearance: none; -webkit-appearance: none; margin: 0; flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #8A90A0; background: #FFFFFF; cursor: pointer">
          <span>Quantity A is greater.</span>
        </label>
        <label style="min-height: 52px; box-sizing: border-box; border-radius: 16px; box-shadow: inset 0 0 0 1.5px #D9DDE6; background: #FFFFFF; padding: 12px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 16px; line-height: 22px; font-weight: 600">
          <input type="radio" name="qc-answer" value="b" style="appearance: none; -webkit-appearance: none; margin: 0; flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #8A90A0; background: #FFFFFF; cursor: pointer">
          <span>Quantity B is greater.</span>
        </label>
        <label style="min-height: 52px; box-sizing: border-box; border-radius: 16px; box-shadow: inset 0 0 0 1.5px #D9DDE6; background: #FFFFFF; padding: 12px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 16px; line-height: 22px; font-weight: 600">
          <input type="radio" name="qc-answer" value="c" style="appearance: none; -webkit-appearance: none; margin: 0; flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #8A90A0; background: #FFFFFF; cursor: pointer">
          <span>The two quantities are equal.</span>
        </label>
        <label style="min-height: 52px; box-sizing: border-box; border-radius: 16px; box-shadow: inset 0 0 0 1.5px #D9DDE6; background: #FFFFFF; padding: 12px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 16px; line-height: 22px; font-weight: 600">
          <input type="radio" name="qc-answer" value="d" style="appearance: none; -webkit-appearance: none; margin: 0; flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #8A90A0; background: #FFFFFF; cursor: pointer">
          <span>The relationship cannot be determined from the information given.</span>
        </label>
      </div>
    </div>
  </main>

  <!-- Управление экзаменом вместо MainButton: Back / Next во всю ширину -->
  <nav lang="en" aria-label="Question navigation" style="flex: none; padding: 12px 16px 20px; background: #FFFFFF; box-shadow: 0 -1px 0 #EEF0F4; display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
    <button type="button" style="height: 50px; border: 0; border-radius: 16px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #D9DDE6; color: #1E2230; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 4px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"></path></svg>
      Back
    </button>
    <button type="button" style="height: 50px; border: 0; border-radius: 16px; background: #1E2230; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 4px">
      Next
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"></path></svg>
    </button>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

}

</script>
</body>
</html>
