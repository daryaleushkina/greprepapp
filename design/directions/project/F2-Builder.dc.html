<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1B1E28}a:hover{color:#5A6070}
button,input{font:inherit}
button{cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
button:active,a:active{transform:scale(0.98)}
:focus-visible{outline:2px solid #5B4BC4;outline-offset:2px}
::selection{background:#ECE9FB;color:#1B1E28}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

@media (prefers-reduced-transparency: reduce){.glass{background:#FFFFFF!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: 'Onest', system-ui, sans-serif; color: #1B1E28; background: radial-gradient(130% 55% at 50% -12%, rgba(91, 75, 196, 0.14) 0%, rgba(91, 75, 196, 0.05) 45%, rgba(245, 246, 249, 0) 72%), #F5F6F9; display: flex; flex-direction: column">

  <button type="button" class="glass" aria-label="Назад" style="position: absolute; z-index: 5; top: 8px; left: 12px; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.62); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid rgba(0, 0, 0, 0.06); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 8px 24px rgba(0, 0, 0, 0.08); color: #1B1E28; display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg>
  </button>
  <button type="button" class="glass" aria-label="Меню" style="position: absolute; z-index: 5; top: 8px; right: 12px; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.62); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid rgba(0, 0, 0, 0.06); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 8px 24px rgba(0, 0, 0, 0.08); color: #1B1E28; display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"></circle><circle cx="12" cy="12" r="1.7" fill="currentColor"></circle><circle cx="18.5" cy="12" r="1.7" fill="currentColor"></circle></svg>
  </button>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 72px 16px 0; display: flex; flex-direction: column">

    <h1 style="margin: 0 4px; font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -0.025em">Новая тренировка</h1>

    <!-- Сначала готовые наборы: один уже выбран — можно сразу начинать -->
    <h2 id="f2-presets" style="margin: 24px 4px 10px; font-size: 15px; line-height: 20px; font-weight: 500; color: #5A6070">Готовые наборы</h2>
    <div role="radiogroup" aria-labelledby="f2-presets" style="background: #FFFFFF; border-radius: 24px; padding: 4px 0; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(27, 30, 40, 0.04)">

      <button type="button" role="radio" aria-checked="true" style="width: 100%; min-height: 58px; margin: 0; padding: 9px 18px; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; color: #1B1E28">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 17px; line-height: 22px; font-weight: 500">Как в прошлый раз</span>
          <span style="font-size: 14px; line-height: 18px; color: #5A6070"><span lang="en">Verbal · Text Completion</span> · 10 · Практика</span>
        </span>
        <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; border-radius: 50%; background: #5B4BC4; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 12.5l4 4 9-9"></path></svg>
        </span>
      </button>

      <button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 58px; margin: 0; padding: 9px 18px; border: 0; box-shadow: inset 0 0.5px 0 rgba(27, 30, 40, 0.1); background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; color: #1B1E28">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 17px; line-height: 22px; font-weight: 500">Мои ошибки</span>
          <span style="font-size: 14px; line-height: 18px; color: #5A6070">23 задания</span>
        </span>
        <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid rgba(27, 30, 40, 0.22)"></span>
      </button>

      <button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 58px; margin: 0; padding: 9px 18px; border: 0; box-shadow: inset 0 0.5px 0 rgba(27, 30, 40, 0.1); background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; color: #1B1E28">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 17px; line-height: 22px; font-weight: 500">Слабая тема: проценты и доли</span>
          <span style="font-size: 14px; line-height: 18px; color: #5A6070"><span lang="en" style="color: #11735F">Quant</span> · 8 вопросов</span>
        </span>
        <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid rgba(27, 30, 40, 0.22)"></span>
      </button>

      <button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 58px; margin: 0; padding: 9px 18px; border: 0; box-shadow: inset 0 0.5px 0 rgba(27, 30, 40, 0.1); background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; color: #1B1E28">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 17px; line-height: 22px; font-weight: 500">Проверка на время</span>
          <span style="font-size: 14px; line-height: 18px; color: #5A6070"><span lang="en">Verbal</span> · 12 вопросов · 18 мин, как секция</span>
        </span>
        <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid rgba(27, 30, 40, 0.22)"></span>
      </button>
    </div>

    <!-- Своя сборка — прямо на фоне, без коробки: три главных выбора, остальное свёрнуто -->
    <h2 style="margin: 28px 4px 4px; font-size: 15px; line-height: 20px; font-weight: 500; color: #5A6070">Или собрать свою</h2>
    <div style="padding: 0 4px; display: flex; flex-direction: column">

      <div style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <span id="f2-section" style="font-size: 17px; line-height: 22px">Раздел</span>
        <div role="group" aria-labelledby="f2-section" class="glass" style="flex: none; height: 40px; box-sizing: border-box; padding: 3px; border-radius: 20px; display: flex; background: rgba(226, 229, 237, 0.55); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid rgba(0, 0, 0, 0.06); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55)">
          <button type="button" aria-pressed="true" style="height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(27, 30, 40, 0.12), 0 2px 8px rgba(27, 30, 40, 0.06); color: #1B1E28; font-size: 15px; font-weight: 600"><span lang="en">Verbal</span></button>
          <button type="button" aria-pressed="false" style="height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: transparent; color: #4A4F5C; font-size: 15px"><span lang="en">Quant</span></button>
          <button type="button" aria-pressed="false" style="height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: transparent; color: #4A4F5C; font-size: 15px">Эссе</button>
        </div>
      </div>

      <!-- Любое число: нажал и ввёл, без готовых 5/10/20 -->
      <div style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <label for="f2-count" style="font-size: 17px; line-height: 22px">Вопросов</label>
        <input id="f2-count" type="number" inputmode="numeric" min="1" max="200" value="10" style="flex: none; width: 72px; height: 40px; box-sizing: border-box; margin: 0; padding: 0; border: 1px solid rgba(27, 30, 40, 0.1); border-radius: 20px; background: #FFFFFF; color: #1B1E28; font-size: 17px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums">
      </div>

      <div style="padding: 8px 0 6px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <span id="f2-mode" style="font-size: 17px; line-height: 22px">Режим</span>
          <div role="group" aria-labelledby="f2-mode" class="glass" style="flex: none; height: 40px; box-sizing: border-box; padding: 3px; border-radius: 20px; display: flex; background: rgba(226, 229, 237, 0.55); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid rgba(0, 0, 0, 0.06); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55)">
            <button type="button" aria-pressed="true" style="height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(27, 30, 40, 0.12), 0 2px 8px rgba(27, 30, 40, 0.06); color: #1B1E28; font-size: 15px; font-weight: 600">Практика</button>
            <button type="button" aria-pressed="false" style="height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: transparent; color: #4A4F5C; font-size: 15px">Проверка</button>
          </div>
        </div>
        <p style="margin: 0; font-size: 14px; line-height: 18px; color: #5A6070; text-align: right">Разбор после каждого вопроса, без таймера</p>
      </div>

      <button type="button" aria-expanded="false" style="width: 100%; min-height: 56px; margin: 4px 0 0; padding: 0; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; color: #1B1E28">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 17px; line-height: 22px">Тип, тема, сложность</span>
          <span style="font-size: 14px; line-height: 18px; color: #5A6070"><span lang="en">Text Completion</span> · все темы · любая</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6070" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9.5l6 6 6-6"></path></svg>
      </button>
    </div>
  </main>

  <div style="flex: none; position: relative; padding: 8px 16px 24px; background: #F5F6F9">
    <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: -28px; height: 28px; background: linear-gradient(rgba(245, 246, 249, 0), #F5F6F9); pointer-events: none"></span>
    <button type="button" style="display: block; width: 100%; height: 50px; border: 0; border-radius: 12px; background: #1B1E28; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; font-weight: 600">Начать · 10 вопросов · ~12 мин</button>
  </div>

</div>
