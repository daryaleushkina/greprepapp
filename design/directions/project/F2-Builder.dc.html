<!doctype html>
<html lang="ru">
<head>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&amp;display=swap">
<style>

::selection{background:#ECE8FF;color:#1E2230}
@media (prefers-reduced-motion: reduce){button,a{transition:none}button:active,a:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: 'Nunito', sans-serif; color: #1E2230; background: #F5F7FB; display: flex; flex-direction: column">

  <header style="flex: none; height: 52px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 6px; background: #F5F7FB">
    <div style="display: flex; justify-content: flex-start">
      <button type="button" style="height: 44px; padding: 0 10px 0 2px; border: 0; border-radius: 12px; background: transparent; color: #1E2230; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 2px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"></path></svg>
        Назад
      </button>
    </div>
    <div style="font-size: 17px; line-height: 22px; font-weight: 800; letter-spacing: -0.01em">Шаг</div>
    <div style="display: flex; justify-content: flex-end">
      <button type="button" aria-label="Меню" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: #E8EBF2; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="3.5" cy="9" r="1.6" fill="#1E2230"></circle><circle cx="9" cy="9" r="1.6" fill="#1E2230"></circle><circle cx="14.5" cy="9" r="1.6" fill="#1E2230"></circle></svg>
        </span>
      </button>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 12px">

    <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 800; letter-spacing: -0.02em">Новая тренировка</h1>

    <!-- Сводка одной фразой: всё уже выбрано как в прошлый раз; каждая часть раскрывает свой выбор (решение Даши) -->
    <div role="group" aria-label="Сводка тренировки" style="display: flex; flex-wrap: wrap; gap: 6px">
      <button type="button" aria-expanded="false" style="height: 44px; padding: 0 12px; border: 0; border-radius: 22px; background: #ECE8FF; color: #5B4BC4; font-size: 14px; font-weight: 800">Verbal</button>
      <button type="button" aria-expanded="true" style="height: 44px; padding: 0 10px 0 12px; border: 0; border-radius: 22px; background: #FFFFFF; color: #1E2230; box-shadow: inset 0 0 0 2px #1E2230; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px">
        Text Completion
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 14.5l6-6 6 6"></path></svg>
      </button>
      <button type="button" aria-expanded="false" style="height: 44px; padding: 0 12px; border: 0; border-radius: 22px; background: #FFFFFF; color: #1E2230; box-shadow: inset 0 0 0 1px #D9DDE6; font-size: 14px; font-weight: 700">все темы</button>
      <button type="button" aria-expanded="false" style="height: 44px; padding: 0 12px; border: 0; border-radius: 22px; background: #FFFFFF; color: #1E2230; box-shadow: inset 0 0 0 1px #D9DDE6; font-size: 14px; font-weight: 700">любая сложность</button>
      <button type="button" aria-expanded="false" style="height: 44px; padding: 0 12px; border: 0; border-radius: 22px; background: #FFFFFF; color: #1E2230; box-shadow: inset 0 0 0 1px #D9DDE6; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">10 вопросов</button>
      <button type="button" aria-expanded="false" style="height: 44px; padding: 0 12px; border: 0; border-radius: 22px; background: #FFFFFF; color: #1E2230; box-shadow: inset 0 0 0 1px #D9DDE6; font-size: 14px; font-weight: 700">Практика</button>
    </div>

    <!-- Лента настройки: узлы — цвета выбранного раздела; раскрытый шаг — кольцом -->
    <div style="display: flex; flex-direction: column; gap: 12px">

      <div style="position: relative; display: grid; grid-template-columns: 14px 1fr; column-gap: 12px; align-items: start">
        <span aria-hidden="true" style="position: absolute; left: 6px; top: 24px; bottom: -12px; width: 2px; background: #D9DDE6"></span>
        <span aria-hidden="true" style="position: relative; z-index: 1; margin-top: 17px; width: 14px; height: 14px; border-radius: 50%; background: #5B4BC4; box-shadow: 0 0 0 4px #F5F7FB"></span>
        <div role="radiogroup" aria-label="Раздел" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px">
          <button type="button" role="radio" aria-checked="true" style="height: 48px; border: 0; border-radius: 16px; background: #ECE8FF; box-shadow: inset 0 0 0 2px #5B4BC4; color: #5B4BC4; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 7px">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 6.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6.5l-4.5 3.5v-3.5a2 2 0 0 1-2-2z"></path><path d="M8.5 9h7"></path><path d="M8.5 12.5h4.5"></path></svg>
            Verbal
          </button>
          <button type="button" role="radio" aria-checked="false" style="height: 48px; border: 0; border-radius: 16px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D9DDE6; color: #1E2230; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 7px">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C7A5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 4.5v6"></path><path d="M4.5 7.5h6"></path><path d="M13.5 16.5h6"></path><path d="M18.5 5.5l-13 13"></path></svg>
            Quant
          </button>
          <button type="button" role="radio" aria-checked="false" style="height: 48px; border: 0; border-radius: 16px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D9DDE6; color: #1E2230; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 7px">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9501A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l4 4L9 19H5v-4z"></path><path d="M13 7l4 4"></path></svg>
            Эссе
          </button>
        </div>
      </div>

      <div style="position: relative; display: grid; grid-template-columns: 14px 1fr; column-gap: 12px; align-items: start">
        <span aria-hidden="true" style="position: absolute; left: 6px; top: 10px; bottom: -12px; width: 2px; background: #D9DDE6"></span>
        <span aria-hidden="true" style="position: relative; z-index: 1; margin-top: 3px; width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 3px solid #5B4BC4; box-shadow: 0 0 0 4px #F5F7FB"></span>
        <div>
          <div id="type-label" style="font-size: 15px; line-height: 20px; font-weight: 800">Тип задания</div>
          <div role="radiogroup" aria-labelledby="type-label" style="margin-top: 6px; background: #FFFFFF; border-radius: 18px; padding: 4px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 1px 2px rgba(30, 34, 48, 0.04), 0 4px 14px -4px rgba(30, 34, 48, 0.08)">
            <button type="button" role="radio" aria-checked="false" style="min-height: 44px; width: 100%; border: 0; border-radius: 14px; background: transparent; padding: 0 12px; display: flex; align-items: center; gap: 10px; text-align: left; color: #1E2230">
              <span style="flex: 1; font-size: 15px; line-height: 20px; font-weight: 700">Reading Comprehension</span>
              <span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #565C6B; font-variant-numeric: tabular-nums; white-space: nowrap">доступно 64</span>
              <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #8A90A0"></span>
            </button>
            <button type="button" role="radio" aria-checked="true" style="min-height: 44px; width: 100%; border: 0; border-radius: 14px; background: #ECE8FF; padding: 0 12px; display: flex; align-items: center; gap: 10px; text-align: left; color: #1E2230">
              <span style="flex: 1; font-size: 15px; line-height: 20px; font-weight: 800">Text Completion</span>
              <span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #565C6B; font-variant-numeric: tabular-nums; white-space: nowrap">доступно 58</span>
              <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; border-radius: 50%; background: #5B4BC4; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 12.5l4 4 9-9"></path></svg>
              </span>
            </button>
            <button type="button" role="radio" aria-checked="false" style="min-height: 44px; width: 100%; border: 0; border-radius: 14px; background: transparent; padding: 0 12px; display: flex; align-items: center; gap: 10px; text-align: left; color: #1E2230">
              <span style="flex: 1; font-size: 15px; line-height: 20px; font-weight: 700">Sentence Equivalence</span>
              <span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #565C6B; font-variant-numeric: tabular-nums; white-space: nowrap">доступно 41</span>
              <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #8A90A0"></span>
            </button>
          </div>
        </div>
      </div>

      <div style="position: relative; display: grid; grid-template-columns: 14px 1fr; column-gap: 12px; align-items: start">
        <span aria-hidden="true" style="position: absolute; left: 6px; top: 24px; bottom: -12px; width: 2px; background: #D9DDE6"></span>
        <span aria-hidden="true" style="position: relative; z-index: 1; margin-top: 17px; width: 14px; height: 14px; border-radius: 50%; background: #5B4BC4; box-shadow: 0 0 0 4px #F5F7FB"></span>
        <div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <span id="count-label" style="font-size: 15px; line-height: 20px; font-weight: 800">Вопросов</span>
          <div role="radiogroup" aria-labelledby="count-label" style="display: flex; gap: 6px">
            <button type="button" role="radio" aria-checked="false" style="width: 64px; height: 48px; border: 0; border-radius: 16px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D9DDE6; color: #1E2230; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums">5</button>
            <button type="button" role="radio" aria-checked="true" style="width: 64px; height: 48px; border: 0; border-radius: 16px; background: #ECE8FF; box-shadow: inset 0 0 0 2px #5B4BC4; color: #5B4BC4; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums">10</button>
            <button type="button" role="radio" aria-checked="false" style="width: 64px; height: 48px; border: 0; border-radius: 16px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D9DDE6; color: #1E2230; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums">20</button>
          </div>
        </div>
      </div>

      <div style="position: relative; display: grid; grid-template-columns: 14px 1fr; column-gap: 12px; align-items: start">
        <span aria-hidden="true" style="position: relative; z-index: 1; margin-top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #5B4BC4; box-shadow: 0 0 0 4px #F5F7FB"></span>
        <div>
          <div id="mode-label" style="font-size: 15px; line-height: 20px; font-weight: 800">Режим</div>
          <div role="radiogroup" aria-labelledby="mode-label" style="margin-top: 6px; background: #FFFFFF; border-radius: 18px; padding: 4px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 1px 2px rgba(30, 34, 48, 0.04), 0 4px 14px -4px rgba(30, 34, 48, 0.08)">
            <button type="button" role="radio" aria-checked="true" style="width: 100%; border: 0; border-radius: 14px; background: #ECE8FF; padding: 9px 12px; display: flex; flex-direction: column; gap: 0; text-align: left; color: #1E2230">
              <span style="display: flex; align-items: center; gap: 10px">
                <span style="flex: 1; font-size: 16px; line-height: 22px; font-weight: 800">Практика</span>
                <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; border-radius: 50%; background: #5B4BC4; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 12.5l4 4 9-9"></path></svg>
                </span>
              </span>
              <span style="font-size: 14px; line-height: 19px; font-weight: 600; color: #565C6B">разбор после каждого вопроса, без таймера</span>
            </button>
            <button type="button" role="radio" aria-checked="false" style="width: 100%; border: 0; border-radius: 14px; background: transparent; padding: 9px 12px; display: flex; flex-direction: column; gap: 0; text-align: left; color: #1E2230">
              <span style="display: flex; align-items: center; gap: 10px">
                <span style="flex: 1; font-size: 16px; line-height: 22px; font-weight: 700">Проверка</span>
                <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #8A90A0"></span>
              </span>
              <span style="font-size: 14px; line-height: 19px; font-weight: 600; color: #565C6B">разбор в конце, с таймером ~15 мин</span>
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- Быстрые наборы — вторично, под лентой -->
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <button type="button" style="height: 44px; padding: 0 14px 0 12px; border: 0; border-radius: 22px; background: transparent; box-shadow: inset 0 0 0 1px #D9DDE6; color: #1E2230; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 11.5a7.5 7.5 0 0 1 13-5l2 2"></path><path d="M19.5 4v4.5H15"></path><path d="M19.5 12.5a7.5 7.5 0 0 1-13 5l-2-2"></path><path d="M4.5 20v-4.5H9"></path></svg>
        Как в прошлый раз
      </button>
      <button type="button" style="height: 44px; padding: 0 14px 0 12px; border: 0; border-radius: 22px; background: transparent; box-shadow: inset 0 0 0 1px #D9DDE6; color: #1E2230; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7.5"></circle><circle cx="12" cy="12" r="3"></circle></svg>
        Мои ошибки · 23
      </button>
    </div>

  </main>

  <!-- Итог над кнопкой -->
  <div style="flex: none; position: relative; z-index: 2; padding: 10px 16px 0; background: #F5F7FB; display: flex; align-items: center; justify-content: center; gap: 6px; color: #565C6B">
    <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: -24px; height: 24px; background: linear-gradient(rgba(245, 247, 251, 0), #F5F7FB)"></span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4.5l3 2"></path></svg>
    <span style="font-size: 14px; line-height: 20px; font-weight: 700; font-variant-numeric: tabular-nums">~15 мин · разбор после каждого вопроса</span>
  </div>

  <!-- MainButton Telegram -->
  <div style="flex: none; padding: 12px 16px 20px; background: #F5F7FB">
    <button type="button" style="width: 100%; height: 50px; border: 0; border-radius: 16px; background: #1E2230; color: #FFFFFF; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums">Начать · 10 вопросов</button>
  </div>

</div>
