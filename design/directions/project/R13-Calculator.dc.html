<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
/* Токены «Шагов»: светлая и тёмная тема. В компонентах — только var(--…) */
.s{
--bg:#F5F6F9;--surface:#FFFFFF;--text:#1B1E28;--text-2:#5A6070;--line:rgba(27,30,40,.12);--fill:rgba(27,30,40,.06);
--accent:#1B1E28;--on-accent:#FFFFFF;--wrong:#C2410C;--wrong-tint:rgba(194,65,12,.10);
--verbal:#5B4BC4;--verbal-tint:rgba(91,75,196,.12);--quant:#11735F;--quant-tint:rgba(17,115,95,.12);
--words:#B4446C;--words-tint:rgba(180,68,108,.12);--essay:#9A5B00;--essay-tint:rgba(154,91,0,.12);--exam:#1B1E28;
--glow:rgba(91,75,196,.22);--glow-2:rgba(91,75,196,.07);
--glass:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.54));--glass-strong:linear-gradient(180deg,rgba(255,255,255,.90),rgba(255,255,255,.70));--glass-edge:rgba(0,0,0,.06);--glass-rim:rgba(255,255,255,.6);
--glass-shadow:0 10px 30px -10px rgba(30,30,60,.22);--tab-sel:rgba(27,30,40,.07);--focus:#5B4BC4;
}
.s.dark{
--bg:#0E0F14;--surface:#1A1C23;--text:#F2F3F7;--text-2:#A3A8B5;--line:rgba(255,255,255,.12);--fill:rgba(255,255,255,.08);
--accent:#F2F3F7;--on-accent:#111318;--wrong:#FF8A4C;--wrong-tint:rgba(255,138,76,.14);
--verbal:#A898FF;--verbal-tint:rgba(168,152,255,.16);--quant:#4FC4A7;--quant-tint:rgba(79,196,167,.16);
--words:#F28AB0;--words-tint:rgba(242,138,176,.16);--essay:#F0B45A;--essay-tint:rgba(240,180,90,.16);--exam:#F2F3F7;
--glow:rgba(130,110,255,.30);--glow-2:rgba(130,110,255,.08);
--glass:linear-gradient(180deg,rgba(64,66,80,.62),rgba(32,34,44,.50));--glass-strong:linear-gradient(180deg,rgba(48,50,62,.82),rgba(30,32,42,.72));--glass-edge:rgba(0,0,0,.35);--glass-rim:rgba(255,255,255,.12);
--glass-shadow:0 10px 30px -10px rgba(0,0,0,.6);--tab-sel:rgba(255,255,255,.10);--focus:#A898FF;
}
a{color:var(--text)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
button:active,a:active{transform:scale(0.98)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--verbal-tint)}
@media (prefers-reduced-motion: reduce){button,a{transition:none}button:active,a:active{transform:none}}
@media (prefers-reduced-transparency: reduce){.glass{background:var(--surface)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
</style>
</helmet>
<!-- Калькулятор открыт поверх вопроса 7 (ввод дробью); 19 ÷ 40 = 0.475 -->
<div class="s {{themeClass}}" style="--glow: rgba(17,115,95,.20); --glow-2: rgba(17,115,95,.06); width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: 'Onest', system-ui, sans-serif; color: var(--text); background: radial-gradient(120% 52% at 50% -10%, var(--glow) 0%, var(--glow-2) 48%, transparent 74%), var(--bg); display: flex; flex-direction: column">
  <!-- Шапку рисует Telegram: стеклянные круги поверх содержимого -->
  <button type="button" class="glass" aria-label="Назад" style="position: absolute; z-index: 6; top: 8px; left: 12px; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg>
  </button>
  <button type="button" class="glass" aria-label="Меню" style="position: absolute; z-index: 6; top: 8px; right: 12px; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"></circle><circle cx="12" cy="12" r="1.7" fill="currentColor"></circle><circle cx="18.5" cy="12" r="1.7" fill="currentColor"></circle></svg>
  </button>
  <!-- Прогресс сессии — стеклянная плашка между кругами шапки -->
  <div class="glass" role="img" aria-label="Вопрос 7 из 10" style="position: absolute; z-index: 6; top: 12px; left: 50%; transform: translateX(-50%); height: 36px; box-sizing: border-box; padding: 0 14px; border-radius: 18px; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: flex; align-items: center; gap: 10px; white-space: nowrap">
    <span aria-hidden="true" style="display: flex; align-items: center; gap: 5px"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--accent)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--accent)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--wrong)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--accent)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--accent)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--accent)"></span><span style="width: 11px; height: 11px; box-sizing: border-box; border-radius: 50%; border: 2.5px solid var(--accent)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--line)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--line)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--line)"></span></span>
    <span aria-hidden="true" style="font-size: 14px; line-height: 18px; font-weight: 600; font-variant-numeric: tabular-nums">7 из 10</span>
  </div>
  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 64px 16px 0; display: flex; flex-direction: column">
    <section aria-label="Задание" style="flex: none; border-radius: 24px; padding: 14px 18px 20px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <span lang="en" style="font-size: 13px; line-height: 18px; color: var(--text-2)">Quant · Numeric entry</span>
        <button type="button" class="glass" style="flex: none; height: 36px; box-sizing: border-box; padding: 0 12px 0 10px; border-radius: 18px; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); color: var(--text); text-decoration: none; font-size: 14px; line-height: 18px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"></rect><path d="M8.5 7.5h7"></path><path d="M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"></path></svg>Калькулятор</button>
      </div>
      <p lang="en" style="margin: 14px 0 0; font-size: 17px; line-height: 25px">Of the 40 students in a class, 15 study French, 10 study Spanish, and 4 study both. What fraction of the students study neither language?</p>
      <p lang="en" style="margin: 6px 0 0; font-size: 15px; line-height: 21px; color: var(--text-2)">Give your answer as a fraction.</p>
      <!-- Ответ дробью: числитель над знаменателем, как в GRE -->
      <div role="group" aria-label="Ответ дробью" style="margin-top: 22px; align-self: center; display: flex; flex-direction: column; align-items: center; gap: 10px">
        <input type="text" inputmode="numeric" aria-label="Числитель" value="19" style="width: 104px; height: 54px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); text-align: center; font-size: 24px; line-height: 30px; font-weight: 500; font-variant-numeric: tabular-nums; outline: none">
        <span aria-hidden="true" style="width: 128px; height: 2px; border-radius: 1px; background: var(--text)"></span>
        <input type="text" inputmode="numeric" aria-label="Знаменатель" value="40" style="width: 104px; height: 54px; box-sizing: border-box; border-radius: 14px; border: 2px solid var(--quant); background: var(--surface); text-align: center; font-size: 24px; line-height: 30px; font-weight: 500; font-variant-numeric: tabular-nums; outline: none">
      </div>
      <p style="margin: 16px 0 0; text-align: center; font-size: 14px; line-height: 20px; color: var(--text-2)">Сокращать дробь не нужно</p>
    </section>
  </main>

  <!-- Подложка: вопрос под шторкой выцветает к фону (в обеих темах) -->
  <span aria-hidden="true" style="position: absolute; z-index: 5; left: 0; right: 0; top: 0; bottom: 82px; background: var(--bg); opacity: .62"></span>
  <!-- Шторка калькулятора — стекло над вопросом; нижние кнопки Telegram остаются под ней -->
  <section role="dialog" aria-label="Калькулятор" class="glass" style="position: absolute; z-index: 6; left: 8px; right: 8px; bottom: 90px; box-sizing: border-box; padding: 8px 14px 16px; border-radius: 32px; background: var(--glass-strong); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: flex; flex-direction: column">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--line)"></span>
    <div style="margin-top: 6px; display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 600">Калькулятор</h2>
      <button type="button" aria-label="Закрыть калькулятор" style="width: 44px; height: 44px; margin-right: -6px; border: 0; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center"><span style="width: 30px; height: 30px; border-radius: 50%; background: var(--fill); display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></span></button>
    </div>
    <output aria-label="Табло" style="margin-top: 4px; height: 64px; box-sizing: border-box; padding: 0 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text-2)">M</span>
      <span style="font-size: 32px; line-height: 38px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.01em">0.475</span>
    </output>
    <div lang="en" style="margin-top: 12px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
        <button type="button" aria-label="Вызвать из памяти" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--fill); border: 0; color: var(--text-2); font-size: 15px">MR</button>
        <button type="button" aria-label="Очистить память" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--fill); border: 0; color: var(--text-2); font-size: 15px">MC</button>
        <button type="button" aria-label="Добавить в память" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--fill); border: 0; color: var(--text-2); font-size: 15px">M+</button>
        <button type="button" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--fill); border: 0; color: var(--text)">(</button>
        <button type="button" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--fill); border: 0; color: var(--text)">)</button>
        <button type="button" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--surface); border: 1px solid var(--line); color: var(--text)">7</button>
        <button type="button" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--surface); border: 1px solid var(--line); color: var(--text)">8</button>
        <button type="button" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--surface); border: 1px solid var(--line); color: var(--text)">9</button>
        <button type="button" aria-label="Разделить" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--fill); border: 0; color: var(--text)">÷</button>
        <button type="button" aria-label="Сбросить всё" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--fill); border: 0; color: var(--text)">C</button>
        <button type="button" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--surface); border: 1px solid var(--line); color: var(--text)">4</button>
        <button type="button" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--surface); border: 1px solid var(--line); color: var(--text)">5</button>
        <button type="button" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--surface); border: 1px solid var(--line); color: var(--text)">6</button>
        <button type="button" aria-label="Умножить" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--fill); border: 0; color: var(--text)">×</button>
        <button type="button" aria-label="Стереть ввод" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--fill); border: 0; color: var(--text)">CE</button>
        <button type="button" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--surface); border: 1px solid var(--line); color: var(--text)">1</button>
        <button type="button" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--surface); border: 1px solid var(--line); color: var(--text)">2</button>
        <button type="button" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--surface); border: 1px solid var(--line); color: var(--text)">3</button>
        <button type="button" aria-label="Вычесть" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--fill); border: 0; color: var(--text)">−</button>
        <button type="button" aria-label="Квадратный корень" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--fill); border: 0; color: var(--text)">√</button>
        <button type="button" aria-label="Сменить знак" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--fill); border: 0; color: var(--text)">±</button>
        <button type="button" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--surface); border: 1px solid var(--line); color: var(--text)">0</button>
        <button type="button" aria-label="Точка" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--surface); border: 1px solid var(--line); color: var(--text)">.</button>
        <button type="button" aria-label="Сложить" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--fill); border: 0; color: var(--text)">+</button>
        <button type="button" aria-label="Равно" style="height: 46px; border-radius: 14px; font-size: 18px; line-height: 22px; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--accent); border: 0; color: var(--on-accent)">=</button>
    </div>
    <!-- Перенести число с табло в поле ответа — как у ETS -->
    <button type="button" lang="en" style="margin-top: 12px; height: 46px; border: 0; border-radius: 23px; background: var(--quant-tint); color: var(--quant); font-size: 16px; line-height: 20px; font-weight: 600">Transfer Display</button>
  </section>
  <!-- Нижняя панель Telegram: содержимое уходит под растушёвку; кнопки рисует клиент -->
  <div style="flex: none; position: relative; z-index: 4; padding: 8px 16px 24px; background: var(--bg); display: flex; gap: 10px">
    <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: -28px; height: 28px; background: linear-gradient(transparent, var(--bg)); pointer-events: none"></span>
    <button type="button" style="flex: none; width: 128px; height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; font-weight: 600">Пропустить</button>
    <button type="button" style="flex: 1; height: 50px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">Проверить</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

const dark = this.props.dark ?? false;
return { themeClass: dark ? 'dark' : '' };
}
}
</script>
