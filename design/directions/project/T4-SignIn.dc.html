<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
/* Токены «Шагов»: светлая и тёмная тема. В компонентах — только var(--…) */
.s{
--bg:#F5F6F9;--surface:#FFFFFF;--text:#1B1E28;--text-2:#5A6070;--line:rgba(27,30,40,.12);--fill:rgba(27,30,40,.06);
--accent:#1B1E28;--on-accent:#FFFFFF;--wrong:#C2410C;--wrong-tint:rgba(194,65,12,.10);
--verbal:#5B4BC4;--verbal-tint:rgba(91,75,196,.12);--quant:#11735F;--quant-tint:rgba(17,115,95,.12);
--words:#B4446C;--words-tint:rgba(180,68,108,.12);--essay:#9A5B00;--essay-tint:rgba(154,91,0,.12);--exam:#1B1E28;
--glow:rgba(91,75,196,.22);--glow-2:rgba(91,75,196,.07);
--glass:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.54));--glass-strong:linear-gradient(180deg,rgba(255,255,255,.90),rgba(255,255,255,.70));--glass-edge:rgba(0,0,0,.06);--glass-rim:rgba(255,255,255,.6);
--glass-shadow:0 10px 30px -10px rgba(30,30,60,.22);--tab-sel:rgba(27,30,40,.07);--focus:#5B4BC4;
}
.s.dark{
--bg:#0E0F14;--surface:#1A1C23;--text:#F2F3F7;--text-2:#A3A8B5;--line:rgba(255,255,255,.12);--fill:rgba(255,255,255,.08);
--accent:#F2F3F7;--on-accent:#111318;--wrong:#FF8A4C;--wrong-tint:rgba(255,138,76,.14);
--verbal:#A898FF;--verbal-tint:rgba(168,152,255,.16);--quant:#4FC4A7;--quant-tint:rgba(79,196,167,.16);
--words:#F28AB0;--words-tint:rgba(242,138,176,.16);--essay:#F0B45A;--essay-tint:rgba(240,180,90,.16);--exam:#F2F3F7;
--glow:rgba(130,110,255,.30);--glow-2:rgba(130,110,255,.08);
--glass:linear-gradient(180deg,rgba(64,66,80,.62),rgba(32,34,44,.50));--glass-strong:linear-gradient(180deg,rgba(48,50,62,.82),rgba(30,32,42,.72));--glass-edge:rgba(0,0,0,.35);--glass-rim:rgba(255,255,255,.12);
--glass-shadow:0 10px 30px -10px rgba(0,0,0,.6);--tab-sel:rgba(255,255,255,.10);--focus:#A898FF;
}
a{color:var(--text)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
button:active,a:active{transform:scale(0.98)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--verbal-tint)}
@media (prefers-reduced-motion: reduce){button,a{transition:none}button:active,a:active{transform:none}}
@media (prefers-reduced-transparency: reduce){.glass{background:var(--surface)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
</style>
</helmet>
<div class="s {{themeClass}}" style="width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: 'Onest', system-ui, sans-serif; color: var(--text); background: radial-gradient(120% 52% at 50% -10%, var(--glow) 0%, var(--glow-2) 48%, transparent 74%), var(--bg); display: flex; flex-direction: column">
  <!-- Вход вне Telegram (сайт и приложения): шапки Telegram здесь нет -->
  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 0 24px 28px; display: flex; flex-direction: column">
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px">
      <!-- Знак — та же лента шагов, что в приложении -->
      <span aria-hidden="true" class="glass" style="width: 64px; height: 64px; box-sizing: border-box; border-radius: 20px; color: var(--verbal); display: flex; align-items: center; justify-content: center; background: var(--glass-strong); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow)">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none"><path d="M9 7.5v15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".45"></path><circle cx="9" cy="6" r="3.6" fill="currentColor"></circle><circle cx="9" cy="15" r="2.6" stroke="currentColor" stroke-width="1.8"></circle><circle cx="9" cy="24" r="2.6" stroke="currentColor" stroke-width="1.8"></circle><path d="M16 6h8M16 15h6M16 24h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
      </span>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <h1 style="margin: 0; font-size: 34px; line-height: 40px; font-weight: 600; letter-spacing: -0.025em">[Имя]</h1>
        <p style="margin: 0; max-width: 320px; font-size: 17px; line-height: 25px; color: var(--text-2)">Подготовка к GRE® с разбором каждой ошибки — по-русски и по-английски.</p>
      </div>
    </div>

    <!-- Три равноценных способа входа: правило App Store 4.8 требует Apple рядом с Telegram -->
    <div style="display: flex; flex-direction: column; gap: 10px">
      <button type="button" class="glass" style="height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 600; background: var(--glass-strong); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 4.4 3.9 10.9c-.9.4-.9 1.6 0 1.9l4.1 1.4 1.6 4.9c.3.8 1.3 1 1.9.4l2.3-2.2 4.3 3.1c.7.5 1.6.1 1.8-.7l2.6-13.1c.2-.9-.7-1.6-1.7-1.2z"></path><path d="m8 14.2 8.8-6"></path></svg>Войти через Telegram</button>
      <button type="button" class="glass" style="height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 600; background: var(--glass-strong); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path fill="currentColor" stroke="none" d="M16.37 12.73c-.02-2.02 1.65-2.99 1.72-3.04-.94-1.37-2.4-1.56-2.92-1.58-1.24-.13-2.42.73-3.05.73-.63 0-1.6-.71-2.63-.69-1.35.02-2.6.79-3.3 2-1.41 2.44-.36 6.05 1.01 8.03.67.97 1.47 2.06 2.51 2.02 1.01-.04 1.39-.65 2.6-.65 1.22 0 1.56.65 2.62.63 1.08-.02 1.77-.99 2.43-1.96.77-1.12 1.08-2.21 1.1-2.27-.02-.01-2.11-.81-2.13-3.22zM14.38 6.79c.55-.67.93-1.6.82-2.54-.8.03-1.77.53-2.34 1.2-.51.59-.96 1.55-.84 2.46.89.07 1.81-.45 2.36-1.12z"></path></svg>Войти с Apple</button>
      <button type="button" class="glass" style="height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 600; background: var(--glass-strong); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.6 12.2c0-.6 0-1.1-.1-1.6H12v3.1h4.3a3.7 3.7 0 0 1-1.6 2.4"></path><path d="M18.4 17.4A7.5 7.5 0 1 1 17 6.7"></path></svg>Войти с Google</button>
    </div>

    <p style="margin: 18px 0 0; font-size: 13px; line-height: 18px; color: var(--text-2); text-align: center">Продолжая, вы принимаете <a href="#" style="color: var(--text-2); text-underline-offset: 3px">условия</a> и <a href="#" style="color: var(--text-2); text-underline-offset: 3px">политику конфиденциальности</a>.</p>
    <p lang="en" style="margin: 10px 0 0; font-size: 13px; line-height: 18px; color: var(--text-2); text-align: center">GRE® is a registered trademark of Educational Testing Service (ETS). This product is not endorsed or approved by ETS.</p>
  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
return { themeClass: dark ? 'dark' : '' };
}
}
</script>
</body>
</html>
