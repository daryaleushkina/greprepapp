<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Разбор — Пробный экзамен</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..600&amp;family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&amp;display=swap">
<style>
body{margin:0}
a{color:#111111;text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:#4D4D4D}
button{font:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
a,button{transition:transform 140ms cubic-bezier(0.23,1,0.32,1)}
button:active,a:active{transform:scale(0.98)}
:focus-visible{outline:2px solid #111111;outline-offset:2px}
::selection{background:#FFE24A;color:#111111}
@media (prefers-reduced-motion: reduce){a,button{transition:none}button:active,a:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: 'Literata', Georgia, serif; font-size: 16px; line-height: 1.5; color: #111111; background: #FFFFFF; display: flex; flex-direction: column">

  <header style="flex: none; height: 52px; box-sizing: border-box; padding: 0 6px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
    <button type="button" style="justify-self: start; height: 44px; padding: 0 10px 0 2px; border: 0; background: transparent; display: flex; align-items: center; gap: 2px; font-size: 16px; font-weight: 500; color: #111111">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5" vector-effect="non-scaling-stroke"></path></svg>
      Назад
    </button>
    <div style="font-family: 'Old Standard TT', Georgia, serif; font-size: 17px; line-height: 1; font-weight: 700; letter-spacing: 0.01em">Разбор</div>
    <button type="button" aria-label="Меню" style="justify-self: end; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
      <span style="width: 32px; height: 32px; box-sizing: border-box; border: 1px solid #D9D9D9; border-radius: 50%; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7" fill="#111111"></circle><circle cx="12" cy="12" r="1.7" fill="#111111"></circle><circle cx="18.5" cy="12" r="1.7" fill="#111111"></circle></svg>
      </span>
    </button>
  </header>

  <section lang="en" aria-label="Exam controls" style="flex: none; padding: 2px 16px 14px; border-bottom: 1px solid #111111">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-size: 17px; line-height: 1.3; font-weight: 600">Quantitative Reasoning</h1>
      <span role="timer" aria-label="Time remaining 14 minutes 32 seconds" style="font-size: 19px; line-height: 1.3; font-weight: 600; font-variant-numeric: tabular-nums lining-nums; letter-spacing: 0.02em">14:32</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px">
      <span style="font-size: 14px; color: #4D4D4D; font-variant-numeric: tabular-nums">Section 1 of 2 · Question 7 of 12</span>
      <button type="button" aria-pressed="false" style="height: 44px; padding: 0 0 0 12px; border: 0; background: transparent; font-size: 14px; font-weight: 500; color: #111111; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px">Hide Time</button>
    </div>

    <div role="img" aria-label="Sections: Analytical Writing, Verbal 1 and Verbal 2 done; now Quant 1; next Quant 2" style="margin-top: 4px; display: grid; grid-template-columns: repeat(5, 1fr); column-gap: 4px; row-gap: 6px; align-items: end">
      <span style="font-size: 13px; line-height: 1.2; color: #4D4D4D">AW</span>
      <span style="font-size: 13px; line-height: 1.2; color: #4D4D4D">Verbal 1</span>
      <span style="font-size: 13px; line-height: 1.2; color: #4D4D4D">Verbal 2</span>
      <span style="font-size: 13px; line-height: 1.2; font-weight: 600; color: #111111">Quant 1</span>
      <span style="font-size: 13px; line-height: 1.2; color: #4D4D4D">Quant 2</span>
      <span style="height: 3px; background: #111111"></span>
      <span style="height: 3px; background: #111111"></span>
      <span style="height: 3px; background: #111111"></span>
      <span style="height: 7px; background: #111111"></span>
      <span style="height: 3px; background: #D9D9D9"></span>
    </div>

    <div style="margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px">
      <button type="button" aria-pressed="false" style="box-sizing: border-box; height: 44px; padding: 0; border: 1px solid #111111; border-radius: 4px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 500; color: #111111">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5h10v15l-5-3.6-5 3.6z" vector-effect="non-scaling-stroke"></path></svg>
        Mark
      </button>
      <button type="button" style="box-sizing: border-box; height: 44px; padding: 0; border: 1px solid #111111; border-radius: 4px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 500; color: #111111">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7h11M9 12h11M9 17h11" vector-effect="non-scaling-stroke"></path><path d="M4.5 7h.5M4.5 12h.5M4.5 17h.5" vector-effect="non-scaling-stroke"></path></svg>
        Review
      </button>
      <button type="button" style="box-sizing: border-box; height: 44px; padding: 0; border: 1px solid #111111; border-radius: 4px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 500; color: #111111">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="3.5" width="13" height="17" rx="1.5" vector-effect="non-scaling-stroke"></rect><path d="M8.5 7.5h7" vector-effect="non-scaling-stroke"></path><path d="M8.5 12h1M11.5 12h1M14.5 12h1M8.5 16h1M11.5 16h1M14.5 16h1" vector-effect="non-scaling-stroke"></path></svg>
        Calculator
      </button>
    </div>
  </section>

  <main lang="en" style="flex: 1; min-height: 0; overflow: hidden; padding: 20px 16px 0; display: flex; flex-direction: column">

    <p style="margin: 0; text-align: center; font-size: 20px; line-height: 1.4"><span style="font-style: italic">x</span>&nbsp;&gt;&nbsp;0</p>

    <table style="margin-top: 16px; width: 100%; border-collapse: collapse; border-top: 1.5px solid #111111; border-bottom: 1.5px solid #111111">
      <thead>
        <tr>
          <th scope="col" style="width: 50%; padding: 8px 0; border-bottom: 1px solid #111111; font-size: 15px; line-height: 1.4; font-weight: 600; text-align: center">Quantity A</th>
          <th scope="col" style="width: 50%; padding: 8px 0; border-bottom: 1px solid #111111; font-size: 15px; line-height: 1.4; font-weight: 600; text-align: center">Quantity B</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td style="padding: 18px 0 16px; text-align: center; font-size: 22px; line-height: 1.3">(<span style="font-style: italic">x</span> + 1)<sup style="font-size: 0.62em; line-height: 0">2</sup></td>
          <td style="padding: 18px 0 16px; text-align: center; font-size: 22px; line-height: 1.3"><span style="font-style: italic">x</span><sup style="font-size: 0.62em; line-height: 0">2</sup> + 1</td>
        </tr>
      </tbody>
    </table>

    <p id="e5-prompt" style="margin: 18px 0 0; font-size: 16px; line-height: 1.5">Compare Quantity A and Quantity B.</p>

    <div role="radiogroup" aria-labelledby="e5-prompt" style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px">
      <button type="button" role="radio" aria-checked="true" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 10px 14px; border: 1.5px solid #111111; border-radius: 4px; background: #FFFFFF; display: flex; align-items: center; gap: 14px; text-align: left; font-size: 16px; line-height: 1.4; color: #111111">
        <svg width="24" height="18" viewBox="0 0 24 18" aria-hidden="true" style="flex: none"><ellipse cx="12" cy="9" rx="10.25" ry="7.25" fill="#111111" stroke="#111111" stroke-width="1.5"></ellipse></svg>
        <span>Quantity A is greater.</span>
      </button>
      <button type="button" role="radio" aria-checked="false" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid #D9D9D9; border-radius: 4px; background: #FFFFFF; display: flex; align-items: center; gap: 14px; text-align: left; font-size: 16px; line-height: 1.4; color: #111111">
        <svg width="24" height="18" viewBox="0 0 24 18" aria-hidden="true" style="flex: none"><ellipse cx="12" cy="9" rx="10.25" ry="7.25" fill="none" stroke="#4D4D4D" stroke-width="1.5"></ellipse></svg>
        <span>Quantity B is greater.</span>
      </button>
      <button type="button" role="radio" aria-checked="false" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid #D9D9D9; border-radius: 4px; background: #FFFFFF; display: flex; align-items: center; gap: 14px; text-align: left; font-size: 16px; line-height: 1.4; color: #111111">
        <svg width="24" height="18" viewBox="0 0 24 18" aria-hidden="true" style="flex: none"><ellipse cx="12" cy="9" rx="10.25" ry="7.25" fill="none" stroke="#4D4D4D" stroke-width="1.5"></ellipse></svg>
        <span>The two quantities are equal.</span>
      </button>
      <button type="button" role="radio" aria-checked="false" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid #D9D9D9; border-radius: 4px; background: #FFFFFF; display: flex; align-items: center; gap: 14px; text-align: left; font-size: 16px; line-height: 1.4; color: #111111">
        <svg width="24" height="18" viewBox="0 0 24 18" aria-hidden="true" style="flex: none"><ellipse cx="12" cy="9" rx="10.25" ry="7.25" fill="none" stroke="#4D4D4D" stroke-width="1.5"></ellipse></svg>
        <span>The relationship cannot be determined from the information given.</span>
      </button>
    </div>

  </main>

  <nav lang="en" aria-label="Question navigation" style="flex: none; padding: 12px 16px 20px; border-top: 1px solid #D9D9D9; background: #FFFFFF; display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
    <button type="button" style="box-sizing: border-box; height: 50px; border: 1px solid #111111; border-radius: 4px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 17px; font-weight: 600; color: #111111">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5" vector-effect="non-scaling-stroke"></path></svg>
      Back
    </button>
    <button type="button" style="box-sizing: border-box; height: 50px; border: 0; border-radius: 4px; background: #111111; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 17px; font-weight: 600; color: #FFFFFF">
      Next
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5" vector-effect="non-scaling-stroke"></path></svg>
    </button>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
