<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Quant — график</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
/* Токены «Шагов»: светлая и тёмная тема. В компонентах — только var(--…) */
.s{
--bg:#F5F6F9;--surface:#FFFFFF;--text:#1B1E28;--text-2:#5A6070;--line:rgba(27,30,40,.12);--fill:rgba(27,30,40,.06);
--accent:#1B1E28;--on-accent:#FFFFFF;--wrong:#C2410C;--wrong-tint:rgba(194,65,12,.10);
--verbal:#5B4BC4;--verbal-tint:rgba(91,75,196,.12);--quant:#11735F;--quant-tint:rgba(17,115,95,.12);
--words:#B4446C;--words-tint:rgba(180,68,108,.12);--essay:#9A5B00;--essay-tint:rgba(154,91,0,.12);--exam:#1B1E28;
--glow:rgba(91,75,196,.22);--glow-2:rgba(91,75,196,.07);
--glass:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.54));--glass-strong:linear-gradient(180deg,rgba(255,255,255,.90),rgba(255,255,255,.70));--glass-edge:rgba(0,0,0,.06);--glass-rim:rgba(255,255,255,.6);
--glass-shadow:0 10px 30px -10px rgba(30,30,60,.22);--tab-sel:rgba(27,30,40,.07);--focus:#5B4BC4;
}
.s.dark{
--bg:#0E0F14;--surface:#1A1C23;--text:#F2F3F7;--text-2:#A3A8B5;--line:rgba(255,255,255,.12);--fill:rgba(255,255,255,.08);
--accent:#F2F3F7;--on-accent:#111318;--wrong:#FF8A4C;--wrong-tint:rgba(255,138,76,.14);
--verbal:#A898FF;--verbal-tint:rgba(168,152,255,.16);--quant:#4FC4A7;--quant-tint:rgba(79,196,167,.16);
--words:#F28AB0;--words-tint:rgba(242,138,176,.16);--essay:#F0B45A;--essay-tint:rgba(240,180,90,.16);--exam:#F2F3F7;
--glow:rgba(130,110,255,.30);--glow-2:rgba(130,110,255,.08);
--glass:linear-gradient(180deg,rgba(64,66,80,.62),rgba(32,34,44,.50));--glass-strong:linear-gradient(180deg,rgba(48,50,62,.82),rgba(30,32,42,.72));--glass-edge:rgba(0,0,0,.35);--glass-rim:rgba(255,255,255,.12);
--glass-shadow:0 10px 30px -10px rgba(0,0,0,.6);--tab-sel:rgba(255,255,255,.10);--focus:#A898FF;
}
a{color:var(--text)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
button:active,a:active{transform:scale(0.98)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--verbal-tint)}
@media (prefers-reduced-motion: reduce){button,a{transition:none}button:active,a:active{transform:none}}
@media (prefers-reduced-transparency: reduce){.glass{background:var(--surface)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
</style>
</helmet>
<!-- Тренировка Quant, вопрос 8 из 10: данные на графике, выбран вариант C -->
<div class="s {{themeClass}}" style="--glow: rgba(17,115,95,.20); --glow-2: rgba(17,115,95,.06); width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: 'Onest', system-ui, sans-serif; color: var(--text); background: radial-gradient(120% 52% at 50% -10%, var(--glow) 0%, var(--glow-2) 48%, transparent 74%), var(--bg); display: flex; flex-direction: column">
  <!-- Шапку рисует Telegram: стеклянные круги поверх содержимого -->
  <button type="button" class="glass" aria-label="Назад" style="position: absolute; z-index: 6; top: 8px; left: 12px; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg>
  </button>
  <button type="button" class="glass" aria-label="Меню" style="position: absolute; z-index: 6; top: 8px; right: 12px; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"></circle><circle cx="12" cy="12" r="1.7" fill="currentColor"></circle><circle cx="18.5" cy="12" r="1.7" fill="currentColor"></circle></svg>
  </button>
  <!-- Прогресс сессии — стеклянная плашка между кругами шапки -->
  <div class="glass" role="img" aria-label="Вопрос 8 из 10" style="position: absolute; z-index: 6; top: 12px; left: 50%; transform: translateX(-50%); height: 36px; box-sizing: border-box; padding: 0 14px; border-radius: 18px; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: flex; align-items: center; gap: 10px; white-space: nowrap">
    <span aria-hidden="true" style="display: flex; align-items: center; gap: 5px"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--accent)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--accent)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--wrong)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--accent)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--accent)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--accent)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--accent)"></span><span style="width: 11px; height: 11px; box-sizing: border-box; border-radius: 50%; border: 2.5px solid var(--accent)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--line)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--line)"></span></span>
    <span aria-hidden="true" style="font-size: 14px; line-height: 18px; font-weight: 600; font-variant-numeric: tabular-nums">8 из 10</span>
  </div>
  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 64px 16px 0; display: flex; flex-direction: column">
    <section aria-label="Задание" style="flex: none; border-radius: 24px; padding: 14px 18px 20px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <span lang="en" style="font-size: 13px; line-height: 18px; color: var(--text-2)">Quant · Data interpretation</span>
        <button type="button" class="glass" style="flex: none; height: 36px; box-sizing: border-box; padding: 0 12px 0 10px; border-radius: 18px; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); color: var(--text); text-decoration: none; font-size: 14px; line-height: 18px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"></rect><path d="M8.5 7.5h7"></path><path d="M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"></path></svg>Калькулятор</button>
      </div>
      <p lang="en" style="margin: 12px 0 0; font-size: 14px; line-height: 20px; font-weight: 500">Books borrowed from a city library, January–May (thousands)</p>
      <svg role="img" aria-label="Столбчатая диаграмма: январь 12, февраль 9, март 15, апрель 18, май 14 тысяч книг" width="100%" height="150" viewBox="0 0 318 150" style="display: block; margin-top: 10px; overflow: visible"><line x1="30" y1="120.0" x2="312" y2="120.0" style="stroke: var(--line); stroke-width: 1"></line><text x="22" y="124.0" text-anchor="end" style="fill: var(--text-2); font-size: 11px; font-family: inherit">0</text><line x1="30" y1="92.5" x2="312" y2="92.5" style="stroke: var(--line); stroke-width: 1"></line><text x="22" y="96.5" text-anchor="end" style="fill: var(--text-2); font-size: 11px; font-family: inherit">5</text><line x1="30" y1="65.0" x2="312" y2="65.0" style="stroke: var(--line); stroke-width: 1"></line><text x="22" y="69.0" text-anchor="end" style="fill: var(--text-2); font-size: 11px; font-family: inherit">10</text><line x1="30" y1="37.5" x2="312" y2="37.5" style="stroke: var(--line); stroke-width: 1"></line><text x="22" y="41.5" text-anchor="end" style="fill: var(--text-2); font-size: 11px; font-family: inherit">15</text><line x1="30" y1="10.0" x2="312" y2="10.0" style="stroke: var(--line); stroke-width: 1"></line><text x="22" y="14.0" text-anchor="end" style="fill: var(--text-2); font-size: 11px; font-family: inherit">20</text><rect x="43" y="54.0" width="30" height="66.0" rx="5" style="fill: var(--quant)"></rect><text x="58" y="138" text-anchor="middle" style="fill: var(--text-2); font-size: 11px; font-family: inherit">Jan</text><rect x="99" y="70.5" width="30" height="49.5" rx="5" style="fill: var(--quant)"></rect><text x="114" y="138" text-anchor="middle" style="fill: var(--text-2); font-size: 11px; font-family: inherit">Feb</text><rect x="155" y="37.5" width="30" height="82.5" rx="5" style="fill: var(--quant)"></rect><text x="170" y="138" text-anchor="middle" style="fill: var(--text-2); font-size: 11px; font-family: inherit">Mar</text><rect x="211" y="21.0" width="30" height="99.0" rx="5" style="fill: var(--quant)"></rect><text x="226" y="138" text-anchor="middle" style="fill: var(--text-2); font-size: 11px; font-family: inherit">Apr</text><rect x="267" y="43.0" width="30" height="77.0" rx="5" style="fill: var(--quant)"></rect><text x="282" y="138" text-anchor="middle" style="fill: var(--text-2); font-size: 11px; font-family: inherit">May</text></svg>
      <p lang="en" style="margin: 10px 0 0; font-size: 17px; line-height: 25px">By what percent did the number of books borrowed increase from February to April?</p>
    </section>
    <div role="radiogroup" aria-label="Варианты ответа" style="flex: none; margin-top: 10px; display: flex; flex-direction: column; gap: 6px">
      <button type="button" role="radio" aria-checked="false" style="min-height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); display: flex; align-items: center; gap: 12px; text-align: left">
        <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface)"></span>
        <span style="flex: none; width: 14px; font-size: 14px; line-height: 20px; color: var(--text-2)">A</span>
        <span lang="en" style="font-size: 17px; line-height: 22px; font-weight: 400; font-variant-numeric: tabular-nums">50%</span>
      </button>
      <button type="button" role="radio" aria-checked="false" style="min-height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); display: flex; align-items: center; gap: 12px; text-align: left">
        <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface)"></span>
        <span style="flex: none; width: 14px; font-size: 14px; line-height: 20px; color: var(--text-2)">B</span>
        <span lang="en" style="font-size: 17px; line-height: 22px; font-weight: 400; font-variant-numeric: tabular-nums">75%</span>
      </button>
      <button type="button" role="radio" aria-checked="true" style="min-height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; background: linear-gradient(var(--quant-tint), var(--quant-tint)), var(--surface); border: 1.5px solid var(--quant); display: flex; align-items: center; gap: 12px; text-align: left">
        <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--quant); display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 50%; background: var(--quant)"></span></span>
        <span style="flex: none; width: 14px; font-size: 14px; line-height: 20px; color: var(--text-2)">C</span>
        <span lang="en" style="font-size: 17px; line-height: 22px; font-weight: 600; font-variant-numeric: tabular-nums">100%</span>
      </button>
      <button type="button" role="radio" aria-checked="false" style="min-height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); display: flex; align-items: center; gap: 12px; text-align: left">
        <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface)"></span>
        <span style="flex: none; width: 14px; font-size: 14px; line-height: 20px; color: var(--text-2)">D</span>
        <span lang="en" style="font-size: 17px; line-height: 22px; font-weight: 400; font-variant-numeric: tabular-nums">125%</span>
      </button>
      <button type="button" role="radio" aria-checked="false" style="min-height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); display: flex; align-items: center; gap: 12px; text-align: left">
        <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface)"></span>
        <span style="flex: none; width: 14px; font-size: 14px; line-height: 20px; color: var(--text-2)">E</span>
        <span lang="en" style="font-size: 17px; line-height: 22px; font-weight: 400; font-variant-numeric: tabular-nums">200%</span>
      </button>
    </div>
  </main>

  <!-- Нижняя панель Telegram: содержимое уходит под растушёвку; кнопки рисует клиент -->
  <div style="flex: none; position: relative; z-index: 4; padding: 8px 16px 24px; background: var(--bg); display: flex; gap: 10px">
    <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: -28px; height: 28px; background: linear-gradient(transparent, var(--bg)); pointer-events: none"></span>
    <button type="button" style="flex: none; width: 128px; height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; font-weight: 600">Пропустить</button>
    <button type="button" style="flex: 1; height: 50px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">Проверить</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
return { themeClass: dark ? 'dark' : '' };
}
}
</script>
</body>
</html>
