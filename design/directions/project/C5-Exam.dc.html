<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ключ — Пробный экзамен</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;family=PT+Mono&amp;display=swap">
<style>
body{margin:0}
a{color:#161616}a:hover{color:#0F6B58}
button{font:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid #13806A;outline-offset:2px}
a:active,button:active{opacity:.84}
::selection{background:#CFE8E1;color:#161616}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: 'Golos Text', sans-serif; color: #161616; background: #FFFFFF; display: flex; flex-direction: column">

  <!-- Шапка Telegram (в бою выход — с подтверждением) -->
  <header style="height: 52px; flex-shrink: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 4px; background: #FFFFFF">
    <button type="button" style="justify-self: start; height: 44px; display: flex; align-items: center; gap: 2px; padding: 0 12px 0 4px; border: 0; background: transparent; color: #161616; font-size: 17px; line-height: 1">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#161616" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      Назад
    </button>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 17px; line-height: 1; font-weight: 600">
      <span aria-hidden="true" style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #13806A; display: flex; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 50%; background: #161616"></span></span>
      Ключ
    </div>
    <button type="button" aria-label="Меню" style="justify-self: end; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
      <span style="width: 32px; height: 32px; border-radius: 50%; background: #F0F2F1; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="4" viewBox="0 0 18 4" aria-hidden="true"><circle cx="2" cy="2" r="1.75" fill="#161616"/><circle cx="9" cy="2" r="1.75" fill="#161616"/><circle cx="16" cy="2" r="1.75" fill="#161616"/></svg>
      </span>
    </button>
  </header>

  <main lang="en" style="flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; flex-direction: column">

    <!-- Полоса экзамена — тёмная, как у настоящего тестового интерфейса -->
    <div style="flex-shrink: 0; min-height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 6px 6px 20px; background: #161616; color: #FFFFFF">
      <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
        <span style="font-size: 15px; line-height: 20px; font-weight: 600">Quantitative Reasoning</span>
        <span style="font-size: 13px; line-height: 18px; color: #C8CDD2">Section <span style="font-family: 'PT Mono', monospace; color: #FFFFFF">1</span> of <span style="font-family: 'PT Mono', monospace; color: #FFFFFF">2</span></span>
      </div>
      <div style="display: flex; align-items: center; gap: 2px; flex-shrink: 0">
        <span role="timer" aria-label="Time remaining 14 minutes 32 seconds" style="font-family: 'PT Mono', monospace; font-size: 17px; line-height: 1; letter-spacing: 0.02em; color: #FFFFFF">14:32</span>
        <button type="button" style="height: 44px; padding: 0 8px; border: 0; background: transparent; display: flex; align-items: center">
          <span style="height: 30px; padding: 0 10px; box-sizing: border-box; border: 1px solid #FFFFFF; border-radius: 4px; display: flex; align-items: center; font-size: 13px; line-height: 1; font-weight: 500; color: #FFFFFF">Hide Time</span>
        </button>
      </div>
    </div>

    <!-- Номер вопроса и схема секций -->
    <div style="flex-shrink: 0; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 20px; border-bottom: 1px solid #13806A">
      <span style="font-size: 15px; line-height: 20px; font-weight: 600">Question <span style="font-family: 'PT Mono', monospace; font-weight: 400">7</span> of <span style="font-family: 'PT Mono', monospace; font-weight: 400">12</span></span>
      <ol aria-label="Sections" style="list-style: none; margin: 0; padding: 0; display: flex; font-family: 'PT Mono', monospace; font-size: 13px; line-height: 1">
        <li style="width: 30px; height: 26px; box-sizing: border-box; border: 1px solid #13806A; background: #EAF3F0; color: #4B5563; display: flex; align-items: center; justify-content: center">AW</li>
        <li style="width: 30px; height: 26px; box-sizing: border-box; border: 1px solid #13806A; border-left: 0; background: #EAF3F0; color: #4B5563; display: flex; align-items: center; justify-content: center">V1</li>
        <li style="width: 30px; height: 26px; box-sizing: border-box; border: 1px solid #13806A; border-left: 0; background: #EAF3F0; color: #4B5563; display: flex; align-items: center; justify-content: center">V2</li>
        <li aria-current="step" style="width: 30px; height: 26px; box-sizing: border-box; border: 1px solid #161616; border-left: 0; background: #161616; color: #FFFFFF; display: flex; align-items: center; justify-content: center">Q1</li>
        <li style="width: 30px; height: 26px; box-sizing: border-box; border: 1px solid #13806A; border-left: 0; background: #FFFFFF; color: #161616; display: flex; align-items: center; justify-content: center">Q2</li>
      </ol>
    </div>

    <!-- Кнопки экзамена: Mark · Review · Calculator -->
    <div style="flex-shrink: 0; margin: 12px 36px 0 20px; display: grid; grid-template-columns: 1fr 1fr 1fr; border: 1px solid #13806A">
      <button type="button" aria-pressed="false" style="height: 46px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0; border: 0; background: transparent; color: #161616; font-size: 15px; font-weight: 500">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161616" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20.5V4.5"/><path d="M6 5h11.5l-2.5 4 2.5 4H6"/></svg>
        Mark
      </button>
      <button type="button" style="height: 46px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0; border: 0; border-left: 1px solid #13806A; background: transparent; color: #161616; font-size: 15px; font-weight: 500">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161616" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg>
        Review
      </button>
      <button type="button" style="height: 46px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0; border: 0; border-left: 1px solid #13806A; background: transparent; color: #161616; font-size: 15px; font-weight: 500">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161616" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M8.5 7.5h7"/><path d="M8.5 12h1.5M11.25 12h1.5M14 12h1.5M8.5 16h1.5M11.25 16h1.5M14 16h1.5"/></svg>
        Calculator
      </button>
    </div>

    <!-- Область бланка: само задание -->
    <div style="flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; padding: 28px 36px 0 20px">
      <span aria-hidden="true" style="position: absolute; left: 6px; top: 10px; width: 10px; height: 10px; background: #161616"></span>
      <span aria-hidden="true" style="position: absolute; right: 10px; top: 10px; width: 10px; height: 10px; background: #161616"></span>

      <!-- тайминг-метки = 12 вопросов секции: 1–7 отвечены, 7-й — текущий; верность в экзамене не показывается -->
      <div aria-hidden="true" style="position: absolute; right: 8px; top: 28px; display: flex; flex-direction: column; align-items: flex-end; gap: 7px">
        <span style="display: block; width: 14px; height: 4px; background: #161616"></span>
        <span style="display: block; width: 14px; height: 4px; background: #161616"></span>
        <span style="display: block; width: 14px; height: 4px; background: #161616"></span>
        <span style="display: block; width: 14px; height: 4px; background: #161616"></span>
        <span style="display: block; width: 14px; height: 4px; background: #161616"></span>
        <span style="display: block; width: 14px; height: 4px; background: #161616"></span>
        <span style="display: block; width: 14px; height: 4px; background: #161616; outline: 1.5px solid #161616; outline-offset: 1.5px"></span>
        <span style="display: block; width: 14px; height: 4px; box-sizing: border-box; border: 1px solid #161616"></span>
        <span style="display: block; width: 14px; height: 4px; box-sizing: border-box; border: 1px solid #161616"></span>
        <span style="display: block; width: 14px; height: 4px; box-sizing: border-box; border: 1px solid #161616"></span>
        <span style="display: block; width: 14px; height: 4px; box-sizing: border-box; border: 1px solid #161616"></span>
        <span style="display: block; width: 14px; height: 4px; box-sizing: border-box; border: 1px solid #161616"></span>
      </div>

      <p style="margin: 0; font-size: 16px; line-height: 23px">Compare Quantity A and Quantity B.</p>

      <p style="margin: 20px 0 0; text-align: center; font-size: 20px; line-height: 28px"><span style="font-style: italic">x</span> &gt; 0</p>

      <!-- Quantity A / Quantity B -->
      <div style="margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #13806A">
        <div style="padding: 9px 8px; border-bottom: 1px solid #13806A; text-align: center; font-size: 14px; line-height: 18px; font-weight: 600">Quantity A</div>
        <div style="padding: 9px 8px; border-bottom: 1px solid #13806A; border-left: 1px solid #13806A; text-align: center; font-size: 14px; line-height: 18px; font-weight: 600">Quantity B</div>
        <div style="padding: 18px 8px; text-align: center; font-size: 22px; line-height: 28px">(<span style="font-style: italic">x</span> + 1)²</div>
        <div style="padding: 18px 8px; border-left: 1px solid #13806A; text-align: center; font-size: 22px; line-height: 28px"><span style="font-style: italic">x</span>² + 1</div>
      </div>

      <!-- Варианты: овалы без букв, как на настоящем экзамене; выбранный — закрашен -->
      <div role="radiogroup" aria-label="Answer choices" style="margin-top: 18px; display: flex; flex-direction: column; gap: 2px">
        <button type="button" role="radio" aria-checked="true" style="min-height: 48px; display: flex; align-items: center; gap: 14px; padding: 6px 0; border: 0; background: transparent; color: #161616; text-align: left; font-size: 16px; line-height: 22px">
          <span aria-hidden="true" style="width: 32px; height: 20px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #13806A; background: #161616"></span>
          Quantity A is greater.
        </button>
        <button type="button" role="radio" aria-checked="false" style="min-height: 48px; display: flex; align-items: center; gap: 14px; padding: 6px 0; border: 0; background: transparent; color: #161616; text-align: left; font-size: 16px; line-height: 22px">
          <span aria-hidden="true" style="width: 32px; height: 20px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #13806A; background: #FFFFFF"></span>
          Quantity B is greater.
        </button>
        <button type="button" role="radio" aria-checked="false" style="min-height: 48px; display: flex; align-items: center; gap: 14px; padding: 6px 0; border: 0; background: transparent; color: #161616; text-align: left; font-size: 16px; line-height: 22px">
          <span aria-hidden="true" style="width: 32px; height: 20px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #13806A; background: #FFFFFF"></span>
          The two quantities are equal.
        </button>
        <button type="button" role="radio" aria-checked="false" style="min-height: 48px; display: flex; align-items: center; gap: 14px; padding: 6px 0; border: 0; background: transparent; color: #161616; text-align: left; font-size: 16px; line-height: 22px">
          <span aria-hidden="true" style="width: 32px; height: 20px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #13806A; background: #FFFFFF"></span>
          The relationship cannot be determined from the information given.
        </button>
      </div>
    </div>
  </main>

  <!-- Back / Next — своё управление экзаменом вместо MainButton -->
  <div lang="en" style="flex-shrink: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px 20px; background: #FFFFFF; box-shadow: 0 -1px 0 #E1E5E3">
    <button type="button" style="height: 50px; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0; border: 1.5px solid #161616; border-radius: 6px; background: #FFFFFF; color: #161616; font-size: 17px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#161616" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      Back
    </button>
    <button type="button" style="height: 50px; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0; border: 0; border-radius: 6px; background: #161616; color: #FFFFFF; font-size: 17px; font-weight: 600">
      Next
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
