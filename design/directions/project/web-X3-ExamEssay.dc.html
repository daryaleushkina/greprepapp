<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Practice test — Essay · desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
/* Токены «Шагов»: светлая и тёмная тема. В компонентах — только var(--…) */
.s{
--bg:#F5F6F9;--surface:#FFFFFF;--text:#1B1E28;--text-2:#5A6070;--line:rgba(27,30,40,.12);--fill:rgba(27,30,40,.06);
--accent:#1B1E28;--on-accent:#FFFFFF;--wrong:#C2410C;--wrong-tint:rgba(194,65,12,.10);
--verbal:#5B4BC4;--verbal-tint:rgba(91,75,196,.12);--quant:#11735F;--quant-tint:rgba(17,115,95,.12);
--words:#B4446C;--words-tint:rgba(180,68,108,.12);--essay:#9A5B00;--essay-tint:rgba(154,91,0,.12);--exam:#1B1E28;
--glow:rgba(91,75,196,.22);--glow-2:rgba(91,75,196,.07);
--glass:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.54));--glass-strong:linear-gradient(180deg,rgba(255,255,255,.90),rgba(255,255,255,.70));--glass-edge:rgba(0,0,0,.06);--glass-rim:rgba(255,255,255,.6);
--glass-shadow:0 10px 30px -10px rgba(30,30,60,.22);--tab-sel:rgba(27,30,40,.07);--focus:#5B4BC4;
}
.s.dark{
--bg:#0E0F14;--surface:#1A1C23;--text:#F2F3F7;--text-2:#A3A8B5;--line:rgba(255,255,255,.12);--fill:rgba(255,255,255,.08);
--accent:#F2F3F7;--on-accent:#111318;--wrong:#FF8A4C;--wrong-tint:rgba(255,138,76,.14);
--verbal:#A898FF;--verbal-tint:rgba(168,152,255,.16);--quant:#4FC4A7;--quant-tint:rgba(79,196,167,.16);
--words:#F28AB0;--words-tint:rgba(242,138,176,.16);--essay:#F0B45A;--essay-tint:rgba(240,180,90,.16);--exam:#F2F3F7;
--glow:rgba(130,110,255,.30);--glow-2:rgba(130,110,255,.08);
--glass:linear-gradient(180deg,rgba(64,66,80,.62),rgba(32,34,44,.50));--glass-strong:linear-gradient(180deg,rgba(48,50,62,.82),rgba(30,32,42,.72));--glass-edge:rgba(0,0,0,.35);--glass-rim:rgba(255,255,255,.12);
--glass-shadow:0 10px 30px -10px rgba(0,0,0,.6);--tab-sel:rgba(255,255,255,.10);--focus:#A898FF;
}
a{color:var(--text)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
button:active,a:active{transform:scale(0.98)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--verbal-tint)}
@media (prefers-reduced-motion: reduce){button,a{transition:none}button:active,a:active{transform:none}}
@media (prefers-reduced-transparency: reduce){.glass{background:var(--surface)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:12px;line-height:1;font-weight:500;color:var(--text-2);font-variant-numeric:tabular-nums}
@media (hover:hover) and (pointer:fine){.nav-item:hover{background:var(--fill)}.row-link:hover{background:var(--fill)}}
input[type=radio]{appearance:none;-webkit-appearance:none}
input[type=radio]:checked{border-color:var(--accent)!important;background:var(--accent)!important;box-shadow:inset 0 0 0 4px var(--surface)}
label:has(input:checked){box-shadow:inset 0 0 0 1.5px var(--accent)!important}
textarea{resize:none}
textarea:focus{outline:none;box-shadow:0 0 0 2px var(--focus)}
</style>
</helmet>
<!-- Эссе в пробнике: тема слева, редактор справа; время всегда на виду -->
<div class="s {{themeClass}}" style="min-height: 100vh; box-sizing: border-box; font-family: 'Onest', system-ui, sans-serif; color: var(--text); background: radial-gradient(70% 55% at 55% -15%, var(--glow) 0%, var(--glow-2) 50%, transparent 78%), var(--bg); display: flex; flex-direction: column; --glow: rgba(27,30,40,.09); --glow-2: rgba(27,30,40,.03);">

  <!-- Режим фокуса: тонкая полоса сверху, без боковой панели -->
  <header lang="en" style="flex: none; min-height: 64px; box-sizing: border-box; padding: 10px clamp(16px, 4vw, 48px); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px">
    <div style="flex: 1 1 200px; min-width: 0; display: flex; align-items: center; gap: 14px"><button type="button" class="glass" aria-label="Exit section" style="flex: none; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; color: var(--text); text-decoration: none; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"></path></svg></button><span style="font-size: 16px; line-height: 22px; font-weight: 600">Essay · Analyze an Issue</span></div>
    <div style="flex: 0 1 auto; display: flex; justify-content: center"><span role="timer" aria-label="Time remaining 24 minutes 10 seconds" style="font-size: 24px; line-height: 28px; font-weight: 600; font-variant-numeric: tabular-nums">24:10</span></div>
    <div style="flex: 1 1 200px; min-width: 0; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px"><button type="button" style="height: 48px; padding: 0 24px; border: 0; border-radius: 24px; background: var(--accent); color: var(--on-accent); text-decoration: none; font-size: 16px; line-height: 20px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; font-variant-numeric: tabular-nums">Next</button></div>
  </header>

  <main lang="en" style="flex: 1; box-sizing: border-box; padding: 16px clamp(16px, 4vw, 48px) 48px; display: flex; justify-content: center">
    <div style="width: 100%; max-width: 1180px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 28px 40px">

      <section aria-label="Essay topic" style="flex: 1 1 300px; max-width: 360px; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding-top: 6px">
        <p style="margin: 0; font-size: 19px; line-height: 27px; font-weight: 500">The most effective way to learn a skill is to practice it without first studying the theory behind it.</p>
        <p style="margin: 0; font-size: 16px; line-height: 23px; color: var(--text-2)">Discuss how far you agree with the claim. Support your view with reasons and examples, and consider when the claim might not hold.</p>
      </section>

      <div style="flex: 999 1 460px; max-width: 760px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px">
          <div role="toolbar" aria-label="Editing" class="glass" style="height: 40px; box-sizing: border-box; padding: 3px; border-radius: 20px; display: flex; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow)">
            <button type="button" style="padding: 0 14px; border: 0; border-radius: 17px; background: transparent; font-size: 15px; font-weight: 500">Cut</button>
            <button type="button" style="padding: 0 14px; border: 0; border-radius: 17px; background: transparent; font-size: 15px; font-weight: 500">Paste</button>
            <button type="button" style="padding: 0 14px; border: 0; border-radius: 17px; background: transparent; font-size: 15px; font-weight: 500">Undo</button>
            <button type="button" style="padding: 0 14px; border: 0; border-radius: 17px; background: transparent; font-size: 15px; font-weight: 500">Redo</button>
          </div>
          <span style="font-size: 15px; line-height: 20px; color: var(--text-2); font-variant-numeric: tabular-nums">Words: 79</span>
        </div>
        <label for="wx3-essay" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Your response</label>
        <textarea id="wx3-essay" style="min-height: 560px; box-sizing: border-box; border-radius: 22px; padding: 22px 24px; border: 1px solid var(--line); background: var(--surface); font-size: 17px; line-height: 27px">Practice without theory can take a learner surprisingly far, but only up to a point. A child who learns to ride a bicycle never studies the physics of balance, yet she rides. The claim is right that doing comes first for many physical skills. It is weaker for skills where mistakes are costly or invisible: a pilot or a surgeon cannot afford to learn only by trial and error, because the errors that teach them would also hurt someone.</textarea>
      </div>
    </div>
  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
return { themeClass: dark ? 'dark' : '' };
}
}
</script>
</body>
</html>
