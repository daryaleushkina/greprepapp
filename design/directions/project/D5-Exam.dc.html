<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Г · Telegram — Пробный экзамен</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.tg{--tg-theme-bg-color:#FFFFFF;--tg-theme-secondary-bg-color:#F2F2F7;--tg-theme-section-bg-color:#FFFFFF;--tg-theme-text-color:#000000;--tg-theme-hint-color:#616166;--tg-theme-link-color:#2481CC;--tg-theme-section-separator-color:rgba(60,60,67,0.16);--tg-theme-section-header-text-color:#616166;--tg-theme-destructive-text-color:#D93A2F;--brand:#6E56CF;--on-brand:#FFFFFF;--brand-soft:rgba(110,86,207,0.10);--wrong:#C2410C;--fill:rgba(118,118,128,0.10);--track:rgba(118,118,128,0.18);--chev:#BDBDC2;--glow:rgba(91,100,114,0.14);--glow-2:rgba(91,100,114,0.04);--page-0:rgba(242,242,247,0);--glass-bg:rgba(255,255,255,0.62);--glass-edge:rgba(0,0,0,0.06);--glass-rim:rgba(255,255,255,0.55);--glass-shadow:0 8px 24px rgba(0,0,0,0.08);--glass-on:#FFFFFF;color-scheme:light}
.tg.dark{--tg-theme-bg-color:#000000;--tg-theme-secondary-bg-color:#000000;--tg-theme-section-bg-color:#1C1C1E;--tg-theme-text-color:#FFFFFF;--tg-theme-hint-color:#98989F;--tg-theme-link-color:#3E88F7;--tg-theme-section-separator-color:rgba(84,84,88,0.55);--tg-theme-section-header-text-color:#8D8D93;--tg-theme-destructive-text-color:#FF6961;--brand:#9E8CFC;--on-brand:#14121F;--brand-soft:rgba(158,140,252,0.16);--wrong:#FF8A4C;--fill:rgba(118,118,128,0.24);--track:rgba(118,118,128,0.32);--chev:#5A5A5F;--glow:rgba(160,170,190,0.12);--glow-2:rgba(160,170,190,0.04);--page-0:rgba(0,0,0,0);--glass-bg:rgba(28,28,30,0.55);--glass-edge:rgba(0,0,0,0.35);--glass-rim:rgba(255,255,255,0.12);--glass-shadow:0 8px 24px rgba(0,0,0,0.40);--glass-on:rgba(255,255,255,0.18);color-scheme:dark}
@media (prefers-reduced-transparency: reduce){.glass{background:var(--tg-theme-section-bg-color)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
a{color:#6E56CF}a:hover{color:#5A44B8}
button{font:inherit;cursor:pointer}
button,a,label{-webkit-tap-highlight-color:transparent;transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
button:active,a:active{transform:scale(0.97)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::selection{background:rgba(110,86,207,.22)}
input[type=radio]:checked{border-color:var(--brand) !important;box-shadow:inset 0 0 0 5px var(--brand)}
label:has(input:checked){background:var(--brand-soft)}
@media (prefers-reduced-motion: reduce){button,a,label{transition:none}button:active,a:active{transform:none}}
</style>
</helmet>
<div class="tg {{themeClass}}" style="width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: var(--tg-theme-text-color); background: radial-gradient(140% 52% at 50% -14%, var(--glow) 0%, var(--glow-2) 48%, transparent 76%), var(--tg-theme-secondary-bg-color); -webkit-font-smoothing: antialiased">

  <header style="position: absolute; z-index: 3; top: 8px; left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none">
    <button type="button" aria-label="Назад" class="glass" style="pointer-events: auto; width: 44px; height: 44px; padding: 0; border-radius: 50%; color: var(--tg-theme-text-color); display: flex; align-items: center; justify-content: center; background: var(--glass-bg); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"></path></svg>
    </button>
    <button type="button" aria-label="Меню" class="glass" style="pointer-events: auto; width: 44px; height: 44px; padding: 0; border-radius: 50%; color: var(--tg-theme-text-color); display: flex; align-items: center; justify-content: center; background: var(--glass-bg); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="18.5" cy="12" r="1.8"></circle></svg>
    </button>
  </header>

  <!-- Таймер — стеклянная плашка между кругами Telegram; скрыть можно, как на настоящем GRE -->
  <div lang="en" class="glass" style="position: absolute; z-index: 3; top: 8px; left: 50%; transform: translateX(-50%); height: 44px; box-sizing: border-box; padding: 0 6px 0 16px; border-radius: 22px; display: flex; align-items: center; gap: 6px; background: var(--glass-bg); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow)">
    <span role="timer" aria-label="Time remaining 14 minutes 32 seconds" style="font-family: ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; font-size: 20px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums">14:32</span>
    <button type="button" style="height: 32px; padding: 0 12px; border: 0; border-radius: 16px; background: var(--fill); color: var(--tg-theme-text-color); font-size: 15px; line-height: 20px; font-weight: 500; white-space: nowrap">Hide Time</button>
  </div>

  <!-- Экзамен — как настоящий GRE: интерфейс на английском (решение Даши), верность ответа не показывается -->
  <main lang="en" style="height: 844px; box-sizing: border-box; overflow: hidden; padding: 62px 16px 110px; display: flex; flex-direction: column; gap: 14px">

    <section aria-label="Current section" style="flex: none; padding: 4px 4px 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 20px; line-height: 25px; font-weight: 600">Quantitative Reasoning</h1>
        <p style="margin: 0; font-size: 15px; line-height: 20px; color: var(--tg-theme-hint-color); font-variant-numeric: tabular-nums">Section 1 of 2 · Question 7 of 12</p>
      </div>
      <ol aria-label="Sections" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
        <li aria-label="Analytical Writing, done" style="display: flex; flex-direction: column; gap: 6px">
          <span style="height: 4px; border-radius: 2px; background: var(--brand)"></span>
          <span style="font-size: 13px; line-height: 16px; color: var(--tg-theme-hint-color)">AW</span>
        </li>
        <li aria-label="Verbal 1, done" style="display: flex; flex-direction: column; gap: 6px">
          <span style="height: 4px; border-radius: 2px; background: var(--brand)"></span>
          <span style="font-size: 13px; line-height: 16px; color: var(--tg-theme-hint-color)">Verbal 1</span>
        </li>
        <li aria-label="Verbal 2, done" style="display: flex; flex-direction: column; gap: 6px">
          <span style="height: 4px; border-radius: 2px; background: var(--brand)"></span>
          <span style="font-size: 13px; line-height: 16px; color: var(--tg-theme-hint-color)">Verbal 2</span>
        </li>
        <li aria-current="step" aria-label="Quant 1, section 1 of 2, current" style="display: flex; flex-direction: column; gap: 6px">
          <span style="height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--brand) 58%, var(--track) 58%)"></span>
          <span style="font-size: 13px; line-height: 16px; font-weight: 600; color: var(--brand)">Quant 1</span>
        </li>
        <li aria-label="Quant 2" style="display: flex; flex-direction: column; gap: 6px">
          <span style="height: 4px; border-radius: 2px; background: var(--track)"></span>
          <span style="font-size: 13px; line-height: 16px; color: var(--tg-theme-hint-color)">Quant 2</span>
        </li>
      </ol>
    </section>

    <!-- Инструменты — слой управления, поэтому стекло -->
    <div role="toolbar" aria-label="Exam tools" style="flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button type="button" aria-pressed="false" class="glass" style="height: 44px; border-radius: 22px; color: var(--tg-theme-text-color); font-size: 15px; line-height: 20px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--glass-bg); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5h10v15.5l-5-3.5-5 3.5z"></path></svg>
        Mark
      </button>
      <button type="button" class="glass" style="height: 44px; border-radius: 22px; color: var(--tg-theme-text-color); font-size: 15px; line-height: 20px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--glass-bg); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="4.5" width="6" height="6" rx="1.5"></rect><rect x="13.5" y="4.5" width="6" height="6" rx="1.5"></rect><rect x="4.5" y="13.5" width="6" height="6" rx="1.5"></rect><rect x="13.5" y="13.5" width="6" height="6" rx="1.5"></rect></svg>
        Review
      </button>
      <button type="button" class="glass" style="height: 44px; border-radius: 22px; color: var(--tg-theme-text-color); font-size: 15px; line-height: 20px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--glass-bg); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="3.5" width="13" height="17" rx="2.5"></rect><path d="M8.5 7.5h7"></path><path d="M9 12h.01"></path><path d="M12 12h.01"></path><path d="M15 12h.01"></path><path d="M9 16h.01"></path><path d="M12 16h.01"></path><path d="M15 16h.01"></path></svg>
        Calculator
      </button>
    </div>

    <!-- Задание и ответы — одна плотная поверхность -->
    <section aria-label="Question 7" style="flex: none; background: var(--tg-theme-section-bg-color); border-radius: 26px; overflow: hidden">
      <div style="padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 10px">
        <p style="margin: 0; font-size: 17px; line-height: 24px">Compare Quantity A and Quantity B.</p>
        <p style="margin: 0; text-align: center; font-size: 20px; line-height: 26px"><i>x</i> &gt; 0</p>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
          <div style="padding: 10px 12px; border-radius: 16px; background: var(--fill); display: flex; flex-direction: column; align-items: center; gap: 2px">
            <span style="font-size: 13px; line-height: 18px; color: var(--tg-theme-hint-color)">Quantity A</span>
            <span style="font-size: 22px; line-height: 30px">(<i>x</i> + 1)²</span>
          </div>
          <div style="padding: 10px 12px; border-radius: 16px; background: var(--fill); display: flex; flex-direction: column; align-items: center; gap: 2px">
            <span style="font-size: 13px; line-height: 18px; color: var(--tg-theme-hint-color)">Quantity B</span>
            <span style="font-size: 22px; line-height: 30px"><i>x</i>² + 1</span>
          </div>
        </div>
      </div>
      <div role="radiogroup" aria-label="Answer choices" style="padding: 0 8px 8px; display: flex; flex-direction: column">
        <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 10px 12px; box-sizing: border-box; border-radius: 18px; cursor: pointer; font-size: 17px; line-height: 22px">
          <input type="radio" name="d5-answer" value="a" checked style="appearance: none; -webkit-appearance: none; margin: 0; flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--tg-theme-hint-color); background: transparent; cursor: pointer">
          <span>Quantity A is greater.</span>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 10px 12px; box-sizing: border-box; border-radius: 18px; cursor: pointer; font-size: 17px; line-height: 22px">
          <input type="radio" name="d5-answer" value="b" style="appearance: none; -webkit-appearance: none; margin: 0; flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--tg-theme-hint-color); background: transparent; cursor: pointer">
          <span>Quantity B is greater.</span>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 10px 12px; box-sizing: border-box; border-radius: 18px; cursor: pointer; font-size: 17px; line-height: 22px">
          <input type="radio" name="d5-answer" value="c" style="appearance: none; -webkit-appearance: none; margin: 0; flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--tg-theme-hint-color); background: transparent; cursor: pointer">
          <span>The two quantities are equal.</span>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 10px 12px; box-sizing: border-box; border-radius: 18px; cursor: pointer; font-size: 17px; line-height: 22px">
          <input type="radio" name="d5-answer" value="d" style="appearance: none; -webkit-appearance: none; margin: 0; flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--tg-theme-hint-color); background: transparent; cursor: pointer">
          <span>The relationship cannot be determined from the information given.</span>
        </label>
      </div>
    </section>

  </main>

  <!-- Back — SecondaryButton (слева), Next — MainButton: обе рисует Telegram -->
  <div lang="en" style="position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 28px 16px 24px; background: linear-gradient(to bottom, var(--page-0) 0, var(--tg-theme-secondary-bg-color) 28px); display: grid; grid-template-columns: 1fr 2fr; gap: 10px">
    <button type="button" style="height: 50px; border: 0; border-radius: 12px; background: var(--tg-theme-section-bg-color); color: var(--brand); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; line-height: 22px; font-weight: 600">Back</button>
    <button type="button" style="height: 50px; border: 0; border-radius: 12px; background: var(--brand); color: var(--on-brand); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; line-height: 22px; font-weight: 600">Next</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
return { themeClass: dark ? 'dark' : '' };
}
}
</script>
</body>
</html>
