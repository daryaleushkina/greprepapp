<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Поля — Пробный экзамен</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&amp;family=PT+Serif:ital,wght@0,400;0,700;1,400&amp;family=Caveat:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D3A9C}a:hover{color:#142B75}
button{font:inherit;cursor:pointer}
button:active,a:active,label:active{opacity:.8}
:focus-visible{outline:2px solid #1D3A9C;outline-offset:2px}
::selection{background:#DDEAF6;color:#1A1A1A}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: 'PT Sans', sans-serif; color: #1A1A1A; background-color: #FFFFFF; background-image: linear-gradient(#DDEAF6 1px, transparent 1px), linear-gradient(90deg, #DDEAF6 1px, transparent 1px); background-size: 20px 20px; background-position: 16px 12px; display: flex; flex-direction: column">

  <header style="height: 52px; flex: none; box-sizing: border-box; padding: 0 8px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: #FFFFFF; position: relative; z-index: 2">
    <div style="display: flex; justify-content: flex-start">
      <button type="button" style="min-height: 44px; padding: 0 8px 0 2px; border: 0; background: transparent; color: #1D3A9C; font-size: 17px; line-height: 22px; display: inline-flex; align-items: center; gap: 2px">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="#1D3A9C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
        <span>Назад</span>
      </button>
    </div>
    <div style="font-size: 17px; line-height: 22px; font-weight: 700">Поля</div>
    <div style="display: flex; justify-content: flex-end">
      <button type="button" aria-label="Меню" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: #EEF1F6; display: inline-flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="3.5" cy="9" r="1.6" fill="#1A1A1A" /><circle cx="9" cy="9" r="1.6" fill="#1A1A1A" /><circle cx="14.5" cy="9" r="1.6" fill="#1A1A1A" /></svg>
        </span>
      </button>
    </div>
  </header>

  <!-- Полоса экзамена: строго, без рукописного; управление по-английски, как на настоящем экзамене -->
  <section lang="en" aria-label="Exam controls" style="flex: none; height: 154px; box-sizing: border-box; padding: 10px 16px; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; box-shadow: inset 0 1px 0 #DCE3EC; border-bottom: 2px solid #1A1A1A; position: relative; z-index: 2">
    <div style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; min-width: 0">
        <span style="font-size: 17px; line-height: 22px; font-weight: 700">Quantitative Reasoning</span>
        <span style="font-size: 13px; line-height: 20px; color: #555B66; font-variant-numeric: tabular-nums">Section 1 of 2 · Question 7 of 12</span>
      </div>
      <div style="flex: none; display: flex; align-items: center; gap: 8px">
        <span role="timer" aria-label="Time remaining 14 minutes 32 seconds" style="font-size: 20px; line-height: 24px; font-weight: 700; font-variant-numeric: tabular-nums">14:32</span>
        <button type="button" style="height: 44px; padding: 0 10px; border: 1px solid #7F96B5; border-radius: 10px; background: #FFFFFF; color: #1A1A1A; font-size: 13px; line-height: 16px">Hide Time</button>
      </div>
    </div>

    <ol aria-label="Sections" style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px">
      <li style="height: 24px; box-sizing: border-box; border: 1px solid #C9D5E3; border-radius: 4px; background: #EEF1F6; display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 13px; line-height: 16px; color: #555B66"><svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#555B66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg>AW</li>
      <li style="height: 24px; box-sizing: border-box; border: 1px solid #C9D5E3; border-radius: 4px; background: #EEF1F6; display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 13px; line-height: 16px; color: #555B66"><svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#555B66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg>Verbal 1</li>
      <li style="height: 24px; box-sizing: border-box; border: 1px solid #C9D5E3; border-radius: 4px; background: #EEF1F6; display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 13px; line-height: 16px; color: #555B66"><svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#555B66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg>Verbal 2</li>
      <li aria-current="step" style="height: 24px; box-sizing: border-box; border: 2px solid #1D3A9C; border-radius: 4px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; line-height: 16px; font-weight: 700; color: #1D3A9C">Quant 1</li>
      <li style="height: 24px; box-sizing: border-box; border: 1px solid #C9D5E3; border-radius: 4px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; line-height: 16px; color: #555B66">Quant 2</li>
    </ol>

    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px">
      <button type="button" aria-pressed="false" style="height: 44px; padding: 0 8px; border: 1px solid #7F96B5; border-radius: 10px; background: #FFFFFF; color: #1A1A1A; font-size: 15px; line-height: 20px; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20.5V4.5a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v16l-6-4.2z" fill="none" stroke="#1A1A1A" stroke-width="1.75" stroke-linejoin="round" /></svg>Mark
      </button>
      <button type="button" style="height: 44px; padding: 0 8px; border: 1px solid #7F96B5; border-radius: 10px; background: #FFFFFF; color: #1A1A1A; font-size: 15px; line-height: 20px; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6.5H20M9.5 12H20M9.5 17.5H20" fill="none" stroke="#1A1A1A" stroke-width="1.75" stroke-linecap="round" /><path d="M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01" fill="none" stroke="#1A1A1A" stroke-width="2.6" stroke-linecap="round" /></svg>Review
      </button>
      <button type="button" style="height: 44px; padding: 0 8px; border: 1px solid #7F96B5; border-radius: 10px; background: #FFFFFF; color: #1A1A1A; font-size: 15px; line-height: 20px; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2" fill="none" stroke="#1A1A1A" stroke-width="1.75" /><path d="M8.5 7.5h7" fill="none" stroke="#1A1A1A" stroke-width="1.75" stroke-linecap="round" /><path d="M8.7 12h.01M12 12h.01M15.3 12h.01M8.7 16h.01M12 16h.01M15.3 16h.01" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" /></svg>Calculator
      </button>
    </div>
  </section>

  <!-- Лист задания: клетка и поля остаются, поля пустые — на экзамене репетитора рядом нет -->
  <main lang="en" style="flex: 1; min-height: 0; position: relative; overflow: hidden">
    <div aria-hidden="true" style="position: absolute; left: 44px; top: 0; bottom: 0; width: 1.5px; background: #E58A8E"></div>

    <div style="position: relative; box-sizing: border-box; padding: 26px 14px 20px 0; display: flex; flex-direction: column">

      <div style="display: grid; grid-template-columns: 44px 1fr; column-gap: 12px">
        <div></div>
        <p style="margin: 0; text-align: center; font-family: 'PT Serif', serif; font-size: 18px; line-height: 20px"><i>x</i> &gt; 0</p>
      </div>

      <div style="margin-top: 20px; display: grid; grid-template-columns: 44px 1fr; column-gap: 12px">
        <div></div>
        <table style="width: 100%; border-collapse: collapse; table-layout: fixed; background: #FFFFFF">
          <thead>
            <tr>
              <th scope="col" style="height: 40px; padding: 0; border: 1px solid #1A1A1A; font-size: 15px; line-height: 20px; font-weight: 700; text-align: center">Quantity A</th>
              <th scope="col" style="height: 40px; padding: 0; border: 1px solid #1A1A1A; font-size: 15px; line-height: 20px; font-weight: 700; text-align: center">Quantity B</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td style="height: 60px; padding: 0; border: 1px solid #1A1A1A; text-align: center; font-family: 'PT Serif', serif; font-size: 20px; line-height: 24px">(<i>x</i> + 1)<sup style="font-size: 13px; line-height: 0">2</sup></td>
              <td style="height: 60px; padding: 0; border: 1px solid #1A1A1A; text-align: center; font-family: 'PT Serif', serif; font-size: 20px; line-height: 24px"><i>x</i><sup style="font-size: 13px; line-height: 0">2</sup> + 1</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div style="margin-top: 20px; display: grid; grid-template-columns: 44px 1fr; column-gap: 12px">
        <div></div>
        <p id="b5-q" style="margin: 0; font-size: 15px; line-height: 20px">Compare Quantity A and Quantity B.</p>
      </div>

      <div style="margin-top: 12px; display: grid; grid-template-columns: 44px 1fr; column-gap: 12px">
        <div></div>
        <div role="radiogroup" aria-labelledby="b5-q" style="display: flex; flex-direction: column">
          <label style="position: relative; min-height: 44px; padding: 12px 0; box-sizing: border-box; display: flex; align-items: flex-start; gap: 12px; font-size: 15px; line-height: 20px; cursor: pointer">
            <input type="radio" name="b5-answer" value="a" checked style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none" />
            <span aria-hidden="true" style="flex: none; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #1D3A9C; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: 50%; background: #1D3A9C"></span></span>
            <span>Quantity A is greater.</span>
          </label>
          <label style="position: relative; min-height: 44px; padding: 12px 0; box-sizing: border-box; display: flex; align-items: flex-start; gap: 12px; font-size: 15px; line-height: 20px; cursor: pointer">
            <input type="radio" name="b5-answer" value="b" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none" />
            <span aria-hidden="true" style="flex: none; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #555B66; background: #FFFFFF"></span>
            <span>Quantity B is greater.</span>
          </label>
          <label style="position: relative; min-height: 44px; padding: 12px 0; box-sizing: border-box; display: flex; align-items: flex-start; gap: 12px; font-size: 15px; line-height: 20px; cursor: pointer">
            <input type="radio" name="b5-answer" value="c" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none" />
            <span aria-hidden="true" style="flex: none; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #555B66; background: #FFFFFF"></span>
            <span>The two quantities are equal.</span>
          </label>
          <label style="position: relative; min-height: 44px; padding: 12px 0; box-sizing: border-box; display: flex; align-items: flex-start; gap: 12px; font-size: 15px; line-height: 20px; cursor: pointer">
            <input type="radio" name="b5-answer" value="d" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none" />
            <span aria-hidden="true" style="flex: none; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #555B66; background: #FFFFFF"></span>
            <span>The relationship cannot be determined from the information given.</span>
          </label>
        </div>
      </div>

    </div>
  </main>

  <!-- Своё управление экзаменом вместо MainButton: Back / Next во всю ширину -->
  <nav lang="en" aria-label="Question navigation" style="flex: none; padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid #DCE3EC; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; position: relative; z-index: 2">
    <button type="button" style="height: 50px; border: 1.5px solid #1D3A9C; border-radius: 10px; background: #FFFFFF; color: #1D3A9C; font-size: 17px; line-height: 20px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 4px">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="#1D3A9C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>Back
    </button>
    <button type="button" style="height: 50px; border: 0; border-radius: 10px; background: #1D3A9C; color: #FFFFFF; font-size: 17px; line-height: 20px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 4px">
      Next<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
    </button>
  </nav>

</div>
</x-dc>

</body>
</html>
