<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Е · Шаги — Главная</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1B1E28}a:hover{color:#5A6070}
button,input{font:inherit}
button{cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
button:active,a:active{transform:scale(0.98)}
:focus-visible{outline:2px solid #5B4BC4;outline-offset:2px}
::selection{background:#ECE9FB;color:#1B1E28}
@media (prefers-reduced-motion: reduce){button,a{transition:none}button:active,a:active{transform:none}}
@media (prefers-reduced-transparency: reduce){.glass{background:#FFFFFF!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
</style>
</helmet>
<!-- Фон — светлый, сверху мягкий свет цвета текущего шага (Verbal), чтобы стеклу было что преломлять -->
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: 'Onest', system-ui, sans-serif; color: #1B1E28; background: radial-gradient(130% 55% at 50% -12%, rgba(91, 75, 196, 0.16) 0%, rgba(91, 75, 196, 0.06) 45%, rgba(245, 246, 249, 0) 72%), #F5F6F9; display: flex; flex-direction: column">

  <!-- Шапку рисует Telegram: два стеклянных круга поверх содержимого -->
  <button type="button" class="glass" aria-label="Закрыть" style="position: absolute; z-index: 5; top: 8px; left: 12px; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.62); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid rgba(0, 0, 0, 0.06); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 8px 24px rgba(0, 0, 0, 0.08); color: #1B1E28; display: flex; align-items: center; justify-content: center">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg>
  </button>
  <button type="button" class="glass" aria-label="Меню" style="position: absolute; z-index: 5; top: 8px; right: 12px; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.62); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid rgba(0, 0, 0, 0.06); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 8px 24px rgba(0, 0, 0, 0.08); color: #1B1E28; display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"></circle><circle cx="12" cy="12" r="1.7" fill="currentColor"></circle><circle cx="18.5" cy="12" r="1.7" fill="currentColor"></circle></svg>
  </button>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 72px 20px 0; display: flex; flex-direction: column">

    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 600; letter-spacing: -0.025em">Сегодня</h1>
      <p style="margin: 0; font-size: 15px; line-height: 20px; color: #5A6070; font-variant-numeric: tabular-nums">Три шага · около 22 минут</p>
    </div>

    <!-- Лента на сегодня: ровно три шага и видимый конец; стекло — только у текущего -->
    <ol aria-label="План на сегодня" style="list-style: none; margin: 32px 0 0; padding: 0; display: flex; flex-direction: column; gap: 24px">

      <li style="position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr); column-gap: 14px; align-items: start">
        <span aria-hidden="true" style="position: absolute; left: 17.25px; top: 52px; bottom: -24px; width: 1.5px; background: rgba(27, 30, 40, 0.12)"></span>
        <span aria-hidden="true" style="position: relative; margin-top: 16px; width: 36px; height: 36px; border-radius: 50%; background: #5B4BC4; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 5px rgba(91, 75, 196, 0.14)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6.5l-4.5 3.5v-3.5a2 2 0 0 1-2-2z"></path><path d="M8.5 9h7"></path><path d="M8.5 12.5h4.5"></path></svg>
        </span>
        <section class="glass" aria-label="Сейчас: продолжить тренировку, вопрос 4 из 10" style="border-radius: 24px; padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 4px; background: rgba(255, 255, 255, 0.72); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid rgba(0, 0, 0, 0.06); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 12px 32px -12px rgba(60, 45, 150, 0.22)">
          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
            <h2 style="margin: 0; font-size: 19px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em">Продолжить тренировку</h2>
            <span style="flex: none; font-size: 15px; line-height: 20px; color: #5A6070; font-variant-numeric: tabular-nums">~7 мин</span>
          </div>
          <p lang="en" style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 500; color: #5B4BC4">Verbal · Text Completion</p>
          <span role="img" aria-label="Отвечено 3 из 10, сейчас четвёртый вопрос" style="margin-top: 14px; display: flex; align-items: center; gap: 7px">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: #5B4BC4"></span>
            <span style="width: 8px; height: 8px; border-radius: 50%; background: #5B4BC4"></span>
            <span style="width: 8px; height: 8px; border-radius: 50%; background: #5B4BC4"></span>
            <span style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; border: 2.5px solid #5B4BC4"></span>
            <span style="width: 8px; height: 8px; border-radius: 50%; background: rgba(27, 30, 40, 0.14)"></span>
            <span style="width: 8px; height: 8px; border-radius: 50%; background: rgba(27, 30, 40, 0.14)"></span>
            <span style="width: 8px; height: 8px; border-radius: 50%; background: rgba(27, 30, 40, 0.14)"></span>
            <span style="width: 8px; height: 8px; border-radius: 50%; background: rgba(27, 30, 40, 0.14)"></span>
            <span style="width: 8px; height: 8px; border-radius: 50%; background: rgba(27, 30, 40, 0.14)"></span>
            <span style="width: 8px; height: 8px; border-radius: 50%; background: rgba(27, 30, 40, 0.14)"></span>
          </span>
        </section>
      </li>

      <li style="position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr); column-gap: 14px; align-items: start">
        <span aria-hidden="true" style="position: absolute; left: 17.25px; top: 30px; bottom: -24px; width: 1.5px; background: rgba(27, 30, 40, 0.12)"></span>
        <span aria-hidden="true" style="position: relative; justify-self: center; margin-top: 1px; width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 1px solid rgba(27, 30, 40, 0.12); color: #11735F; display: flex; align-items: center; justify-content: center">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5a7.5 7.5 0 0 1 13-5l2 2"></path><path d="M19.5 4v4.5H15"></path><path d="M19.5 12.5a7.5 7.5 0 0 1-13 5l-2-2"></path><path d="M4.5 20v-4.5H9"></path></svg>
        </span>
        <a href="#" style="min-height: 44px; display: flex; align-items: flex-start; gap: 12px; text-decoration: none; color: #1B1E28">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 17px; line-height: 22px; font-weight: 500">Повторить: проценты и доли</span>
            <span style="font-size: 15px; line-height: 20px; color: #5A6070"><span lang="en" style="color: #11735F">Quant</span> · 8 вопросов</span>
          </span>
          <span style="flex: none; font-size: 15px; line-height: 22px; color: #5A6070; font-variant-numeric: tabular-nums">~10 мин</span>
        </a>
      </li>

      <li style="position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr); column-gap: 14px; align-items: start">
        <span aria-hidden="true" style="position: absolute; left: 17.25px; top: 30px; bottom: -24px; width: 1.5px; background: rgba(27, 30, 40, 0.12)"></span>
        <span aria-hidden="true" style="position: relative; justify-self: center; margin-top: 1px; width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 1px solid rgba(27, 30, 40, 0.12); color: #B4446C; display: flex; align-items: center; justify-content: center">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7.5" width="12" height="13" rx="2.5"></rect><path d="M8.5 4.5h9a2.5 2.5 0 0 1 2.5 2.5v10"></path></svg>
        </span>
        <a href="#" style="min-height: 44px; display: flex; align-items: flex-start; gap: 12px; text-decoration: none; color: #1B1E28">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 17px; line-height: 22px; font-weight: 500">Слова</span>
            <span style="font-size: 15px; line-height: 20px; color: #5A6070">12 к повторению</span>
          </span>
          <span style="flex: none; font-size: 15px; line-height: 22px; color: #5A6070; font-variant-numeric: tabular-nums">~5 мин</span>
        </a>
      </li>

      <!-- Конец плана виден заранее -->
      <li style="display: grid; grid-template-columns: 36px minmax(0, 1fr); column-gap: 14px; align-items: center">
        <span aria-hidden="true" style="justify-self: center; width: 9px; height: 9px; border-radius: 50%; background: rgba(27, 30, 40, 0.22)"></span>
        <span style="font-size: 15px; line-height: 20px; color: #5A6070">На сегодня всё. Дальше — по желанию.</span>
      </li>
    </ol>

    <!-- Тихие ссылки сразу под лентой, без стрелок -->
    <nav aria-label="Другое" style="margin: 10px 0 0 50px; display: flex; flex-wrap: wrap; column-gap: 20px">
      <a href="#" style="min-height: 44px; display: inline-flex; align-items: center; font-size: 15px; font-weight: 500; color: #1B1E28; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; text-decoration-color: rgba(27, 30, 40, 0.25)">Своя тренировка</a>
      <a href="#" style="min-height: 44px; display: inline-flex; align-items: center; font-size: 15px; font-weight: 500; color: #1B1E28; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; text-decoration-color: rgba(27, 30, 40, 0.25)">Пробный экзамен</a>
      <a href="#" style="min-height: 44px; display: inline-flex; align-items: center; font-size: 15px; font-weight: 500; color: #1B1E28; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; text-decoration-color: rgba(27, 30, 40, 0.25)">Слабые места</a>
    </nav>
  </main>

  <!-- Нижняя панель Telegram: содержимое уходит под растушёвку; MainButton рисует клиент -->
  <div style="flex: none; position: relative; padding: 8px 16px 24px; background: #F5F6F9">
    <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: -28px; height: 28px; background: linear-gradient(rgba(245, 246, 249, 0), #F5F6F9); pointer-events: none"></span>
    <button type="button" style="display: block; width: 100%; height: 50px; border: 0; border-radius: 12px; background: #1B1E28; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; font-weight: 600">Продолжить · вопрос 4 из 10</button>
  </div>

</div>
</x-dc>

}
}
</script>
</body>
</html>
