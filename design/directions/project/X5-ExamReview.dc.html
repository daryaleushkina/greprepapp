<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Practice test — Review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
/* Токены «Шагов»: светлая и тёмная тема. В компонентах — только var(--…) */
.s{
--bg:#F5F6F9;--surface:#FFFFFF;--text:#1B1E28;--text-2:#5A6070;--line:rgba(27,30,40,.12);--fill:rgba(27,30,40,.06);
--accent:#1B1E28;--on-accent:#FFFFFF;--wrong:#C2410C;--wrong-tint:rgba(194,65,12,.10);
--verbal:#5B4BC4;--verbal-tint:rgba(91,75,196,.12);--quant:#11735F;--quant-tint:rgba(17,115,95,.12);
--words:#B4446C;--words-tint:rgba(180,68,108,.12);--essay:#9A5B00;--essay-tint:rgba(154,91,0,.12);--exam:#1B1E28;
--glow:rgba(91,75,196,.22);--glow-2:rgba(91,75,196,.07);
--glass:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.54));--glass-strong:linear-gradient(180deg,rgba(255,255,255,.90),rgba(255,255,255,.70));--glass-edge:rgba(0,0,0,.06);--glass-rim:rgba(255,255,255,.6);
--glass-shadow:0 10px 30px -10px rgba(30,30,60,.22);--tab-sel:rgba(27,30,40,.07);--focus:#5B4BC4;
}
.s.dark{
--bg:#0E0F14;--surface:#1A1C23;--text:#F2F3F7;--text-2:#A3A8B5;--line:rgba(255,255,255,.12);--fill:rgba(255,255,255,.08);
--accent:#F2F3F7;--on-accent:#111318;--wrong:#FF8A4C;--wrong-tint:rgba(255,138,76,.14);
--verbal:#A898FF;--verbal-tint:rgba(168,152,255,.16);--quant:#4FC4A7;--quant-tint:rgba(79,196,167,.16);
--words:#F28AB0;--words-tint:rgba(242,138,176,.16);--essay:#F0B45A;--essay-tint:rgba(240,180,90,.16);--exam:#F2F3F7;
--glow:rgba(130,110,255,.30);--glow-2:rgba(130,110,255,.08);
--glass:linear-gradient(180deg,rgba(64,66,80,.62),rgba(32,34,44,.50));--glass-strong:linear-gradient(180deg,rgba(48,50,62,.82),rgba(30,32,42,.72));--glass-edge:rgba(0,0,0,.35);--glass-rim:rgba(255,255,255,.12);
--glass-shadow:0 10px 30px -10px rgba(0,0,0,.6);--tab-sel:rgba(255,255,255,.10);--focus:#A898FF;
}
a{color:var(--text)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
button:active,a:active{transform:scale(0.98)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--verbal-tint)}
@media (prefers-reduced-motion: reduce){button,a{transition:none}button:active,a:active{transform:none}}
@media (prefers-reduced-transparency: reduce){.glass{background:var(--surface)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
input[type=radio]{appearance:none;-webkit-appearance:none}
input[type=radio]:checked{border-color:var(--accent)!important;background:var(--accent)!important;box-shadow:inset 0 0 0 4px var(--surface)}
label:has(input:checked){box-shadow:inset 0 0 0 1.5px var(--accent)!important}
textarea{resize:none}
textarea:focus{outline:none}
</style>
</helmet>
<!-- Обзор вопросов секции: сетка 12 вопросов, отмеченные — закладкой; время на виду -->
<div class="s {{themeClass}}" style="width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: 'Onest', system-ui, sans-serif; color: var(--text); background: radial-gradient(120% 52% at 50% -10%, var(--glow) 0%, var(--glow-2) 48%, transparent 74%), var(--bg); display: flex; flex-direction: column; --glow: rgba(27,30,40,.09); --glow-2: rgba(27,30,40,.03);">

  <!-- Шапку рисует Telegram: стеклянные круги поверх содержимого -->
  <button type="button" class="glass" aria-label="Back" style="position: absolute; z-index: 6; top: 8px; left: 12px; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: flex; align-items: center; justify-content: center">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"></path></svg>
  </button>
  <button type="button" class="glass" aria-label="Меню" style="position: absolute; z-index: 6; top: 8px; right: 12px; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"></circle><circle cx="12" cy="12" r="1.7" fill="currentColor"></circle><circle cx="18.5" cy="12" r="1.7" fill="currentColor"></circle></svg>
  </button>

  <main lang="en" style="flex: 1; min-height: 0; overflow: hidden; padding: 68px 20px 12px; display: flex; flex-direction: column">

    <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <span style="font-size: 17px; line-height: 22px; font-weight: 600">Review · Quant 1</span>
      <span role="timer" aria-label="Time remaining 13 minutes 58 seconds" style="font-size: 22px; line-height: 26px; font-weight: 600; font-variant-numeric: tabular-nums">13:58</span>
    </div>
    <p style="flex: none; margin: 6px 0 0; font-size: 15px; line-height: 21px; color: var(--text-2); font-variant-numeric: tabular-nums">6 answered · 6 not answered · 2 marked</p>

    <div style="flex: none; margin-top: 22px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
      <button type="button" aria-label="Question 1: Answered" style="position: relative; height: 72px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 18px; background: var(--surface);  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        
        <span style="font-size: 20px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums">1</span>
        <span style="font-size: 12px; line-height: 15px; color: var(--text-2)">answered</span>
      </button>
      <button type="button" aria-label="Question 2: Answered" style="position: relative; height: 72px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 18px; background: var(--surface);  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        
        <span style="font-size: 20px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums">2</span>
        <span style="font-size: 12px; line-height: 15px; color: var(--text-2)">answered</span>
      </button>
      <button type="button" aria-label="Question 3: Not answered, marked" style="position: relative; height: 72px; box-sizing: border-box; border: 1.5px dashed var(--line); border-radius: 18px; background: transparent;  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        <span style="position: absolute; top: 7px; right: 8px; color: var(--text)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5h10v15.5l-5-3.5-5 3.5z"></path></svg></span>
        <span style="font-size: 20px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums">3</span>
        <span style="font-size: 12px; line-height: 15px; color: var(--text-2)">—</span>
      </button>
      <button type="button" aria-label="Question 4: Answered" style="position: relative; height: 72px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 18px; background: var(--surface);  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        
        <span style="font-size: 20px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums">4</span>
        <span style="font-size: 12px; line-height: 15px; color: var(--text-2)">answered</span>
      </button>
      <button type="button" aria-label="Question 5: Answered" style="position: relative; height: 72px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 18px; background: var(--surface);  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        
        <span style="font-size: 20px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums">5</span>
        <span style="font-size: 12px; line-height: 15px; color: var(--text-2)">answered</span>
      </button>
      <button type="button" aria-label="Question 6: Answered, marked" style="position: relative; height: 72px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 18px; background: var(--surface);  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        <span style="position: absolute; top: 7px; right: 8px; color: var(--text)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5h10v15.5l-5-3.5-5 3.5z"></path></svg></span>
        <span style="font-size: 20px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums">6</span>
        <span style="font-size: 12px; line-height: 15px; color: var(--text-2)">answered</span>
      </button>
      <button type="button" aria-label="Question 7: Answered, current" style="position: relative; height: 72px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 0 0 2px var(--accent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        
        <span style="font-size: 20px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums">7</span>
        <span style="font-size: 12px; line-height: 15px; color: var(--text-2)">answered</span>
      </button>
      <button type="button" aria-label="Question 8: Not answered" style="position: relative; height: 72px; box-sizing: border-box; border: 1.5px dashed var(--line); border-radius: 18px; background: transparent;  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        
        <span style="font-size: 20px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums">8</span>
        <span style="font-size: 12px; line-height: 15px; color: var(--text-2)">—</span>
      </button>
      <button type="button" aria-label="Question 9: Not answered" style="position: relative; height: 72px; box-sizing: border-box; border: 1.5px dashed var(--line); border-radius: 18px; background: transparent;  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        
        <span style="font-size: 20px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums">9</span>
        <span style="font-size: 12px; line-height: 15px; color: var(--text-2)">—</span>
      </button>
      <button type="button" aria-label="Question 10: Not answered" style="position: relative; height: 72px; box-sizing: border-box; border: 1.5px dashed var(--line); border-radius: 18px; background: transparent;  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        
        <span style="font-size: 20px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums">10</span>
        <span style="font-size: 12px; line-height: 15px; color: var(--text-2)">—</span>
      </button>
      <button type="button" aria-label="Question 11: Not answered" style="position: relative; height: 72px; box-sizing: border-box; border: 1.5px dashed var(--line); border-radius: 18px; background: transparent;  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        
        <span style="font-size: 20px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums">11</span>
        <span style="font-size: 12px; line-height: 15px; color: var(--text-2)">—</span>
      </button>
      <button type="button" aria-label="Question 12: Not answered" style="position: relative; height: 72px; box-sizing: border-box; border: 1.5px dashed var(--line); border-radius: 18px; background: transparent;  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        
        <span style="font-size: 20px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums">12</span>
        <span style="font-size: 12px; line-height: 15px; color: var(--text-2)">—</span>
      </button>
    </div>

    <div aria-hidden="true" style="flex: none; margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; line-height: 20px; color: var(--text-2)">
      <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 4px; background: var(--surface); border: 1px solid var(--line)"></span>Answered</span>
      <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 4px; border: 1.5px dashed var(--line)"></span>Not answered</span>
      <span style="display: inline-flex; align-items: center; gap: 6px; color: var(--text)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5h10v15.5l-5-3.5-5 3.5z"></path></svg><span style="color: var(--text-2)">Marked</span></span>
    </div>
  </main>

  <!-- Нижняя панель Telegram: содержимое уходит под растушёвку; кнопки рисует клиент -->
  <div lang="en" style="flex: none; position: relative; z-index: 3; padding: 8px 16px 24px; background: var(--bg); display: flex; gap: 10px">
    <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: -28px; height: 28px; background: linear-gradient(transparent, var(--bg)); pointer-events: none"></span>
    <button type="button" style="flex: 1; height: 50px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; font-weight: 600">Return to Question 7</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
return { themeClass: dark ? 'dark' : '' };
}
}
</script>
</body>
</html>
