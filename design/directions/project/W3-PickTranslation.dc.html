<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Слова — выбрать перевод</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
/* Токены «Шагов»: светлая и тёмная тема. В компонентах — только var(--…) */
.s{
--bg:#F5F6F9;--surface:#FFFFFF;--text:#1B1E28;--text-2:#5A6070;--line:rgba(27,30,40,.12);--fill:rgba(27,30,40,.06);
--accent:#1B1E28;--on-accent:#FFFFFF;--wrong:#C2410C;--wrong-tint:rgba(194,65,12,.10);
--verbal:#5B4BC4;--verbal-tint:rgba(91,75,196,.12);--quant:#11735F;--quant-tint:rgba(17,115,95,.12);
--words:#B4446C;--words-tint:rgba(180,68,108,.12);--essay:#9A5B00;--essay-tint:rgba(154,91,0,.12);--exam:#1B1E28;
--glow:rgba(91,75,196,.22);--glow-2:rgba(91,75,196,.07);
--glass:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.54));--glass-strong:linear-gradient(180deg,rgba(255,255,255,.90),rgba(255,255,255,.70));--glass-edge:rgba(0,0,0,.06);--glass-rim:rgba(255,255,255,.6);
--glass-shadow:0 10px 30px -10px rgba(30,30,60,.22);--tab-sel:rgba(27,30,40,.07);--focus:#5B4BC4;
}
.s.dark{
--bg:#0E0F14;--surface:#1A1C23;--text:#F2F3F7;--text-2:#A3A8B5;--line:rgba(255,255,255,.12);--fill:rgba(255,255,255,.08);
--accent:#F2F3F7;--on-accent:#111318;--wrong:#FF8A4C;--wrong-tint:rgba(255,138,76,.14);
--verbal:#A898FF;--verbal-tint:rgba(168,152,255,.16);--quant:#4FC4A7;--quant-tint:rgba(79,196,167,.16);
--words:#F28AB0;--words-tint:rgba(242,138,176,.16);--essay:#F0B45A;--essay-tint:rgba(240,180,90,.16);--exam:#F2F3F7;
--glow:rgba(130,110,255,.30);--glow-2:rgba(130,110,255,.08);
--glass:linear-gradient(180deg,rgba(64,66,80,.62),rgba(32,34,44,.50));--glass-strong:linear-gradient(180deg,rgba(48,50,62,.82),rgba(30,32,42,.72));--glass-edge:rgba(0,0,0,.35);--glass-rim:rgba(255,255,255,.12);
--glass-shadow:0 10px 30px -10px rgba(0,0,0,.6);--tab-sel:rgba(255,255,255,.10);--focus:#A898FF;
}
a{color:var(--text)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
button:active,a:active{transform:scale(0.98)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--words-tint)}
@media (prefers-reduced-motion: reduce){button,a{transition:none}button:active,a:active{transform:none}}
@media (prefers-reduced-transparency: reduce){.glass{background:var(--surface)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
</style>
</helmet>
<div class="s {{themeClass}}" style="--glow: rgba(180,68,108,.20); --glow-2: rgba(180,68,108,.06); width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: 'Onest', system-ui, sans-serif; color: var(--text); background: radial-gradient(120% 52% at 50% -10%, var(--glow) 0%, var(--glow-2) 48%, transparent 74%), var(--bg); display: flex; flex-direction: column">

  <button type="button" class="glass" aria-label="Назад" style="position: absolute; z-index: 6; top: 8px; left: 12px; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg>
  </button>
  <button type="button" class="glass" aria-label="Меню" style="position: absolute; z-index: 6; top: 8px; right: 12px; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"></circle><circle cx="12" cy="12" r="1.7" fill="currentColor"></circle><circle cx="18.5" cy="12" r="1.7" fill="currentColor"></circle></svg>
  </button>
  <div role="img" aria-label="Слово 3 из 12" style="position: absolute; z-index: 5; top: 8px; left: 68px; right: 68px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 10px">
    <span style="display: flex; align-items: center; gap: 5px"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--words)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--words)"></span><span style="width: 11px; height: 11px; box-sizing: border-box; border-radius: 50%; border: 2.5px solid var(--words)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--fill)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--fill)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--fill)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--fill)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--fill)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--fill)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--fill)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--fill)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--fill)"></span></span>
    <span style="font-size: 14px; line-height: 18px; font-weight: 600; font-variant-numeric: tabular-nums">3 из 12</span>
  </div>
  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 76px 20px 0; display: flex; flex-direction: column">
    <div style="display: flex; align-items: flex-start; gap: 12px">
      <div style="flex: 1; min-width: 0">
        <h1 lang="en" style="margin: 0; font-size: 40px; line-height: 46px; font-weight: 600; letter-spacing: -0.025em">equivocal</h1>
        <p style="margin: 4px 0 0; font-size: 16px; line-height: 22px; color: var(--text-2)"><span lang="en">[ɪˈkwɪvək(ə)l]</span> · <span lang="en">adj.</span></p>
      </div>
      <button type="button" class="glass" aria-label="Послушать" style="flex: none; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); color: var(--words); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 9.5h3l4.5-4v13l-4.5-4h-3z"></path><path d="M15.5 9a4 4 0 0 1 0 6"></path><path d="M18 6.5a7.5 7.5 0 0 1 0 11"></path></svg></button>
    </div>
    <p style="margin: 28px 0 12px; font-size: 15px; line-height: 20px; color: var(--text-2)">Выберите перевод</p>
    <div role="group" aria-label="Варианты перевода" style="display: flex; flex-direction: column; gap: 10px">
      <button type="button" aria-pressed="true" style="width: 100%; min-height: 56px; box-sizing: border-box; padding: 14px 16px; border-radius: 18px; display: flex; align-items: center; gap: 12px; text-align: left; font-size: 17px; line-height: 22px; border: 2px solid var(--words); padding: 13px 15px; background: var(--words-tint)"><span aria-hidden="true" style="flex: none; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 6px solid var(--words); background: var(--surface)"></span><span style="flex: 1; min-width: 0; font-weight: 500">двусмысленный, уклончивый</span></button>
      <button type="button" aria-pressed="false" style="width: 100%; min-height: 56px; box-sizing: border-box; padding: 14px 16px; border-radius: 18px; display: flex; align-items: center; gap: 12px; text-align: left; font-size: 17px; line-height: 22px; border: 1px solid var(--line); background: var(--surface)"><span aria-hidden="true" style="flex: none; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--line)"></span><span style="flex: 1; min-width: 0">справедливый, беспристрастный</span></button>
      <button type="button" aria-pressed="false" style="width: 100%; min-height: 56px; box-sizing: border-box; padding: 14px 16px; border-radius: 18px; display: flex; align-items: center; gap: 12px; text-align: left; font-size: 17px; line-height: 22px; border: 1px solid var(--line); background: var(--surface)"><span aria-hidden="true" style="flex: none; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--line)"></span><span style="flex: 1; min-width: 0">невозмутимый, спокойный</span></button>
      <button type="button" aria-pressed="false" style="width: 100%; min-height: 56px; box-sizing: border-box; padding: 14px 16px; border-radius: 18px; display: flex; align-items: center; gap: 12px; text-align: left; font-size: 17px; line-height: 22px; border: 1px solid var(--line); background: var(--surface)"><span aria-hidden="true" style="flex: none; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--line)"></span><span style="flex: 1; min-width: 0">многословный, болтливый</span></button>
    </div>
  </main>

  <!-- Нижняя панель Telegram: растушёвка и MainButton (рисует клиент; наши — цвет и текст) -->
  <div style="flex: none; position: relative; padding: 8px 16px 24px; background: var(--bg); display: flex; gap: 10px">
    <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: -28px; height: 28px; background: linear-gradient(transparent, var(--bg)); pointer-events: none"></span>
    <button type="button" style="flex: 1; height: 50px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; font-weight: 600">Проверить</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
return { themeClass: dark ? 'dark' : '' };
}
}
</script>
</body>
</html>
