<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Проверка — вопрос с таймером</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
/* Токены «Шагов»: светлая и тёмная тема. В компонентах — только var(--…) */
.s{
--bg:#F5F6F9;--surface:#FFFFFF;--text:#1B1E28;--text-2:#5A6070;--line:rgba(27,30,40,.12);--fill:rgba(27,30,40,.06);
--accent:#1B1E28;--on-accent:#FFFFFF;--wrong:#C2410C;--wrong-tint:rgba(194,65,12,.10);
--verbal:#5B4BC4;--verbal-tint:rgba(91,75,196,.12);--quant:#11735F;--quant-tint:rgba(17,115,95,.12);
--words:#B4446C;--words-tint:rgba(180,68,108,.12);--essay:#9A5B00;--essay-tint:rgba(154,91,0,.12);--exam:#1B1E28;
--glow:rgba(91,75,196,.22);--glow-2:rgba(91,75,196,.07);
--glass:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.54));--glass-strong:linear-gradient(180deg,rgba(255,255,255,.90),rgba(255,255,255,.70));--glass-edge:rgba(0,0,0,.06);--glass-rim:rgba(255,255,255,.6);
--glass-shadow:0 10px 30px -10px rgba(30,30,60,.22);--tab-sel:rgba(27,30,40,.07);--focus:#5B4BC4;
}
.s.dark{
--bg:#0E0F14;--surface:#1A1C23;--text:#F2F3F7;--text-2:#A3A8B5;--line:rgba(255,255,255,.12);--fill:rgba(255,255,255,.08);
--accent:#F2F3F7;--on-accent:#111318;--wrong:#FF8A4C;--wrong-tint:rgba(255,138,76,.14);
--verbal:#A898FF;--verbal-tint:rgba(168,152,255,.16);--quant:#4FC4A7;--quant-tint:rgba(79,196,167,.16);
--words:#F28AB0;--words-tint:rgba(242,138,176,.16);--essay:#F0B45A;--essay-tint:rgba(240,180,90,.16);--exam:#F2F3F7;
--glow:rgba(130,110,255,.30);--glow-2:rgba(130,110,255,.08);
--glass:linear-gradient(180deg,rgba(64,66,80,.62),rgba(32,34,44,.50));--glass-strong:linear-gradient(180deg,rgba(48,50,62,.82),rgba(30,32,42,.72));--glass-edge:rgba(0,0,0,.35);--glass-rim:rgba(255,255,255,.12);
--glass-shadow:0 10px 30px -10px rgba(0,0,0,.6);--tab-sel:rgba(255,255,255,.10);--focus:#A898FF;
}
a{color:var(--text)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
button:active,a:active{transform:scale(0.98)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--verbal-tint)}
@media (prefers-reduced-motion: reduce){button,a{transition:none}button:active,a:active{transform:none}}
@media (prefers-reduced-transparency: reduce){.glass{background:var(--surface)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
</style>
</helmet>
<!-- Режим «Проверка»: таймер виден, разбора нет до конца; вопрос 4 из 12 -->
<div class="s {{themeClass}}" style="width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: 'Onest', system-ui, sans-serif; color: var(--text); background: radial-gradient(120% 52% at 50% -10%, var(--glow) 0%, var(--glow-2) 48%, transparent 74%), var(--bg); display: flex; flex-direction: column">
  <!-- Шапку рисует Telegram: стеклянные круги поверх содержимого -->
  <button type="button" class="glass" aria-label="Назад" style="position: absolute; z-index: 6; top: 8px; left: 12px; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg>
  </button>
  <button type="button" class="glass" aria-label="Меню" style="position: absolute; z-index: 6; top: 8px; right: 12px; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"></circle><circle cx="12" cy="12" r="1.7" fill="currentColor"></circle><circle cx="18.5" cy="12" r="1.7" fill="currentColor"></circle></svg>
  </button>
  <!-- Время и номер — стеклянная плашка между кругами шапки; без красного -->
  <div class="glass" role="timer" aria-label="Осталось 12 минут 40 секунд, вопрос 4 из 12" style="position: absolute; z-index: 6; top: 12px; left: 50%; transform: translateX(-50%); height: 36px; box-sizing: border-box; padding: 0 14px; border-radius: 18px; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: flex; align-items: center; gap: 8px; white-space: nowrap; font-variant-numeric: tabular-nums">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7.5"></circle><path d="M12 9.5V13l2.5 1.5"></path><path d="M9.5 3h5"></path></svg>
    <span aria-hidden="true" style="font-size: 15px; line-height: 18px; font-weight: 600">12:40</span>
    <span aria-hidden="true" style="width: 1px; height: 16px; background: var(--line)"></span>
    <span aria-hidden="true" style="font-size: 14px; line-height: 18px; font-weight: 500; color: var(--text-2)">4 из 12</span>
  </div>
  <main style="flex: 1; min-height: 0; overflow-y: hidden; padding: 64px 16px 0; display: flex; flex-direction: column">
    <div aria-hidden="true" style="flex: none; display: flex; gap: 4px; margin: 0 2px"><span style="flex: 1; height: 3px; border-radius: 2px; background: var(--accent)"></span><span style="flex: 1; height: 3px; border-radius: 2px; background: var(--accent)"></span><span style="flex: 1; height: 3px; border-radius: 2px; background: var(--accent)"></span><span style="flex: 1; height: 3px; border-radius: 2px; background: var(--verbal)"></span><span style="flex: 1; height: 3px; border-radius: 2px; background: var(--line)"></span><span style="flex: 1; height: 3px; border-radius: 2px; background: var(--line)"></span><span style="flex: 1; height: 3px; border-radius: 2px; background: var(--line)"></span><span style="flex: 1; height: 3px; border-radius: 2px; background: var(--line)"></span><span style="flex: 1; height: 3px; border-radius: 2px; background: var(--line)"></span><span style="flex: 1; height: 3px; border-radius: 2px; background: var(--line)"></span><span style="flex: 1; height: 3px; border-radius: 2px; background: var(--line)"></span><span style="flex: 1; height: 3px; border-radius: 2px; background: var(--line)"></span></div>
    <section aria-label="Задание" style="flex: none; margin-top: 14px; border-radius: 24px; padding: 16px 18px 20px; background: var(--surface); border: 1px solid var(--line)">
      <p lang="en" style="margin: 0; font-size: 13px; line-height: 18px; color: var(--text-2)">Text Completion</p>
      <p lang="en" style="margin: 8px 0 0; font-size: 18px; line-height: 27px">The novelist’s later work, far from the <span role="img" aria-label="пропуск" style="display: inline-block; width: 72px; border-bottom: 1.5px solid var(--text); transform: translateY(-4px)"></span> prose of her early stories, is spare and unadorned.</p>
    </section>
    <div role="radiogroup" aria-label="Варианты ответа" style="flex: none; margin-top: 12px; display: flex; flex-direction: column; gap: 8px">
      <button type="button" role="radio" aria-checked="true" style="min-height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; background: linear-gradient(var(--verbal-tint), var(--verbal-tint)), var(--surface); border: 1.5px solid var(--verbal); display: flex; align-items: center; gap: 12px; text-align: left">
        <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--verbal); display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 50%; background: var(--verbal)"></span></span>
        <span style="flex: none; width: 14px; font-size: 14px; line-height: 20px; color: var(--text-2)">A</span>
        <span lang="en" style="font-size: 17px; line-height: 22px; font-weight: 600; font-variant-numeric: tabular-nums">ornate</span>
      </button>
      <button type="button" role="radio" aria-checked="false" style="min-height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); display: flex; align-items: center; gap: 12px; text-align: left">
        <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface)"></span>
        <span style="flex: none; width: 14px; font-size: 14px; line-height: 20px; color: var(--text-2)">B</span>
        <span lang="en" style="font-size: 17px; line-height: 22px; font-weight: 400; font-variant-numeric: tabular-nums">laconic</span>
      </button>
      <button type="button" role="radio" aria-checked="false" style="min-height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); display: flex; align-items: center; gap: 12px; text-align: left">
        <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface)"></span>
        <span style="flex: none; width: 14px; font-size: 14px; line-height: 20px; color: var(--text-2)">C</span>
        <span lang="en" style="font-size: 17px; line-height: 22px; font-weight: 400; font-variant-numeric: tabular-nums">lucid</span>
      </button>
      <button type="button" role="radio" aria-checked="false" style="min-height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); display: flex; align-items: center; gap: 12px; text-align: left">
        <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface)"></span>
        <span style="flex: none; width: 14px; font-size: 14px; line-height: 20px; color: var(--text-2)">D</span>
        <span lang="en" style="font-size: 17px; line-height: 22px; font-weight: 400; font-variant-numeric: tabular-nums">terse</span>
      </button>
      <button type="button" role="radio" aria-checked="false" style="min-height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); display: flex; align-items: center; gap: 12px; text-align: left">
        <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface)"></span>
        <span style="flex: none; width: 14px; font-size: 14px; line-height: 20px; color: var(--text-2)">E</span>
        <span lang="en" style="font-size: 17px; line-height: 22px; font-weight: 400; font-variant-numeric: tabular-nums">plain</span>
      </button>
    </div>
    <p style="flex: none; margin: 14px 0 0; text-align: center; font-size: 14px; line-height: 20px; color: var(--text-2)">Разбор — после последнего вопроса</p>
  </main>

  <!-- Нижняя панель Telegram: содержимое уходит под растушёвку; кнопки рисует клиент -->
  <div style="flex: none; position: relative; z-index: 4; padding: 8px 16px 24px; background: var(--bg); display: flex; gap: 10px">
    <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: -28px; height: 28px; background: linear-gradient(transparent, var(--bg)); pointer-events: none"></span>
    <button type="button" style="flex: none; width: 128px; height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; font-weight: 600">Пропустить</button>
    <button type="button" style="flex: 1; height: 50px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">Дальше · 5 из 12</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
return { themeClass: dark ? 'dark' : '' };
}
}
</script>
</body>
</html>
