<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ключ — Конструктор</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;family=PT+Mono&amp;display=swap">
<style>
body{margin:0}
a{color:#161616}a:hover{color:#0F6B58}
button{font:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid #13806A;outline-offset:2px}
a:active,button:active{opacity:.84}
::selection{background:#CFE8E1;color:#161616}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: 'Golos Text', sans-serif; color: #161616; background: #FFFFFF; display: flex; flex-direction: column">

  <!-- Шапка Telegram -->
  <header style="height: 52px; flex-shrink: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 4px; background: #FFFFFF">
    <button type="button" style="justify-self: start; height: 44px; display: flex; align-items: center; gap: 2px; padding: 0 12px 0 4px; border: 0; background: transparent; color: #161616; font-size: 17px; line-height: 1">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#161616" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      Назад
    </button>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 17px; line-height: 1; font-weight: 600">
      <span aria-hidden="true" style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #13806A; display: flex; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 50%; background: #161616"></span></span>
      Ключ
    </div>
    <button type="button" aria-label="Меню" style="justify-self: end; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
      <span style="width: 32px; height: 32px; border-radius: 50%; background: #F0F2F1; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="4" viewBox="0 0 18 4" aria-hidden="true"><circle cx="2" cy="2" r="1.75" fill="#161616"/><circle cx="9" cy="2" r="1.75" fill="#161616"/><circle cx="16" cy="2" r="1.75" fill="#161616"/></svg>
      </span>
    </button>
  </header>

  <!-- Область бланка -->
  <main style="flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 22px 36px 0 20px">
    <span aria-hidden="true" style="position: absolute; left: 6px; top: 8px; width: 10px; height: 10px; background: #161616"></span>
    <span aria-hidden="true" style="position: absolute; right: 10px; top: 8px; width: 10px; height: 10px; background: #161616"></span>

    <!-- тайминг-метки: будущая сессия — 10 пустых меток, по одной на вопрос -->
    <div aria-hidden="true" style="position: absolute; right: 8px; top: 26px; display: flex; flex-direction: column; align-items: flex-end; gap: 7px">
      <span style="display: block; width: 14px; height: 4px; box-sizing: border-box; border: 1px solid #161616"></span>
      <span style="display: block; width: 14px; height: 4px; box-sizing: border-box; border: 1px solid #161616"></span>
      <span style="display: block; width: 14px; height: 4px; box-sizing: border-box; border: 1px solid #161616"></span>
      <span style="display: block; width: 14px; height: 4px; box-sizing: border-box; border: 1px solid #161616"></span>
      <span style="display: block; width: 14px; height: 4px; box-sizing: border-box; border: 1px solid #161616"></span>
      <span style="display: block; width: 14px; height: 4px; box-sizing: border-box; border: 1px solid #161616"></span>
      <span style="display: block; width: 14px; height: 4px; box-sizing: border-box; border: 1px solid #161616"></span>
      <span style="display: block; width: 14px; height: 4px; box-sizing: border-box; border: 1px solid #161616"></span>
      <span style="display: block; width: 14px; height: 4px; box-sizing: border-box; border: 1px solid #161616"></span>
      <span style="display: block; width: 14px; height: 4px; box-sizing: border-box; border: 1px solid #161616"></span>
    </div>

    <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em">Новая тренировка</h1>

    <!-- Сводка одной фразой: каждая часть — вписанное значение поля, нажатие раскрывает выбор -->
    <div role="group" aria-label="Сводка тренировки" style="margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center">
      <button type="button" aria-expanded="false" style="height: 44px; padding: 0 1px; border: 0; background: transparent; color: #161616; font-size: 16px; font-weight: 500"><span style="text-decoration: underline; text-decoration-color: #13806A; text-decoration-thickness: 1px; text-underline-offset: 6px">Verbal</span></button>
      <span aria-hidden="true" style="padding: 0 7px; font-size: 16px; color: #13806A">·</span>
      <button type="button" aria-expanded="true" style="height: 44px; padding: 0 1px; border: 0; background: transparent; color: #161616; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 3px"><span style="text-decoration: underline; text-decoration-color: #161616; text-decoration-thickness: 2px; text-underline-offset: 6px">Text Completion</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#161616" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 14.5 12 8.5l6 6"/></svg></button>
      <span aria-hidden="true" style="padding: 0 7px; font-size: 16px; color: #13806A">·</span>
      <button type="button" aria-expanded="false" style="height: 44px; padding: 0 1px; border: 0; background: transparent; color: #161616; font-size: 16px; font-weight: 500"><span style="text-decoration: underline; text-decoration-color: #13806A; text-decoration-thickness: 1px; text-underline-offset: 6px">все темы</span></button>
      <span aria-hidden="true" style="padding: 0 7px; font-size: 16px; color: #13806A">·</span>
      <button type="button" aria-expanded="false" style="height: 44px; padding: 0 1px; border: 0; background: transparent; color: #161616; font-size: 16px; font-weight: 500"><span style="text-decoration: underline; text-decoration-color: #13806A; text-decoration-thickness: 1px; text-underline-offset: 6px">любая сложность</span></button>
      <span aria-hidden="true" style="padding: 0 7px; font-size: 16px; color: #13806A">·</span>
      <button type="button" aria-expanded="false" style="height: 44px; padding: 0 1px; border: 0; background: transparent; color: #161616; font-size: 16px; font-weight: 500"><span style="text-decoration: underline; text-decoration-color: #13806A; text-decoration-thickness: 1px; text-underline-offset: 6px"><span style="font-family: 'PT Mono', monospace; font-weight: 400">10</span> вопросов</span></button>
      <span aria-hidden="true" style="padding: 0 7px; font-size: 16px; color: #13806A">·</span>
      <button type="button" aria-expanded="false" style="height: 44px; padding: 0 1px; border: 0; background: transparent; color: #161616; font-size: 16px; font-weight: 500"><span style="text-decoration: underline; text-decoration-color: #13806A; text-decoration-thickness: 1px; text-underline-offset: 6px">Практика</span></button>
    </div>

    <!-- Поля бланка с общими линейками -->
    <div style="margin-top: 10px; border: 1px solid #13806A; display: flex; flex-direction: column">

      <!-- Раздел -->
      <div role="radiogroup" aria-label="Раздел" style="display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 12px">
        <span style="width: 72px; flex-shrink: 0; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.01em; color: #13806A">Раздел</span>
        <button type="button" role="radio" aria-checked="true" style="height: 44px; display: flex; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; color: #161616; font-size: 15px; font-weight: 600">
          <span aria-hidden="true" style="width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #13806A; background: #161616"></span>
          Verbal
        </button>
        <button type="button" role="radio" aria-checked="false" style="height: 44px; display: flex; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; color: #161616; font-size: 15px; font-weight: 500">
          <span aria-hidden="true" style="width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #13806A; background: #FFFFFF"></span>
          Quant
        </button>
        <button type="button" role="radio" aria-checked="false" style="height: 44px; display: flex; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; color: #161616; font-size: 15px; font-weight: 500">
          <span aria-hidden="true" style="width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #13806A; background: #FFFFFF"></span>
          Эссе
        </button>
      </div>

      <!-- Тип задания — раскрыт -->
      <div style="border-top: 1px solid #13806A; padding: 10px 4px 4px 12px; display: flex; flex-direction: column">
        <span style="font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.01em; color: #13806A">Тип задания</span>
        <div role="radiogroup" aria-label="Тип задания" style="margin-top: 2px; display: flex; flex-direction: column">
          <button type="button" role="radio" aria-checked="false" style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 0; border: 0; background: transparent; color: #161616; text-align: left">
            <span aria-hidden="true" style="width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #13806A; background: #FFFFFF"></span>
            <span style="flex: 1; font-size: 16px; line-height: 22px">Reading Comprehension</span>
            <span style="flex-shrink: 0; font-size: 13px; line-height: 18px; color: #4B5563">доступно <span style="font-family: 'PT Mono', monospace; font-size: 14px; color: #161616">64</span></span>
          </button>
          <button type="button" role="radio" aria-checked="true" style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 0; border: 0; background: transparent; color: #161616; text-align: left">
            <span aria-hidden="true" style="width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #13806A; background: #161616"></span>
            <span style="flex: 1; font-size: 16px; line-height: 22px; font-weight: 600">Text Completion</span>
            <span style="flex-shrink: 0; font-size: 13px; line-height: 18px; color: #4B5563">доступно <span style="font-family: 'PT Mono', monospace; font-size: 14px; color: #161616">58</span></span>
          </button>
          <button type="button" role="radio" aria-checked="false" style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 0; border: 0; background: transparent; color: #161616; text-align: left">
            <span aria-hidden="true" style="width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #13806A; background: #FFFFFF"></span>
            <span style="flex: 1; font-size: 16px; line-height: 22px">Sentence Equivalence</span>
            <span style="flex-shrink: 0; font-size: 13px; line-height: 18px; color: #4B5563">доступно <span style="font-family: 'PT Mono', monospace; font-size: 14px; color: #161616">41</span></span>
          </button>
        </div>
      </div>

      <!-- Количество: цифры вписаны в кружки, как цифровая сетка бланка -->
      <div role="radiogroup" aria-label="Количество вопросов" style="border-top: 1px solid #13806A; display: flex; align-items: center; gap: 2px; padding: 4px 4px 4px 12px">
        <span style="width: 72px; flex-shrink: 0; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.01em; color: #13806A">Количество</span>
        <button type="button" role="radio" aria-checked="false" aria-label="5 вопросов" style="width: 48px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
          <span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #13806A; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'PT Mono', monospace; font-size: 14px; line-height: 1; color: #13806A">5</span>
        </button>
        <button type="button" role="radio" aria-checked="true" aria-label="10 вопросов" style="width: 48px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
          <span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #13806A; background: #161616; display: flex; align-items: center; justify-content: center; font-family: 'PT Mono', monospace; font-size: 14px; line-height: 1; color: #FFFFFF">10</span>
        </button>
        <button type="button" role="radio" aria-checked="false" aria-label="20 вопросов" style="width: 48px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
          <span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #13806A; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'PT Mono', monospace; font-size: 14px; line-height: 1; color: #13806A">20</span>
        </button>
        <span style="margin-left: 6px; font-size: 14px; color: #4B5563">вопросов</span>
      </div>

      <!-- Режим -->
      <div style="border-top: 1px solid #13806A; padding: 10px 4px 2px 12px; display: flex; flex-direction: column">
        <span style="font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.01em; color: #13806A">Режим</span>
        <div role="radiogroup" aria-label="Режим" style="display: flex; flex-direction: column">
          <button type="button" role="radio" aria-checked="true" style="min-height: 56px; display: flex; align-items: flex-start; gap: 10px; padding: 7px 8px 7px 0; border: 0; background: transparent; color: #161616; text-align: left">
            <span aria-hidden="true" style="width: 22px; height: 22px; flex-shrink: 0; margin-top: 0; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #13806A; background: #161616"></span>
            <span style="display: flex; flex-direction: column; gap: 1px">
              <span style="font-size: 16px; line-height: 22px; font-weight: 600">Практика</span>
              <span style="font-size: 14px; line-height: 20px; color: #4B5563">разбор после каждого вопроса, без таймера</span>
            </span>
          </button>
          <button type="button" role="radio" aria-checked="false" style="min-height: 56px; display: flex; align-items: flex-start; gap: 10px; padding: 7px 8px 7px 0; border: 0; background: transparent; color: #161616; text-align: left">
            <span aria-hidden="true" style="width: 22px; height: 22px; flex-shrink: 0; margin-top: 0; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #13806A; background: #FFFFFF"></span>
            <span style="display: flex; flex-direction: column; gap: 1px">
              <span style="font-size: 16px; line-height: 22px; font-weight: 500">Проверка</span>
              <span style="font-size: 14px; line-height: 20px; color: #4B5563">разбор в конце, с таймером <span style="font-family: 'PT Mono', monospace; color: #161616">~15</span> мин</span>
            </span>
          </button>
        </div>
      </div>

    </div>

    <!-- Быстрые наборы — вторично -->
    <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.01em; color: #13806A">Быстрые наборы</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" style="height: 44px; padding: 0 14px; border: 1px solid #161616; border-radius: 6px; background: #FFFFFF; color: #161616; font-size: 15px; font-weight: 500">Как в прошлый раз</button>
        <button type="button" style="height: 44px; padding: 0 14px; border: 1px solid #161616; border-radius: 6px; background: #FFFFFF; color: #161616; font-size: 15px; font-weight: 500">Мои ошибки · <span style="font-family: 'PT Mono', monospace">23</span></button>
      </div>
    </div>
  </main>

  <!-- Итог над кнопкой + MainButton Telegram -->
  <div style="flex-shrink: 0; background: #FFFFFF; box-shadow: 0 -1px 0 #E1E5E3">
    <p style="margin: 0; padding: 12px 20px 0; text-align: center; font-size: 14px; line-height: 20px; color: #4B5563"><span style="font-family: 'PT Mono', monospace; color: #161616">~15</span> мин · разбор после каждого вопроса</p>
    <div style="padding: 12px 16px 20px">
      <button type="button" style="width: 100%; height: 50px; border: 0; border-radius: 6px; background: #161616; color: #FFFFFF; font-size: 17px; font-weight: 600">Начать · 10 вопросов</button>
    </div>
  </div>

</div>
</x-dc>

return {};

</body>
</html>
