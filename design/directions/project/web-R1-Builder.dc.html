<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новая тренировка — компьютер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
/* Токены «Шагов»: светлая и тёмная тема. В компонентах — только var(--…) */
.s{
--bg:#F5F6F9;--surface:#FFFFFF;--text:#1B1E28;--text-2:#5A6070;--line:rgba(27,30,40,.12);--fill:rgba(27,30,40,.06);
--accent:#1B1E28;--on-accent:#FFFFFF;--wrong:#C2410C;--wrong-tint:rgba(194,65,12,.10);
--verbal:#5B4BC4;--verbal-tint:rgba(91,75,196,.12);--quant:#11735F;--quant-tint:rgba(17,115,95,.12);
--words:#B4446C;--words-tint:rgba(180,68,108,.12);--essay:#9A5B00;--essay-tint:rgba(154,91,0,.12);--exam:#1B1E28;
--glow:rgba(91,75,196,.22);--glow-2:rgba(91,75,196,.07);
--glass:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.54));--glass-strong:linear-gradient(180deg,rgba(255,255,255,.90),rgba(255,255,255,.70));--glass-edge:rgba(0,0,0,.06);--glass-rim:rgba(255,255,255,.6);
--glass-shadow:0 10px 30px -10px rgba(30,30,60,.22);--tab-sel:rgba(27,30,40,.07);--focus:#5B4BC4;
}
.s.dark{
--bg:#0E0F14;--surface:#1A1C23;--text:#F2F3F7;--text-2:#A3A8B5;--line:rgba(255,255,255,.12);--fill:rgba(255,255,255,.08);
--accent:#F2F3F7;--on-accent:#111318;--wrong:#FF8A4C;--wrong-tint:rgba(255,138,76,.14);
--verbal:#A898FF;--verbal-tint:rgba(168,152,255,.16);--quant:#4FC4A7;--quant-tint:rgba(79,196,167,.16);
--words:#F28AB0;--words-tint:rgba(242,138,176,.16);--essay:#F0B45A;--essay-tint:rgba(240,180,90,.16);--exam:#F2F3F7;
--glow:rgba(130,110,255,.30);--glow-2:rgba(130,110,255,.08);
--glass:linear-gradient(180deg,rgba(64,66,80,.62),rgba(32,34,44,.50));--glass-strong:linear-gradient(180deg,rgba(48,50,62,.82),rgba(30,32,42,.72));--glass-edge:rgba(0,0,0,.35);--glass-rim:rgba(255,255,255,.12);
--glass-shadow:0 10px 30px -10px rgba(0,0,0,.6);--tab-sel:rgba(255,255,255,.10);--focus:#A898FF;
}
a{color:var(--text)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
button:active,a:active{transform:scale(0.98)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--verbal-tint)}
@media (prefers-reduced-motion: reduce){button,a{transition:none}button:active,a:active{transform:none}}
@media (prefers-reduced-transparency: reduce){.glass{background:var(--surface)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:12px;line-height:1;font-weight:500;color:var(--text-2);font-variant-numeric:tabular-nums}
@media (hover:hover) and (pointer:fine){.nav-item:hover{background:var(--fill)}.row-link:hover{background:var(--fill)}}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.r-in{animation:r-in 240ms cubic-bezier(0.23,1,0.32,1)}
@keyframes r-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.rc-s{border-radius:6px;padding:2px 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone;cursor:pointer}
.rc-s:has(input:checked){background:var(--verbal-tint);box-shadow:inset 0 -2px 0 var(--verbal)}
@media (hover:hover) and (pointer:fine){.rc-s:hover{background:var(--fill)}.opt:hover{box-shadow:inset 0 0 0 1px var(--text-2)}}
@media (prefers-reduced-motion: reduce){.r-in{animation:none}}
</style>
</helmet>
<div class="s {{themeClass}}" style="min-height: 100vh; box-sizing: border-box; font-family: 'Onest', system-ui, sans-serif; color: var(--text); background: radial-gradient(70% 55% at 50% -15%, var(--glow) 0%, var(--glow-2) 50%, transparent 78%), var(--bg); display: flex; flex-direction: column">
  <header style="flex: none; min-height: 64px; box-sizing: border-box; padding: 10px clamp(16px, 3vw, 32px); display: grid; grid-template-columns: minmax(44px, 1fr) auto minmax(44px, 1fr); align-items: center; gap: 12px">
    <div style="display: flex; justify-content: flex-start"><a href="web-T1-Today.dc.html" class="glass" aria-label="Назад" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); color: var(--text); text-decoration: none; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg></a></div>
    <div style="display: flex; justify-content: center; min-width: 0"></div>
    <div style="display: flex; justify-content: flex-end"></div>
  </header>
  <main style="flex: 1; box-sizing: border-box; padding: clamp(16px, 3vw, 40px) clamp(16px, 4vw, 48px) 56px; display: flex; justify-content: center">
    <div style="width: 100%; max-width: 1040px; display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 36px; line-height: 42px; font-weight: 600; letter-spacing: -0.025em">Новая тренировка</h1>
      <!-- Готовые наборы и своя сборка рядом: на широком экране обе видны сразу -->
      <div style="margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(400px, 100%), 1fr)); gap: 24px; align-items: start">
        <div role="radiogroup" aria-label="Готовые наборы" class="glass" style="padding-left: 18px; border-radius: 26px; background: var(--glass-strong); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow)"><button type="button" class="opt" role="radio" aria-checked="true" style="width: 100%; min-height: 66px; box-sizing: border-box; margin: 0; padding: 12px 18px 12px 0; border: 0; border-bottom: 0.5px solid var(--line); border-radius: 0; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; color: var(--text)"><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 17px; line-height: 22px; font-weight: 500">Как в прошлый раз</span><span style="font-size: 14px; line-height: 19px; color: var(--text-2)"><span lang="en">Verbal · Text Completion</span> · 10 · Практика</span></span><span aria-hidden="true" style="flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.5l4 4 9-9"></path></svg></span></button><button type="button" class="opt" role="radio" aria-checked="false" style="width: 100%; min-height: 66px; box-sizing: border-box; margin: 0; padding: 12px 18px 12px 0; border: 0; border-bottom: 0.5px solid var(--line); border-radius: 0; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; color: var(--text)"><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 17px; line-height: 22px; font-weight: 500">Мои ошибки</span><span style="font-size: 14px; line-height: 19px; color: var(--text-2)">23 задания из всех разделов</span></span><span aria-hidden="true" style="flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--line)"></span></button><button type="button" class="opt" role="radio" aria-checked="false" style="width: 100%; min-height: 66px; box-sizing: border-box; margin: 0; padding: 12px 18px 12px 0; border: 0; border-bottom: 0.5px solid var(--line); border-radius: 0; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; color: var(--text)"><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 17px; line-height: 22px; font-weight: 500">Слабая тема: проценты и доли</span><span style="font-size: 14px; line-height: 19px; color: var(--text-2)"><span lang="en">Quant</span> · 8 вопросов</span></span><span aria-hidden="true" style="flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--line)"></span></button><button type="button" class="opt" role="radio" aria-checked="false" style="width: 100%; min-height: 66px; box-sizing: border-box; margin: 0; padding: 12px 18px 12px 0; border: 0; border-radius: 0; background: transparent; display: flex; align-items: center; gap: 12px; text-align: left; color: var(--text)"><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 17px; line-height: 22px; font-weight: 500">Проверка на время</span><span style="font-size: 14px; line-height: 19px; color: var(--text-2)"><span lang="en">Verbal</span> · 12 вопросов · 18 мин, как секция экзамена</span></span><span aria-hidden="true" style="flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--line)"></span></button></div>
        <div style="padding-left: 18px; border-radius: 26px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line)">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 60px; padding-right: 16px; border-bottom: 0.5px solid var(--line)"><span style="font-size: 17px; line-height: 22px">Раздел</span><div role="group" aria-label="Раздел" class="glass" style="flex: none; height: 42px; box-sizing: border-box; padding: 3px; border-radius: 21px; display: flex; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow)"><button type="button" aria-pressed="true" style="flex: 1; height: 34px; padding: 0 14px; border: 0; border-radius: 17px; font-size: 15px; background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.10), 0 2px 8px rgba(0,0,0,.05)">Verbal</button><button type="button" aria-pressed="false" style="flex: 1; height: 34px; padding: 0 14px; border: 0; border-radius: 17px; font-size: 15px; background: transparent; color: var(--text-2); font-weight: 500">Quant</button></div></div>
        <a href="#" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 60px; padding-right: 16px; border-bottom: 0.5px solid var(--line); text-decoration: none; color: var(--text)"><span style="font-size: 17px; line-height: 22px">Тип</span><span style="display: flex; align-items: center; gap: 6px; font-size: 16px; line-height: 22px; color: var(--text-2)"><span lang="en">Text Completion</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"></path></svg></span></a>
        <label for="w-r1-count" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 60px; padding-right: 16px; border-bottom: 0.5px solid var(--line)"><span style="font-size: 17px; line-height: 22px">Вопросов</span><input id="w-r1-count" type="number" inputmode="numeric" min="1" max="60" value="10" class="glass" style="width: 80px; height: 42px; box-sizing: border-box; padding: 0 8px; border-radius: 21px; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); text-align: center; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums"></label>
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 16px 14px 0; border-bottom: 0.5px solid var(--line)">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px"><span style="font-size: 17px; line-height: 22px">Режим</span><div role="group" aria-label="Режим" class="glass" style="flex: none; height: 42px; box-sizing: border-box; padding: 3px; border-radius: 21px; display: flex; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow)"><button type="button" aria-pressed="true" style="flex: 1; height: 34px; padding: 0 14px; border: 0; border-radius: 17px; font-size: 15px; background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.10), 0 2px 8px rgba(0,0,0,.05)">Практика</button><button type="button" aria-pressed="false" style="flex: 1; height: 34px; padding: 0 14px; border: 0; border-radius: 17px; font-size: 15px; background: transparent; color: var(--text-2); font-weight: 500">Проверка</button></div></div>
          <p style="margin: 0; font-size: 14px; line-height: 19px; color: var(--text-2)">Разбор после каждого вопроса, без таймера</p>
        </div>
        <a href="web-R2-BuilderTopics.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 60px; padding-right: 16px; text-decoration: none; color: var(--text)"><span style="font-size: 17px; line-height: 22px">Темы и сложность</span><span style="display: flex; align-items: center; gap: 6px; font-size: 16px; line-height: 22px; color: var(--text-2)">все<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"></path></svg></span></a>
      </div>
      </div>
      <div style="margin-top: 36px; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 14px 16px">
        <p style="margin: 0 auto 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 13px; line-height: 18px; color: var(--text-2)"><span class="kbd">Enter</span> начать</p>
        
        <div style="display: flex; flex-wrap: wrap; gap: 10px"><a href="web-R3-QuestionTC.dc.html" style="height: 48px; padding: 0 24px; border: 0; border-radius: 24px; font-size: 16px; line-height: 20px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; font-variant-numeric: tabular-nums; text-decoration: none; background: var(--accent); color: var(--on-accent)">Начать · 10 вопросов · ~12 мин</a></div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
return { themeClass: dark ? 'dark' : '' };
}
}
</script>
</body>
</html>
