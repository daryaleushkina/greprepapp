<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Г · Telegram — Главная</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.tg{--tg-theme-bg-color:#FFFFFF;--tg-theme-secondary-bg-color:#F2F2F7;--tg-theme-section-bg-color:#FFFFFF;--tg-theme-text-color:#000000;--tg-theme-hint-color:#616166;--tg-theme-link-color:#2481CC;--tg-theme-section-separator-color:rgba(60,60,67,0.16);--tg-theme-section-header-text-color:#616166;--tg-theme-destructive-text-color:#D93A2F;--brand:#6E56CF;--on-brand:#FFFFFF;--brand-soft:rgba(110,86,207,0.10);--wrong:#C2410C;--fill:rgba(118,118,128,0.10);--track:rgba(118,118,128,0.18);--chev:#BDBDC2;--glow:rgba(110,86,207,0.16);--glow-2:rgba(110,86,207,0.05);--page-0:rgba(242,242,247,0);--glass-bg:rgba(255,255,255,0.62);--glass-edge:rgba(0,0,0,0.06);--glass-rim:rgba(255,255,255,0.55);--glass-shadow:0 8px 24px rgba(0,0,0,0.08);--glass-on:#FFFFFF;color-scheme:light}
.tg.dark{--tg-theme-bg-color:#000000;--tg-theme-secondary-bg-color:#000000;--tg-theme-section-bg-color:#1C1C1E;--tg-theme-text-color:#FFFFFF;--tg-theme-hint-color:#98989F;--tg-theme-link-color:#3E88F7;--tg-theme-section-separator-color:rgba(84,84,88,0.55);--tg-theme-section-header-text-color:#8D8D93;--tg-theme-destructive-text-color:#FF6961;--brand:#9E8CFC;--on-brand:#14121F;--brand-soft:rgba(158,140,252,0.16);--wrong:#FF8A4C;--fill:rgba(118,118,128,0.24);--track:rgba(118,118,128,0.32);--chev:#5A5A5F;--glow:rgba(158,140,252,0.16);--glow-2:rgba(158,140,252,0.05);--page-0:rgba(0,0,0,0);--glass-bg:rgba(28,28,30,0.55);--glass-edge:rgba(0,0,0,0.35);--glass-rim:rgba(255,255,255,0.12);--glass-shadow:0 8px 24px rgba(0,0,0,0.40);--glass-on:rgba(255,255,255,0.18);color-scheme:dark}
@media (prefers-reduced-transparency: reduce){.glass{background:var(--tg-theme-section-bg-color)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
a{color:#6E56CF}a:hover{color:#5A44B8}
button{font:inherit;cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
button:active,a:active{transform:scale(0.97)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::selection{background:rgba(110,86,207,.22)}
@media (prefers-reduced-motion: reduce){button,a{transition:none}button:active,a:active{transform:none}}
</style>
</helmet>
<div class="tg {{themeClass}}" style="width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: var(--tg-theme-text-color); background: radial-gradient(140% 52% at 50% -14%, var(--glow) 0%, var(--glow-2) 48%, transparent 76%), var(--tg-theme-secondary-bg-color); -webkit-font-smoothing: antialiased">

  <!-- Шапку рисует Telegram: стеклянные круги поверх содержимого, названия нет, пока не выбрано имя -->
  <header style="position: absolute; z-index: 3; top: 8px; left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none">
    <button type="button" aria-label="Закрыть" class="glass" style="pointer-events: auto; width: 44px; height: 44px; padding: 0; border-radius: 50%; color: var(--tg-theme-text-color); display: flex; align-items: center; justify-content: center; background: var(--glass-bg); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg>
    </button>
    <button type="button" aria-label="Меню" class="glass" style="pointer-events: auto; width: 44px; height: 44px; padding: 0; border-radius: 50%; color: var(--tg-theme-text-color); display: flex; align-items: center; justify-content: center; background: var(--glass-bg); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="18.5" cy="12" r="1.8"></circle></svg>
    </button>
  </header>

  <main style="height: 844px; box-sizing: border-box; overflow: hidden; padding: 62px 16px 110px; display: flex; flex-direction: column">

    <h1 style="flex: none; margin: 0 4px 18px; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.01em">Сегодня</h1>

    <!-- То, что делать сейчас. Действие — в MainButton, поэтому номер вопроса здесь не повторяем -->
    <section aria-labelledby="d1-cont" style="flex: none; background: var(--tg-theme-section-bg-color); border-radius: 26px; padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span aria-hidden="true" style="flex: none; width: 32px; height: 32px; border-radius: 9px; background: #6E56CF; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 6.5h14"></path><path d="M5 11.5h14"></path><path d="M5 16.5h9"></path></svg>
        </span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <h2 id="d1-cont" style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 600">Продолжить тренировку</h2>
          <p lang="en" style="margin: 0; font-size: 15px; line-height: 20px; color: var(--tg-theme-hint-color)">Verbal · Text Completion</p>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <p style="margin: 0; display: flex; align-items: baseline; gap: 8px; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums">
          <span style="font-size: 40px; line-height: 44px; font-weight: 600; letter-spacing: -0.01em">~7 мин</span>
          <span style="font-size: 17px; line-height: 22px; font-weight: 500; color: var(--tg-theme-hint-color)">осталось</span>
        </p>
        <div role="progressbar" aria-label="Отвечено 3 из 10" aria-valuemin="0" aria-valuemax="10" aria-valuenow="3" style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
          <span style="height: 4px; border-radius: 2px; background: var(--brand)"></span>
          <span style="height: 4px; border-radius: 2px; background: var(--brand)"></span>
          <span style="height: 4px; border-radius: 2px; background: var(--brand)"></span>
          <span style="height: 4px; border-radius: 2px; background: var(--track)"></span>
          <span style="height: 4px; border-radius: 2px; background: var(--track)"></span>
          <span style="height: 4px; border-radius: 2px; background: var(--track)"></span>
          <span style="height: 4px; border-radius: 2px; background: var(--track)"></span>
          <span style="height: 4px; border-radius: 2px; background: var(--track)"></span>
          <span style="height: 4px; border-radius: 2px; background: var(--track)"></span>
          <span style="height: 4px; border-radius: 2px; background: var(--track)"></span>
        </div>
      </div>
    </section>

    <h2 style="flex: none; margin: 30px 20px 8px; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--tg-theme-section-header-text-color)">Ещё на сегодня</h2>
    <div style="flex: none; background: var(--tg-theme-section-bg-color); border-radius: 26px; overflow: hidden">
      <a href="#" style="display: flex; align-items: center; gap: 14px; padding-left: 18px; color: var(--tg-theme-text-color); text-decoration: none">
        <span aria-hidden="true" style="flex: none; width: 32px; height: 32px; border-radius: 9px; background: #12A594; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5a7.5 7.5 0 0 1 13-5l2 2"></path><path d="M19.5 4v4.5H15"></path><path d="M19.5 12.5a7.5 7.5 0 0 1-13 5l-2-2"></path><path d="M4.5 20v-4.5H9"></path></svg>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 66px; padding: 11px 18px 11px 0; box-sizing: border-box">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-size: 17px; line-height: 22px">Повторить проценты и доли</span>
            <span style="font-size: 15px; line-height: 20px; color: var(--tg-theme-hint-color)">8 вопросов · ~10 мин</span>
          </span>
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none" aria-hidden="true" style="flex: none; color: var(--chev)"><path d="m1.5 1.5 5 5.5-5 5.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </span>
      </a>
      <a href="#" style="display: flex; align-items: center; gap: 14px; padding-left: 18px; color: var(--tg-theme-text-color); text-decoration: none">
        <span aria-hidden="true" style="flex: none; width: 32px; height: 32px; border-radius: 9px; background: #EF5F00; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7.5" width="11.5" height="12.5" rx="2.2"></rect><path d="M8.5 4.5h8.5a2.5 2.5 0 0 1 2.5 2.5v9.5"></path></svg>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 66px; padding: 11px 18px 11px 0; box-sizing: border-box; border-top: 0.5px solid var(--tg-theme-section-separator-color)">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-size: 17px; line-height: 22px">Слова</span>
            <span style="font-size: 15px; line-height: 20px; color: var(--tg-theme-hint-color)">12 к повторению · ~5 мин</span>
          </span>
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none" aria-hidden="true" style="flex: none; color: var(--chev)"><path d="m1.5 1.5 5 5.5-5 5.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </span>
      </a>
      <a href="#" style="display: flex; align-items: center; gap: 14px; padding-left: 18px; color: var(--tg-theme-text-color); text-decoration: none">
        <span aria-hidden="true" style="flex: none; width: 32px; height: 32px; border-radius: 9px; background: #5B6472; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7"></circle><path d="M12 10v3.5l2.5 1.5"></path><path d="M9.5 3.5h5"></path></svg>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 66px; padding: 11px 18px 11px 0; box-sizing: border-box; border-top: 0.5px solid var(--tg-theme-section-separator-color)">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-size: 17px; line-height: 22px">Пробный экзамен</span>
            <span style="font-size: 15px; line-height: 20px; color: var(--tg-theme-hint-color)">1 ч 58 мин или одна секция</span>
          </span>
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none" aria-hidden="true" style="flex: none; color: var(--chev)"><path d="m1.5 1.5 5 5.5-5 5.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </span>
      </a>
    </div>

    <!-- Простые ссылки — без стрелок -->
    <nav aria-label="Другое" style="flex: none; margin-top: 14px; display: flex; justify-content: center; gap: 32px">
      <a href="#" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 15px; line-height: 20px; font-weight: 500; color: var(--brand); text-decoration: none">Своя тренировка</a>
      <a href="#" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 15px; line-height: 20px; font-weight: 500; color: var(--brand); text-decoration: none">Все слабые места</a>
    </nav>

  </main>

  <!-- Нижняя панель Telegram: содержимое уходит под растушёвку; MainButton — наш цвет и текст, форма и шрифт клиента -->
  <div style="position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 28px 16px 24px; background: linear-gradient(to bottom, var(--page-0) 0, var(--tg-theme-secondary-bg-color) 28px)">
    <button type="button" style="display: block; width: 100%; height: 50px; border: 0; border-radius: 12px; background: var(--brand); color: var(--on-brand); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; line-height: 22px; font-weight: 600">Продолжить · вопрос 4 из 10</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
return { themeClass: dark ? 'dark' : '' };
}
}
</script>
</body>
</html>
