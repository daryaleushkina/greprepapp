<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Прогресс — пусто</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
/* Токены «Шагов»: светлая и тёмная тема. В компонентах — только var(--…) */
.s{
--bg:#F5F6F9;--surface:#FFFFFF;--text:#1B1E28;--text-2:#5A6070;--line:rgba(27,30,40,.12);--fill:rgba(27,30,40,.06);
--accent:#1B1E28;--on-accent:#FFFFFF;--wrong:#C2410C;--wrong-tint:rgba(194,65,12,.10);
--verbal:#5B4BC4;--verbal-tint:rgba(91,75,196,.12);--quant:#11735F;--quant-tint:rgba(17,115,95,.12);
--words:#B4446C;--words-tint:rgba(180,68,108,.12);--essay:#9A5B00;--essay-tint:rgba(154,91,0,.12);--exam:#1B1E28;
--glow:rgba(91,75,196,.22);--glow-2:rgba(91,75,196,.07);
--glass:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.54));--glass-strong:linear-gradient(180deg,rgba(255,255,255,.90),rgba(255,255,255,.70));--glass-edge:rgba(0,0,0,.06);--glass-rim:rgba(255,255,255,.6);
--glass-shadow:0 10px 30px -10px rgba(30,30,60,.22);--tab-sel:rgba(27,30,40,.07);--focus:#5B4BC4;
}
.s.dark{
--bg:#0E0F14;--surface:#1A1C23;--text:#F2F3F7;--text-2:#A3A8B5;--line:rgba(255,255,255,.12);--fill:rgba(255,255,255,.08);
--accent:#F2F3F7;--on-accent:#111318;--wrong:#FF8A4C;--wrong-tint:rgba(255,138,76,.14);
--verbal:#A898FF;--verbal-tint:rgba(168,152,255,.16);--quant:#4FC4A7;--quant-tint:rgba(79,196,167,.16);
--words:#F28AB0;--words-tint:rgba(242,138,176,.16);--essay:#F0B45A;--essay-tint:rgba(240,180,90,.16);--exam:#F2F3F7;
--glow:rgba(130,110,255,.30);--glow-2:rgba(130,110,255,.08);
--glass:linear-gradient(180deg,rgba(64,66,80,.62),rgba(32,34,44,.50));--glass-strong:linear-gradient(180deg,rgba(48,50,62,.82),rgba(30,32,42,.72));--glass-edge:rgba(0,0,0,.35);--glass-rim:rgba(255,255,255,.12);
--glass-shadow:0 10px 30px -10px rgba(0,0,0,.6);--tab-sel:rgba(255,255,255,.10);--focus:#A898FF;
}
a{color:var(--text)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
button:active,a:active{transform:scale(0.98)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--verbal-tint)}
@media (prefers-reduced-motion: reduce){button,a{transition:none}button:active,a:active{transform:none}}
@media (prefers-reduced-transparency: reduce){.glass{background:var(--surface)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
</style>
</helmet>
<div class="s {{themeClass}}" style="width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: 'Onest', system-ui, sans-serif; color: var(--text); background: radial-gradient(120% 52% at 50% -10%, var(--glow) 0%, var(--glow-2) 48%, transparent 74%), var(--bg); display: flex; flex-direction: column">
  <!-- Шапку рисует Telegram: стеклянные круги поверх содержимого -->
  <button type="button" class="glass" aria-label="Закрыть" style="position: absolute; z-index: 6; top: 8px; left: 12px; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: flex; align-items: center; justify-content: center">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg>
  </button>
  <button type="button" class="glass" aria-label="Меню" style="position: absolute; z-index: 6; top: 8px; right: 12px; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"></circle><circle cx="12" cy="12" r="1.7" fill="currentColor"></circle><circle cx="18.5" cy="12" r="1.7" fill="currentColor"></circle></svg>
  </button>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 72px 20px 120px; display: flex; flex-direction: column">

    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 600; letter-spacing: -0.025em">Прогресс</h1>
        <p style="margin: 0; font-size: 15px; line-height: 20px; color: var(--text-2); font-variant-numeric: tabular-nums">Тренировок ещё не было</p>
      </div>
      <a href="G2-Settings.dc.html" class="glass" aria-label="Настройки" style="flex: none; margin-top: -3px; width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></a>
    </div>

    <!-- Пустое состояние учит: что здесь появится и как начать -->
    <ol aria-label="Как здесь всё появится" style="list-style: none; margin: 32px 0 0; padding: 0; display: flex; flex-direction: column; gap: 20px">
      <li style="position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr); column-gap: 14px; align-items: start">
        <span aria-hidden="true" style="position: absolute; left: 17.25px; top: 52px; bottom: -20px; width: 1.5px; background-image: linear-gradient(var(--line) 55%, transparent 55%); background-size: 1.5px 7px"></span>
        <span aria-hidden="true" style="position: relative; margin-top: 16px; width: 36px; height: 36px; border-radius: 50%; background: var(--verbal); color: var(--surface); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 5px var(--verbal-tint)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6.5l-4.5 3.5v-3.5a2 2 0 0 1-2-2z"></path><path d="M8.5 9h7"></path><path d="M8.5 12.5h4.5"></path></svg>
        </span>
        <section class="glass" aria-label="Первая тренировка" style="border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 4px; background: var(--glass-strong); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow)">
          <h2 style="margin: 0; font-size: 19px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em">Первая тренировка</h2>
          <p style="margin: 0; font-size: 15px; line-height: 20px; color: var(--text-2)"><span lang="en" style="color: var(--verbal); font-weight: 500">Verbal</span> · 10 вопросов · ~12 мин</p>
          <a href="T2-TodayFirst.dc.html" style="margin-top: 16px; height: 48px; border-radius: 24px; background: var(--accent); color: var(--on-accent); text-decoration: none; font-size: 16px; line-height: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center">Начать</a>
        </section>
      </li>
      <li style="position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr); column-gap: 14px; align-items: start">
        <span aria-hidden="true" style="position: absolute; left: 17.25px; top: 30px; bottom: -20px; width: 1.5px; background-image: linear-gradient(var(--line) 55%, transparent 55%); background-size: 1.5px 7px"></span>
        <span aria-hidden="true" style="position: relative; justify-self: center; margin-top: 1px; width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 1.5px dashed var(--line); background: var(--bg)"></span>
        <span style="padding-top: 3px; font-size: 16px; line-height: 22px; color: var(--text-2)">Здесь появятся темы, где больше всего ошибок, — по порядку, с чего начать</span>
      </li>
      <li style="position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr); column-gap: 14px; align-items: start">
        
        <span aria-hidden="true" style="position: relative; justify-self: center; margin-top: 1px; width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 1.5px dashed var(--line); background: var(--bg)"></span>
        <span style="padding-top: 3px; font-size: 16px; line-height: 22px; color: var(--text-2)">И тренировка по каждой — в одно нажатие</span>
      </li>
    </ol>
  </main>

  <!-- Край прокрутки: содержимое мягко уходит под капсулу вкладок -->
  <span aria-hidden="true" style="position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(transparent, var(--bg) 78%); pointer-events: none"></span>

  <!-- Плавающая стеклянная капсула вкладок; внутри тренировки, слов и экзамена её нет -->
  <nav aria-label="Разделы" class="glass" style="position: absolute; z-index: 5; left: 50%; bottom: 22px; transform: translateX(-50%); width: 340px; height: 64px; box-sizing: border-box; padding: 4px; border-radius: 32px; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="T1-Today.dc.html" style="border-radius: 28px; color: var(--text-2); text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2"></circle><circle cx="6" cy="18" r="2"></circle><path d="M6 8v8"></path><path d="M11 6h8"></path><path d="M11 18h8"></path><path d="M11 12h5"></path></svg>
      <span style="font-size: 11px; line-height: 13px; font-weight: 500">Сегодня</span>
    </a>
    <a href="W1-Words.dc.html" style="border-radius: 28px; color: var(--text-2); text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="7.5" width="12" height="13" rx="2.5"></rect><path d="M8.5 4.5h9a2.5 2.5 0 0 1 2.5 2.5v10"></path></svg>
      <span style="font-size: 11px; line-height: 13px; font-weight: 500">Слова</span>
    </a>
    <a href="X1-Exam.dc.html" style="border-radius: 28px; color: var(--text-2); text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7.5"></circle><path d="M12 9.5V13l2.5 1.5"></path><path d="M9.5 3h5"></path></svg>
      <span style="font-size: 11px; line-height: 13px; font-weight: 500">Экзамен</span>
    </a>
    <a href="G1-Progress.dc.html" aria-current="page" style="border-radius: 28px; background: var(--tab-sel); color: var(--text); text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5h16"></path><path d="M7 16v-5"></path><path d="M12 16V7"></path><path d="M17 16v-3"></path></svg>
      <span style="font-size: 11px; line-height: 13px; font-weight: 600">Прогресс</span>
    </a>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
return { themeClass: dark ? 'dark' : '' };
}
}
</script>
</body>
</html>
