<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Г · Telegram — Конструктор</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.tg{--tg-theme-bg-color:#FFFFFF;--tg-theme-secondary-bg-color:#F2F2F7;--tg-theme-section-bg-color:#FFFFFF;--tg-theme-text-color:#000000;--tg-theme-hint-color:#616166;--tg-theme-link-color:#2481CC;--tg-theme-section-separator-color:rgba(60,60,67,0.16);--tg-theme-section-header-text-color:#616166;--tg-theme-destructive-text-color:#D93A2F;--brand:#6E56CF;--on-brand:#FFFFFF;--brand-soft:rgba(110,86,207,0.10);--wrong:#C2410C;--fill:rgba(118,118,128,0.10);--track:rgba(118,118,128,0.18);--chev:#BDBDC2;--glow:rgba(110,86,207,0.16);--glow-2:rgba(110,86,207,0.05);--page-0:rgba(242,242,247,0);--glass-bg:rgba(255,255,255,0.62);--glass-edge:rgba(0,0,0,0.06);--glass-rim:rgba(255,255,255,0.55);--glass-shadow:0 8px 24px rgba(0,0,0,0.08);--glass-on:#FFFFFF;color-scheme:light}
.tg.dark{--tg-theme-bg-color:#000000;--tg-theme-secondary-bg-color:#000000;--tg-theme-section-bg-color:#1C1C1E;--tg-theme-text-color:#FFFFFF;--tg-theme-hint-color:#98989F;--tg-theme-link-color:#3E88F7;--tg-theme-section-separator-color:rgba(84,84,88,0.55);--tg-theme-section-header-text-color:#8D8D93;--tg-theme-destructive-text-color:#FF6961;--brand:#9E8CFC;--on-brand:#14121F;--brand-soft:rgba(158,140,252,0.16);--wrong:#FF8A4C;--fill:rgba(118,118,128,0.24);--track:rgba(118,118,128,0.32);--chev:#5A5A5F;--glow:rgba(158,140,252,0.16);--glow-2:rgba(158,140,252,0.05);--page-0:rgba(0,0,0,0);--glass-bg:rgba(28,28,30,0.55);--glass-edge:rgba(0,0,0,0.35);--glass-rim:rgba(255,255,255,0.12);--glass-shadow:0 8px 24px rgba(0,0,0,0.40);--glass-on:rgba(255,255,255,0.18);color-scheme:dark}
@media (prefers-reduced-transparency: reduce){.glass{background:var(--tg-theme-section-bg-color)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
a{color:#6E56CF}a:hover{color:#5A44B8}
button,input{font:inherit}
button{cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
button:active,a:active{transform:scale(0.97)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::selection{background:rgba(110,86,207,.22)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]:focus{outline:2px solid var(--brand);outline-offset:0}
@media (prefers-reduced-motion: reduce){button,a{transition:none}button:active,a:active{transform:none}}
</style>
</helmet>
<div class="tg {{themeClass}}" style="width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: var(--tg-theme-text-color); background: radial-gradient(140% 52% at 50% -14%, var(--glow) 0%, var(--glow-2) 48%, transparent 76%), var(--tg-theme-secondary-bg-color); -webkit-font-smoothing: antialiased">

  <header style="position: absolute; z-index: 3; top: 8px; left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none">
    <button type="button" aria-label="Назад" class="glass" style="pointer-events: auto; width: 44px; height: 44px; padding: 0; border-radius: 50%; color: var(--tg-theme-text-color); display: flex; align-items: center; justify-content: center; background: var(--glass-bg); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"></path></svg>
    </button>
    <button type="button" aria-label="Меню" class="glass" style="pointer-events: auto; width: 44px; height: 44px; padding: 0; border-radius: 50%; color: var(--tg-theme-text-color); display: flex; align-items: center; justify-content: center; background: var(--glass-bg); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="18.5" cy="12" r="1.8"></circle></svg>
    </button>
  </header>

  <main style="height: 844px; box-sizing: border-box; overflow: hidden; padding: 62px 16px 110px; display: flex; flex-direction: column">

    <h1 style="flex: none; margin: 0 4px; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.01em">Новая тренировка</h1>

    <!-- Сначала готовые наборы: один уже выбран, можно сразу жать «Начать» -->
    <h2 id="d2-presets" style="flex: none; margin: 22px 20px 8px; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--tg-theme-section-header-text-color)">Готовые наборы</h2>
    <div role="radiogroup" aria-labelledby="d2-presets" style="flex: none; background: var(--tg-theme-section-bg-color); border-radius: 26px; overflow: hidden; padding-left: 18px">
      <button type="button" role="radio" aria-checked="true" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; margin: 0; padding: 8px 18px 8px 0; border: 0; background: transparent; color: var(--tg-theme-text-color); text-align: left">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <span style="font-size: 17px; line-height: 22px">Как в прошлый раз</span>
          <span style="font-size: 15px; line-height: 20px; color: var(--tg-theme-hint-color)"><span lang="en">Verbal · Text Completion</span> · 10 · Практика</span>
        </span>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true" style="flex: none; color: var(--brand)"><path d="m3.5 10.5 4.25 4.25L16.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
      <button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; margin: 0; padding: 8px 18px 8px 0; border: 0; border-top: 0.5px solid var(--tg-theme-section-separator-color); background: transparent; color: var(--tg-theme-text-color); text-align: left">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <span style="font-size: 17px; line-height: 22px">Мои ошибки</span>
          <span style="font-size: 15px; line-height: 20px; color: var(--tg-theme-hint-color)">23 задания</span>
        </span>
      </button>
      <button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; margin: 0; padding: 8px 18px 8px 0; border: 0; border-top: 0.5px solid var(--tg-theme-section-separator-color); background: transparent; color: var(--tg-theme-text-color); text-align: left">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <span style="font-size: 17px; line-height: 22px">Слабая тема: проценты и доли</span>
          <span style="font-size: 15px; line-height: 20px; color: var(--tg-theme-hint-color)"><span lang="en">Quant</span> · 8 вопросов</span>
        </span>
      </button>
      <button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; margin: 0; padding: 8px 18px 8px 0; border: 0; border-top: 0.5px solid var(--tg-theme-section-separator-color); background: transparent; color: var(--tg-theme-text-color); text-align: left">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <span style="font-size: 17px; line-height: 22px">Проверка на время</span>
          <span style="font-size: 15px; line-height: 20px; color: var(--tg-theme-hint-color)"><span lang="en">Verbal</span> · 12 вопросов · 18 мин, как секция</span>
        </span>
      </button>
    </div>

    <!-- Своя сборка: раздел, число, режим на виду; тип и тема — строками глубже -->
    <h2 style="flex: none; margin: 26px 20px 8px; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--tg-theme-section-header-text-color)">Или собрать свою</h2>
    <div style="flex: none; background: var(--tg-theme-section-bg-color); border-radius: 26px; overflow: hidden; padding-left: 18px">

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding-right: 12px">
        <span id="d2-sec" style="font-size: 17px; line-height: 22px">Раздел</span>
        <!-- Переключатель — стеклянная капсула, выбранное — плотный «бегунок» -->
        <div role="group" aria-labelledby="d2-sec" class="glass" style="flex: none; width: 214px; height: 36px; box-sizing: border-box; padding: 3px; border-radius: 18px; display: flex; align-items: center; background: var(--glass-bg); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim)">
          <button type="button" aria-pressed="true" style="flex: 1; height: 44px; margin: -4px 0; padding: 7px 0; border: 0; background: transparent; display: flex">
            <span lang="en" style="flex: 1; height: 30px; border-radius: 15px; background: var(--glass-on); box-shadow: 0 2px 6px rgba(0,0,0,0.10); display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--tg-theme-text-color)">Verbal</span>
          </button>
          <button type="button" aria-pressed="false" style="flex: 1; height: 44px; margin: -4px 0; padding: 7px 0; border: 0; background: transparent; display: flex">
            <span lang="en" style="flex: 1; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 20px; color: var(--tg-theme-text-color)">Quant</span>
          </button>
          <button type="button" aria-pressed="false" style="flex: 1; height: 44px; margin: -4px 0; padding: 7px 0; border: 0; background: transparent; display: flex">
            <span style="flex: 1; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 20px; color: var(--tg-theme-text-color)">Эссе</span>
          </button>
        </div>
      </div>

      <a href="#" style="display: flex; align-items: center; gap: 8px; min-height: 52px; padding-right: 18px; border-top: 0.5px solid var(--tg-theme-section-separator-color); color: var(--tg-theme-text-color); text-decoration: none">
        <span style="flex: 1; font-size: 17px; line-height: 22px">Тип задания</span>
        <span lang="en" style="font-size: 17px; line-height: 22px; color: var(--tg-theme-hint-color)">Text Completion</span>
        <svg width="8" height="14" viewBox="0 0 8 14" fill="none" aria-hidden="true" style="flex: none; color: var(--chev)"><path d="m1.5 1.5 5 5.5-5 5.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </a>

      <!-- Любое число, без готовых 5/10/20 -->
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding-right: 12px; border-top: 0.5px solid var(--tg-theme-section-separator-color)">
        <label for="d2-count" style="font-size: 17px; line-height: 22px">Вопросов</label>
        <input id="d2-count" type="number" inputmode="numeric" min="1" max="200" value="10" style="flex: none; width: 76px; height: 36px; box-sizing: border-box; margin: 0; padding: 0 8px; border: 0; border-radius: 18px; background: var(--fill); color: var(--tg-theme-text-color); text-align: center; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; font-size: 17px; line-height: 22px; font-weight: 600; font-variant-numeric: tabular-nums">
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 68px; padding: 8px 12px 8px 0; box-sizing: border-box; border-top: 0.5px solid var(--tg-theme-section-separator-color)">
        <div style="display: flex; flex-direction: column">
          <span id="d2-mode" style="font-size: 17px; line-height: 22px">Режим</span>
          <span style="font-size: 13px; line-height: 18px; color: var(--tg-theme-hint-color)">разбор после каждого вопроса</span>
        </div>
        <div role="group" aria-labelledby="d2-mode" class="glass" style="flex: none; width: 190px; height: 36px; box-sizing: border-box; padding: 3px; border-radius: 18px; display: flex; align-items: center; background: var(--glass-bg); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim)">
          <button type="button" aria-pressed="true" style="flex: 1; height: 44px; margin: -4px 0; padding: 7px 0; border: 0; background: transparent; display: flex">
            <span style="flex: 1; height: 30px; border-radius: 15px; background: var(--glass-on); box-shadow: 0 2px 6px rgba(0,0,0,0.10); display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--tg-theme-text-color)">Практика</span>
          </button>
          <button type="button" aria-pressed="false" style="flex: 1; height: 44px; margin: -4px 0; padding: 7px 0; border: 0; background: transparent; display: flex">
            <span style="flex: 1; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 20px; color: var(--tg-theme-text-color)">Проверка</span>
          </button>
        </div>
      </div>

      <a href="#" style="display: flex; align-items: center; gap: 8px; min-height: 52px; padding-right: 18px; border-top: 0.5px solid var(--tg-theme-section-separator-color); color: var(--tg-theme-text-color); text-decoration: none">
        <span style="flex: 1; font-size: 17px; line-height: 22px">Тема и сложность</span>
        <span style="font-size: 17px; line-height: 22px; color: var(--tg-theme-hint-color)">все</span>
        <svg width="8" height="14" viewBox="0 0 8 14" fill="none" aria-hidden="true" style="flex: none; color: var(--chev)"><path d="m1.5 1.5 5 5.5-5 5.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </a>
    </div>

  </main>

  <div style="position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 28px 16px 24px; background: linear-gradient(to bottom, var(--page-0) 0, var(--tg-theme-secondary-bg-color) 28px)">
    <button type="button" style="display: block; width: 100%; height: 50px; border: 0; border-radius: 12px; background: var(--brand); color: var(--on-brand); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; line-height: 22px; font-weight: 600">Начать · 10 вопросов · ~12 мин</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
return { themeClass: dark ? 'dark' : '' };
}
}
</script>
</body>
</html>
