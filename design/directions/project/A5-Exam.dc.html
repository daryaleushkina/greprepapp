<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Маршрут — Пробный экзамен</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#121417}a:hover{color:#4A4F57}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform 140ms cubic-bezier(0.23,1,0.32,1)}
button:active{transform:scale(0.97)}
:focus-visible{outline:2px solid #121417;outline-offset:2px}
.on-dark:focus-visible{outline-color:#FFFFFF}
::selection{background:#121417;color:#FFFFFF}
@media (prefers-reduced-motion: reduce){button{transition:none}button:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: 'Onest', sans-serif; color: #121417; background: #FFFFFF; display: flex; flex-direction: column">

  <header style="flex: none; height: 52px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 6px 0 4px; background: #FFFFFF">
    <div style="display: flex; justify-content: flex-start">
      <button type="button" style="height: 44px; padding: 0 12px 0 4px; border: 0; background: transparent; color: #121417; font-size: 17px; font-weight: 500; display: flex; align-items: center; gap: 2px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" stroke="#121417" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        Назад
      </button>
    </div>
    <div style="font-size: 17px; line-height: 22px; font-weight: 600; letter-spacing: -0.01em">Маршрут</div>
    <div style="display: flex; justify-content: flex-end">
      <button type="button" aria-label="Меню" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: #F3F4F6; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="4" viewBox="0 0 16 4" aria-hidden="true"><circle cx="2" cy="2" r="1.75" fill="#121417"></circle><circle cx="8" cy="2" r="1.75" fill="#121417"></circle><circle cx="14" cy="2" r="1.75" fill="#121417"></circle></svg>
        </span>
      </button>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column">

    <!-- Полоса экзамена — как табличка станции: чёрная, во всю ширину; управление — по-английски, как на настоящем GRE -->
    <div lang="en" style="flex: none; padding: 12px 16px; background: #121417; color: #FFFFFF; display: grid; grid-template-columns: 1fr auto; column-gap: 12px; row-gap: 4px; align-items: center">
      <div style="min-width: 0; font-size: 17px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em">Quantitative Reasoning</div>
      <div role="timer" aria-label="Time remaining 14:32" style="justify-self: end; font-size: 22px; line-height: 28px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em">14:32</div>
      <div style="min-width: 0; font-size: 14px; line-height: 18px; font-weight: 500; color: #C9CDD3; font-variant-numeric: tabular-nums">Section 1 of 2 · Question 7 of 12</div>
      <button type="button" class="on-dark" style="justify-self: end; height: 44px; margin: -8px 0; padding: 0 0 0 8px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center">
        <span style="height: 28px; padding: 0 10px; box-sizing: border-box; border: 1.5px solid #FFFFFF; border-radius: 8px; display: flex; align-items: center; font-size: 13px; font-weight: 600">Hide Time</span>
      </button>
    </div>

    <!-- Линия секций AW, V1, V2, Q1, Q2; пересадки — два кружка с перемычкой -->
    <div role="img" aria-label="Секции: AW, Verbal 1 и Verbal 2 пройдены; сейчас Quant 1; дальше Quant 2" style="flex: none; position: relative; height: 42px; margin: 12px 16px 0">
      <span style="position: absolute; left: 35px; top: 8px; width: 144px; height: 6px; background: #0A6CB4"></span>
      <span style="position: absolute; left: 203px; top: 8px; width: 144px; height: 6px; background: #0E7C3E"></span>
      <span style="position: absolute; left: 11px; top: 6px; width: 24px; height: 10px; box-sizing: border-box; background: #FFFFFF; border-top: 3px solid #121417; border-bottom: 3px solid #121417"></span>
      <span style="position: absolute; left: 179px; top: 6px; width: 24px; height: 10px; box-sizing: border-box; background: #FFFFFF; border-top: 3px solid #121417; border-bottom: 3px solid #121417"></span>
      <span style="position: absolute; left: 4px; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: #7B3A97; box-shadow: 0 0 0 2px #FFFFFF"></span>
      <span style="position: absolute; left: 28px; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: #0A6CB4; box-shadow: 0 0 0 2px #FFFFFF"></span>
      <span style="position: absolute; left: 172px; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: #0A6CB4; box-shadow: 0 0 0 2px #FFFFFF"></span>
      <span style="position: absolute; left: 192px; top: 0; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 5px solid #0E7C3E; box-shadow: 0 0 0 2px #FFFFFF; display: flex; align-items: center; justify-content: center"><span style="width: 6px; height: 6px; border-radius: 50%; background: #0E7C3E"></span></span>
      <span style="position: absolute; left: 338px; top: 2px; width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 4px solid #121417"></span>
      <span style="position: absolute; left: 11px; top: 26px; transform: translateX(-50%); font-size: 13px; line-height: 16px; font-weight: 500; color: #4A4F57; white-space: nowrap">AW</span>
      <span style="position: absolute; left: 35px; top: 26px; transform: translateX(-50%); font-size: 13px; line-height: 16px; font-weight: 500; color: #4A4F57; white-space: nowrap">V1</span>
      <span style="position: absolute; left: 179px; top: 26px; transform: translateX(-50%); font-size: 13px; line-height: 16px; font-weight: 500; color: #4A4F57; white-space: nowrap">V2</span>
      <span style="position: absolute; left: 203px; top: 26px; transform: translateX(-50%); font-size: 13px; line-height: 16px; font-weight: 700; color: #121417; white-space: nowrap">Q1</span>
      <span style="position: absolute; left: 347px; top: 26px; transform: translateX(-50%); font-size: 13px; line-height: 16px; font-weight: 500; color: #4A4F57; white-space: nowrap">Q2</span>
    </div>

    <div lang="en" style="flex: none; margin: 12px 16px 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px">
      <button type="button" aria-pressed="false" style="height: 44px; padding: 0 6px; border: 1.5px solid #C5C9CF; border-radius: 10px; background: #FFFFFF; color: #121417; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5.5 3h9v14l-4.5-3.25L5.5 17z" stroke="#121417" stroke-width="2" stroke-linejoin="round"></path></svg>
        Mark
      </button>
      <button type="button" style="height: 44px; padding: 0 6px; border: 1.5px solid #C5C9CF; border-radius: 10px; background: #FFFFFF; color: #121417; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M8 5h9M8 10h9M8 15h9M3.5 5h.01M3.5 10h.01M3.5 15h.01" stroke="#121417" stroke-width="2" stroke-linecap="round"></path></svg>
        Review
      </button>
      <button type="button" style="height: 44px; padding: 0 6px; border: 1.5px solid #C5C9CF; border-radius: 10px; background: #FFFFFF; color: #121417; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3.5" y="2" width="13" height="16" rx="2" stroke="#121417" stroke-width="2"></rect><path d="M7 6h6M7 10.5h.01M10 10.5h.01M13 10.5h.01M7 14h.01M10 14h.01M13 14h.01" stroke="#121417" stroke-width="2" stroke-linecap="round"></path></svg>
        Calculator
      </button>
    </div>

    <section lang="en" aria-label="Question 7" style="flex: none; margin: 0 16px; display: flex; flex-direction: column">
      <p style="margin: 20px 0 0; font-size: 16px; line-height: 22px">Compare Quantity A and Quantity B.</p>
      <p style="margin: 14px 0 0; text-align: center; font-size: 20px; line-height: 26px; font-variant-numeric: tabular-nums"><i>x</i> &gt; 0</p>
      <div style="margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
        <div style="padding: 10px 12px 14px; border: 1px solid #C5C9CF; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px">
          <div style="font-size: 14px; line-height: 18px; font-weight: 600; color: #4A4F57">Quantity A</div>
          <div style="font-size: 24px; line-height: 30px">(<i>x</i> + 1)<sup style="font-size: 15px; line-height: 0">2</sup></div>
        </div>
        <div style="padding: 10px 12px 14px; border: 1px solid #C5C9CF; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px">
          <div style="font-size: 14px; line-height: 18px; font-weight: 600; color: #4A4F57">Quantity B</div>
          <div style="font-size: 24px; line-height: 30px"><i>x</i><sup style="font-size: 15px; line-height: 0">2</sup> + 1</div>
        </div>
      </div>

      <div role="radiogroup" aria-label="Answer choices" style="margin-top: 18px; display: flex; flex-direction: column; gap: 6px">
        <button type="button" role="radio" aria-checked="true" style="min-height: 50px; padding: 12px 14px 12px 12px; border: 2px solid #121417; border-radius: 10px; background: #FFFFFF; color: #121417; text-align: left; font-size: 16px; line-height: 22px; font-weight: 500; display: flex; align-items: center; gap: 12px">
          <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #121417; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 50%; background: #121417"></span></span>
          Quantity A is greater.
        </button>
        <button type="button" role="radio" aria-checked="false" style="min-height: 50px; padding: 13px 15px 13px 13px; border: 1px solid #C5C9CF; border-radius: 10px; background: #FFFFFF; color: #121417; text-align: left; font-size: 16px; line-height: 22px; display: flex; align-items: center; gap: 12px">
          <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #4A4F57"></span>
          Quantity B is greater.
        </button>
        <button type="button" role="radio" aria-checked="false" style="min-height: 50px; padding: 13px 15px 13px 13px; border: 1px solid #C5C9CF; border-radius: 10px; background: #FFFFFF; color: #121417; text-align: left; font-size: 16px; line-height: 22px; display: flex; align-items: center; gap: 12px">
          <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #4A4F57"></span>
          The two quantities are equal.
        </button>
        <button type="button" role="radio" aria-checked="false" style="min-height: 50px; padding: 13px 15px 13px 13px; border: 1px solid #C5C9CF; border-radius: 10px; background: #FFFFFF; color: #121417; text-align: left; font-size: 16px; line-height: 22px; display: flex; align-items: center; gap: 12px">
          <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #4A4F57"></span>
          The relationship cannot be determined from the information given.
        </button>
      </div>
    </section>

  </main>

  <div lang="en" style="flex: none; padding: 12px 16px 20px; border-top: 1px solid #E2E4E8; background: #FFFFFF; display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
    <button type="button" style="height: 50px; padding: 0 12px; border: 1.5px solid #121417; border-radius: 10px; background: #FFFFFF; color: #121417; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19.5 12H5M11 6l-6 6 6 6" stroke="#121417" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      Back
    </button>
    <button type="button" style="height: 50px; padding: 0 12px; border: 0; border-radius: 10px; background: #121417; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      Next
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 12h14.5M13 6l6 6-6 6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
  </div>

</div>
</x-dc>

</body>
</html>
