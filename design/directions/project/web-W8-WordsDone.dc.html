<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Слова — итог — компьютер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
/* Токены «Шагов»: светлая и тёмная тема. В компонентах — только var(--…) */
.s{
--bg:#F5F6F9;--surface:#FFFFFF;--text:#1B1E28;--text-2:#5A6070;--line:rgba(27,30,40,.12);--fill:rgba(27,30,40,.06);
--accent:#1B1E28;--on-accent:#FFFFFF;--wrong:#C2410C;--wrong-tint:rgba(194,65,12,.10);
--verbal:#5B4BC4;--verbal-tint:rgba(91,75,196,.12);--quant:#11735F;--quant-tint:rgba(17,115,95,.12);
--words:#B4446C;--words-tint:rgba(180,68,108,.12);--essay:#9A5B00;--essay-tint:rgba(154,91,0,.12);--exam:#1B1E28;
--glow:rgba(91,75,196,.22);--glow-2:rgba(91,75,196,.07);
--glass:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.54));--glass-strong:linear-gradient(180deg,rgba(255,255,255,.90),rgba(255,255,255,.70));--glass-edge:rgba(0,0,0,.06);--glass-rim:rgba(255,255,255,.6);
--glass-shadow:0 10px 30px -10px rgba(30,30,60,.22);--tab-sel:rgba(27,30,40,.07);--focus:#5B4BC4;
}
.s.dark{
--bg:#0E0F14;--surface:#1A1C23;--text:#F2F3F7;--text-2:#A3A8B5;--line:rgba(255,255,255,.12);--fill:rgba(255,255,255,.08);
--accent:#F2F3F7;--on-accent:#111318;--wrong:#FF8A4C;--wrong-tint:rgba(255,138,76,.14);
--verbal:#A898FF;--verbal-tint:rgba(168,152,255,.16);--quant:#4FC4A7;--quant-tint:rgba(79,196,167,.16);
--words:#F28AB0;--words-tint:rgba(242,138,176,.16);--essay:#F0B45A;--essay-tint:rgba(240,180,90,.16);--exam:#F2F3F7;
--glow:rgba(130,110,255,.30);--glow-2:rgba(130,110,255,.08);
--glass:linear-gradient(180deg,rgba(64,66,80,.62),rgba(32,34,44,.50));--glass-strong:linear-gradient(180deg,rgba(48,50,62,.82),rgba(30,32,42,.72));--glass-edge:rgba(0,0,0,.35);--glass-rim:rgba(255,255,255,.12);
--glass-shadow:0 10px 30px -10px rgba(0,0,0,.6);--tab-sel:rgba(255,255,255,.10);--focus:#A898FF;
}
a{color:var(--text)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
button:active,a:active{transform:scale(0.98)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--verbal-tint)}
@media (prefers-reduced-motion: reduce){button,a{transition:none}button:active,a:active{transform:none}}
@media (prefers-reduced-transparency: reduce){.glass{background:var(--surface)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:12px;line-height:1;font-weight:500;color:var(--text-2);font-variant-numeric:tabular-nums}
@media (hover:hover) and (pointer:fine){.nav-item:hover{background:var(--fill)}.row-link:hover{background:var(--fill)}}
</style>
</helmet>
<!-- Сессия слов на широком экране: режим фокуса, свет сверху — цвет слов -->
<div class="s {{themeClass}}" style="--glow: rgba(180,68,108,.20); --glow-2: rgba(180,68,108,.06); min-height: 100vh; box-sizing: border-box; font-family: 'Onest', system-ui, sans-serif; color: var(--text); background: radial-gradient(70% 55% at 50% -15%, var(--glow) 0%, var(--glow-2) 50%, transparent 78%), var(--bg); display: flex; flex-direction: column">

  <!-- Режим фокуса: тонкая полоса сверху, без боковой панели -->
  <header style="flex: none; height: 64px; box-sizing: border-box; padding: 10px clamp(12px, 3vw, 24px); display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; column-gap: 12px">
    <a href="web-W1-Words.dc.html" class="glass" aria-label="Закрыть слова" style="justify-self: start; width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg></a>
    <div role="img" aria-label="Слова: 12 из 12" style="display: flex; align-items: center; gap: 12px">
      <span aria-hidden="true" style="display: flex; align-items: center; gap: 5px">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--words)"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--words)"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--words)"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--words)"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--words)"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--words)"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--words)"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--words)"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--words)"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--words)"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--words)"></span>
          <span style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; border: 2.5px solid var(--words)"></span>
      </span>
      <span aria-hidden="true" style="font-size: 14px; line-height: 18px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap">12 из 12</span>
    </div>
    <div style="justify-self: end; min-width: 0; max-width: 100%; display: flex; justify-content: flex-end"></div>
  </header>

  <main style="flex: 1; box-sizing: border-box; padding: 40px clamp(16px, 4vw, 48px) 64px; display: flex; justify-content: center">
    <div style="width: 100%; max-width: 560px; display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 56px; line-height: 62px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">12 из 12</h1>
      <p style="margin: 6px 0 0; font-size: 17px; line-height: 24px; color: var(--text-2)">10 сразу верно</p>
      <span role="img" aria-label="12 слов пройдено, 2 вернутся ещё раз" style="margin-top: 20px; display: flex; align-items: center; gap: 8px">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--words)"></span>
          <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--words)"></span>
          <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--words)"></span>
          <span style="width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--words)"></span>
          <span style="width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--words)"></span>
          <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--words)"></span>
          <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--words)"></span>
          <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--words)"></span>
          <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--words)"></span>
          <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--words)"></span>
          <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--words)"></span>
          <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--words)"></span>
      </span>

      <section class="glass" aria-label="Вернутся сегодня ещё раз" style="margin-top: 32px; border-radius: 28px; padding: 22px 24px; background: var(--glass-strong); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: flex; flex-direction: column; gap: 14px">
        <h2 style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 500; color: var(--text-2)">Вернутся сегодня ещё раз</h2>
        <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
          <li style="display: grid; grid-template-columns: minmax(0, 160px) minmax(0, 1fr); column-gap: 20px; align-items: baseline"><span lang="en" style="font-size: 18px; line-height: 24px; font-weight: 500">ephemeral</span><span style="font-size: 16px; line-height: 22px; color: var(--text-2)">недолговечный, мимолётный</span></li>
          <li style="display: grid; grid-template-columns: minmax(0, 160px) minmax(0, 1fr); column-gap: 20px; align-items: baseline"><span lang="en" style="font-size: 18px; line-height: 24px; font-weight: 500">obdurate</span><span style="font-size: 16px; line-height: 22px; color: var(--text-2)">упрямый, непреклонный</span></li>
        </ul>
      </section>

      <div style="margin-top: 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
        <p style="margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 13px; line-height: 18px; color: var(--text-2)"><span class="kbd">Enter</span> готово</p>
        <a href="web-W1-Words.dc.html" style="margin-left: auto; height: 48px; padding: 0 28px; border-radius: 24px; background: var(--accent); color: var(--on-accent); text-decoration: none; font-size: 16px; line-height: 20px; font-weight: 600; display: flex; align-items: center; white-space: nowrap; font-variant-numeric: tabular-nums">Готово</a>
      </div>
    </div>
  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
return { themeClass: dark ? 'dark' : '' };
}
}
</script>
</body>
</html>
