<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Итог тренировки — компьютер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
/* Токены «Шагов»: светлая и тёмная тема. В компонентах — только var(--…) */
.s{
--bg:#F5F6F9;--surface:#FFFFFF;--text:#1B1E28;--text-2:#5A6070;--line:rgba(27,30,40,.12);--fill:rgba(27,30,40,.06);
--accent:#1B1E28;--on-accent:#FFFFFF;--wrong:#C2410C;--wrong-tint:rgba(194,65,12,.10);
--verbal:#5B4BC4;--verbal-tint:rgba(91,75,196,.12);--quant:#11735F;--quant-tint:rgba(17,115,95,.12);
--words:#B4446C;--words-tint:rgba(180,68,108,.12);--essay:#9A5B00;--essay-tint:rgba(154,91,0,.12);--exam:#1B1E28;
--glow:rgba(91,75,196,.22);--glow-2:rgba(91,75,196,.07);
--glass:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.54));--glass-strong:linear-gradient(180deg,rgba(255,255,255,.90),rgba(255,255,255,.70));--glass-edge:rgba(0,0,0,.06);--glass-rim:rgba(255,255,255,.6);
--glass-shadow:0 10px 30px -10px rgba(30,30,60,.22);--tab-sel:rgba(27,30,40,.07);--focus:#5B4BC4;
}
.s.dark{
--bg:#0E0F14;--surface:#1A1C23;--text:#F2F3F7;--text-2:#A3A8B5;--line:rgba(255,255,255,.12);--fill:rgba(255,255,255,.08);
--accent:#F2F3F7;--on-accent:#111318;--wrong:#FF8A4C;--wrong-tint:rgba(255,138,76,.14);
--verbal:#A898FF;--verbal-tint:rgba(168,152,255,.16);--quant:#4FC4A7;--quant-tint:rgba(79,196,167,.16);
--words:#F28AB0;--words-tint:rgba(242,138,176,.16);--essay:#F0B45A;--essay-tint:rgba(240,180,90,.16);--exam:#F2F3F7;
--glow:rgba(130,110,255,.30);--glow-2:rgba(130,110,255,.08);
--glass:linear-gradient(180deg,rgba(64,66,80,.62),rgba(32,34,44,.50));--glass-strong:linear-gradient(180deg,rgba(48,50,62,.82),rgba(30,32,42,.72));--glass-edge:rgba(0,0,0,.35);--glass-rim:rgba(255,255,255,.12);
--glass-shadow:0 10px 30px -10px rgba(0,0,0,.6);--tab-sel:rgba(255,255,255,.10);--focus:#A898FF;
}
a{color:var(--text)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
button:active,a:active{transform:scale(0.98)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--verbal-tint)}
@media (prefers-reduced-motion: reduce){button,a{transition:none}button:active,a:active{transform:none}}
@media (prefers-reduced-transparency: reduce){.glass{background:var(--surface)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:12px;line-height:1;font-weight:500;color:var(--text-2);font-variant-numeric:tabular-nums}
@media (hover:hover) and (pointer:fine){.nav-item:hover{background:var(--fill)}.row-link:hover{background:var(--fill)}}
</style>
</helmet>
<!-- Итог тренировки Verbal · Text Completion: 7 из 10, 3 ошибки — что повторить -->
<div class="s {{themeClass}}" style="min-height: 100vh; box-sizing: border-box; position: relative; font-family: 'Onest', system-ui, sans-serif; color: var(--text); background: radial-gradient(70% 55% at 50% -15%, var(--glow) 0%, var(--glow-2) 50%, transparent 78%), var(--bg); display: flex; flex-direction: column">
  <!-- Режим фокуса: тонкая полоса вместо боковой панели -->
  <header style="flex: none; height: 64px; box-sizing: border-box; padding: 0 clamp(12px, 3vw, 32px); display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <a href="web-T1-Today.dc.html" class="glass" aria-label="Закрыть" style="flex: none; width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); color: var(--text); text-decoration: none; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg></a>
    <span></span>
    <span aria-hidden="true" style="flex: none; width: 44px"></span>
  </header>
  <main style="flex: 1; box-sizing: border-box; padding: 32px clamp(16px, 4vw, 48px) 56px; display: flex; justify-content: center">
    <div style="width: 100%; max-width: 680px; display: flex; flex-direction: column">
      <h1 style="margin: 0; display: flex; align-items: baseline; gap: 12px"><span style="font-size: 72px; line-height: 76px; font-weight: 600; letter-spacing: -0.04em; font-variant-numeric: tabular-nums">7</span><span style="font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.02em">из 10 верно</span></h1>
      <p lang="en" style="margin: 6px 0 0; font-size: 16px; line-height: 22px; color: var(--text-2)">Verbal · Text Completion · <span lang="ru">11 минут</span></p>
      <!-- Лента ответов: вся сессия одним взглядом -->
      <div style="position: relative; margin-top: 28px">
        <span aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 15.25px; height: 1.5px; background: var(--line)"></span>
        <ol aria-label="Ответы по вопросам" style="list-style: none; margin: 0; padding: 0; position: relative; display: flex; justify-content: space-between"><li aria-label="Вопрос 1: верно" style="position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%; background: var(--verbal); color: var(--surface); display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.5l4 4 9-9"></path></svg></li><li aria-label="Вопрос 2: неверно" style="position: relative; z-index: 1; width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; background: var(--surface); border: 2px solid var(--wrong); color: var(--wrong); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></li><li aria-label="Вопрос 3: верно" style="position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%; background: var(--verbal); color: var(--surface); display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.5l4 4 9-9"></path></svg></li><li aria-label="Вопрос 4: неверно" style="position: relative; z-index: 1; width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; background: var(--surface); border: 2px solid var(--wrong); color: var(--wrong); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></li><li aria-label="Вопрос 5: верно" style="position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%; background: var(--verbal); color: var(--surface); display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.5l4 4 9-9"></path></svg></li><li aria-label="Вопрос 6: верно" style="position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%; background: var(--verbal); color: var(--surface); display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.5l4 4 9-9"></path></svg></li><li aria-label="Вопрос 7: верно" style="position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%; background: var(--verbal); color: var(--surface); display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.5l4 4 9-9"></path></svg></li><li aria-label="Вопрос 8: неверно" style="position: relative; z-index: 1; width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; background: var(--surface); border: 2px solid var(--wrong); color: var(--wrong); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></li><li aria-label="Вопрос 9: верно" style="position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%; background: var(--verbal); color: var(--surface); display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.5l4 4 9-9"></path></svg></li><li aria-label="Вопрос 10: верно" style="position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%; background: var(--verbal); color: var(--surface); display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.5l4 4 9-9"></path></svg></li></ol>
      </div>
      <h2 style="margin: 40px 0 12px; font-size: 21px; line-height: 28px; font-weight: 600">Что повторить</h2>
      <section class="glass" aria-label="Темы с ошибками" style="border-radius: 26px; overflow: hidden; background: var(--glass-strong); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: flex; flex-direction: column">
        <a class="row-link" href="web-R18-Theory.dc.html" style="min-height: 64px; box-sizing: border-box; padding: 10px 18px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text)">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 17px; line-height: 24px; font-weight: 500">Слова-сигналы контраста</span>
            <span style="font-size: 14px; line-height: 20px; color: var(--text-2)">2 ошибки · вопросы 4 и 8</span>
          </span>
          <span style="flex: none; color: var(--text-2); display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"></path></svg></span>
        </a>
        <span aria-hidden="true" style="height: 1px; margin: 0 18px; background: var(--line)"></span>
        <a class="row-link" href="#" style="min-height: 64px; box-sizing: border-box; padding: 10px 18px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text)">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 17px; line-height: 24px; font-weight: 500">Причина и следствие</span>
            <span style="font-size: 14px; line-height: 20px; color: var(--text-2)">1 ошибка · вопрос 2</span>
          </span>
          <span style="flex: none; color: var(--text-2); display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"></path></svg></span>
        </a>
      </section>
      <a href="web-R16-Review.dc.html" style="align-self: flex-start; margin-top: 14px; min-height: 44px; display: inline-flex; align-items: center; font-size: 15px; font-weight: 500; color: var(--text); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; text-decoration-color: var(--line)">Все ответы и разборы</a>
      <!-- Действия — справа внизу; подсказки клавиш — одной тихой строкой -->
      <div style="margin-top: 28px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px">
        <p style="margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; color: var(--text-2)"><span class="kbd">Enter</span> повторить · <span class="kbd">Esc</span> готово</p>
        <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px"><a href="web-T1-Today.dc.html" style="height: 48px; box-sizing: border-box; padding: 0 22px; border-radius: 24px; font-size: 16px; line-height: 20px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; font-variant-numeric: tabular-nums; text-decoration: none; border: 1px solid var(--line); background: var(--surface); color: var(--text)">Готово</a><button type="button" style="height: 48px; box-sizing: border-box; padding: 0 22px; border-radius: 24px; font-size: 16px; line-height: 20px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; font-variant-numeric: tabular-nums; text-decoration: none; border: 0; background: var(--accent); color: var(--on-accent)">Повторить · 8 вопросов</button></div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
return { themeClass: dark ? 'dark' : '' };
}
}
</script>
</body>
</html>
