<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Practice test — Quant question · desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
/* Токены «Шагов»: светлая и тёмная тема. В компонентах — только var(--…) */
.s{
--bg:#F5F6F9;--surface:#FFFFFF;--text:#1B1E28;--text-2:#5A6070;--line:rgba(27,30,40,.12);--fill:rgba(27,30,40,.06);
--accent:#1B1E28;--on-accent:#FFFFFF;--wrong:#C2410C;--wrong-tint:rgba(194,65,12,.10);
--verbal:#5B4BC4;--verbal-tint:rgba(91,75,196,.12);--quant:#11735F;--quant-tint:rgba(17,115,95,.12);
--words:#B4446C;--words-tint:rgba(180,68,108,.12);--essay:#9A5B00;--essay-tint:rgba(154,91,0,.12);--exam:#1B1E28;
--glow:rgba(91,75,196,.22);--glow-2:rgba(91,75,196,.07);
--glass:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.54));--glass-strong:linear-gradient(180deg,rgba(255,255,255,.90),rgba(255,255,255,.70));--glass-edge:rgba(0,0,0,.06);--glass-rim:rgba(255,255,255,.6);
--glass-shadow:0 10px 30px -10px rgba(30,30,60,.22);--tab-sel:rgba(27,30,40,.07);--focus:#5B4BC4;
}
.s.dark{
--bg:#0E0F14;--surface:#1A1C23;--text:#F2F3F7;--text-2:#A3A8B5;--line:rgba(255,255,255,.12);--fill:rgba(255,255,255,.08);
--accent:#F2F3F7;--on-accent:#111318;--wrong:#FF8A4C;--wrong-tint:rgba(255,138,76,.14);
--verbal:#A898FF;--verbal-tint:rgba(168,152,255,.16);--quant:#4FC4A7;--quant-tint:rgba(79,196,167,.16);
--words:#F28AB0;--words-tint:rgba(242,138,176,.16);--essay:#F0B45A;--essay-tint:rgba(240,180,90,.16);--exam:#F2F3F7;
--glow:rgba(130,110,255,.30);--glow-2:rgba(130,110,255,.08);
--glass:linear-gradient(180deg,rgba(64,66,80,.62),rgba(32,34,44,.50));--glass-strong:linear-gradient(180deg,rgba(48,50,62,.82),rgba(30,32,42,.72));--glass-edge:rgba(0,0,0,.35);--glass-rim:rgba(255,255,255,.12);
--glass-shadow:0 10px 30px -10px rgba(0,0,0,.6);--tab-sel:rgba(255,255,255,.10);--focus:#A898FF;
}
a{color:var(--text)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent;transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
button:active,a:active{transform:scale(0.98)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--verbal-tint)}
@media (prefers-reduced-motion: reduce){button,a{transition:none}button:active,a:active{transform:none}}
@media (prefers-reduced-transparency: reduce){.glass{background:var(--surface)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:12px;line-height:1;font-weight:500;color:var(--text-2);font-variant-numeric:tabular-nums}
@media (hover:hover) and (pointer:fine){.nav-item:hover{background:var(--fill)}.row-link:hover{background:var(--fill)}}
input[type=radio]{appearance:none;-webkit-appearance:none}
input[type=radio]:checked{border-color:var(--accent)!important;background:var(--accent)!important;box-shadow:inset 0 0 0 4px var(--surface)}
label:has(input:checked){box-shadow:inset 0 0 0 1.5px var(--accent)!important}
textarea{resize:none}
textarea:focus{outline:none;box-shadow:0 0 0 2px var(--focus)}
</style>
</helmet>
<!-- Вопрос пробника на широком экране: полоса как на компьютерном GRE — секция слева, время по центру, инструменты и Back/Next справа -->
<div class="s {{themeClass}}" style="min-height: 100vh; box-sizing: border-box; font-family: 'Onest', system-ui, sans-serif; color: var(--text); background: radial-gradient(70% 55% at 55% -15%, var(--glow) 0%, var(--glow-2) 50%, transparent 78%), var(--bg); display: flex; flex-direction: column; --glow: rgba(27,30,40,.09); --glow-2: rgba(27,30,40,.03);">

  <!-- Режим фокуса: тонкая полоса сверху, без боковой панели -->
  <header lang="en" style="flex: none; min-height: 64px; box-sizing: border-box; padding: 10px clamp(16px, 4vw, 48px); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px">
    <div style="flex: 1 1 200px; min-width: 0; display: flex; align-items: center; gap: 14px"><button type="button" class="glass" aria-label="Exit section" style="flex: none; width: 44px; height: 44px; box-sizing: border-box; padding: 0; border-radius: 50%; color: var(--text); text-decoration: none; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"></path></svg></button><span style="font-size: 17px; line-height: 22px; font-weight: 600; font-variant-numeric: tabular-nums">Quant 1 · 7 / 12</span></div>
    <div style="flex: 0 1 auto; display: flex; justify-content: center"><span role="timer" aria-label="Time remaining 14 minutes 32 seconds" style="font-size: 24px; line-height: 28px; font-weight: 600; font-variant-numeric: tabular-nums">14:32</span></div>
    <div style="flex: 1 1 200px; min-width: 0; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px"><div role="toolbar" aria-label="Exam tools" class="glass" style="height: 44px; box-sizing: border-box; padding: 3px; border-radius: 22px; display: flex; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-rim), var(--glass-shadow)">
      <button type="button" aria-pressed="false" style="height: 38px; padding: 0 14px; border: 0; border-radius: 19px; background: transparent; color: var(--text); text-decoration: none; font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5h10v15.5l-5-3.5-5 3.5z"></path></svg>Mark</button>
      <a href="web-X5-ExamReview.dc.html" style="height: 38px; padding: 0 14px; border: 0; border-radius: 19px; background: transparent; color: var(--text); text-decoration: none; font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="4.5" width="6" height="6" rx="1.5"></rect><rect x="13.5" y="4.5" width="6" height="6" rx="1.5"></rect><rect x="4.5" y="13.5" width="6" height="6" rx="1.5"></rect><rect x="13.5" y="13.5" width="6" height="6" rx="1.5"></rect></svg>Review</a>
      <button type="button" style="height: 38px; padding: 0 14px; border: 0; border-radius: 19px; background: transparent; color: var(--text); text-decoration: none; font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="3.5" width="13" height="17" rx="2.5"></rect><path d="M8.5 7.5h7"></path><path d="M9 12h.01"></path><path d="M12 12h.01"></path><path d="M15 12h.01"></path><path d="M9 16h.01"></path><path d="M12 16h.01"></path><path d="M15 16h.01"></path></svg>Calculator</button>
    </div><button type="button" style="height: 48px; padding: 0 22px; border-radius: 24px; border: 1px solid var(--line); background: var(--surface); color: var(--text); text-decoration: none; font-size: 16px; line-height: 20px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap">Back</button><button type="button" style="height: 48px; padding: 0 24px; border: 0; border-radius: 24px; background: var(--accent); color: var(--on-accent); text-decoration: none; font-size: 16px; line-height: 20px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; font-variant-numeric: tabular-nums">Next</button></div>
  </header>

  <main lang="en" style="flex: 1; box-sizing: border-box; padding: 28px clamp(16px, 4vw, 48px) 56px; display: flex; justify-content: center">
    <div style="width: 100%; max-width: 720px; display: flex; flex-direction: column">

      <p style="margin: 0; font-size: 19px; line-height: 27px; font-weight: 500">Compare Quantity A and Quantity B.</p>
      <p style="margin: 18px 0 0; text-align: center; font-size: 22px; line-height: 28px"><i>x</i> &gt; 0</p>

      <div style="margin-top: 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-radius: 20px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line)">
        <div style="padding: 16px 16px 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: inset -1px 0 0 var(--line)">
          <span style="font-size: 15px; line-height: 20px; color: var(--text-2)">Quantity A</span>
          <span style="font-size: 26px; line-height: 34px">(<i>x</i> + 1)²</span>
        </div>
        <div style="padding: 16px 16px 18px; display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span style="font-size: 15px; line-height: 20px; color: var(--text-2)">Quantity B</span>
          <span style="font-size: 26px; line-height: 34px"><i>x</i>² + 1</span>
        </div>
      </div>

      <!-- Выбран первый; верность в экзамене не показывается -->
      <div role="radiogroup" aria-label="Answer choices" style="margin-top: 22px; display: flex; flex-direction: column; gap: 10px">
          <label style="min-height: 56px; box-sizing: border-box; border-radius: 18px; box-shadow: inset 0 0 0 1px var(--line); background: var(--surface); padding: 14px 18px; display: flex; align-items: center; gap: 14px; cursor: pointer; font-size: 17px; line-height: 24px">
            <input type="radio" name="wx4-answer" value="a" checked style="margin: 0; flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--text-2); background: var(--surface); cursor: pointer">
            <span style="flex: 1">Quantity A is greater.</span>
            <span class="kbd" aria-hidden="true">A</span>
          </label>
          <label style="min-height: 56px; box-sizing: border-box; border-radius: 18px; box-shadow: inset 0 0 0 1px var(--line); background: var(--surface); padding: 14px 18px; display: flex; align-items: center; gap: 14px; cursor: pointer; font-size: 17px; line-height: 24px">
            <input type="radio" name="wx4-answer" value="b" style="margin: 0; flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--text-2); background: var(--surface); cursor: pointer">
            <span style="flex: 1">Quantity B is greater.</span>
            <span class="kbd" aria-hidden="true">B</span>
          </label>
          <label style="min-height: 56px; box-sizing: border-box; border-radius: 18px; box-shadow: inset 0 0 0 1px var(--line); background: var(--surface); padding: 14px 18px; display: flex; align-items: center; gap: 14px; cursor: pointer; font-size: 17px; line-height: 24px">
            <input type="radio" name="wx4-answer" value="c" style="margin: 0; flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--text-2); background: var(--surface); cursor: pointer">
            <span style="flex: 1">The two quantities are equal.</span>
            <span class="kbd" aria-hidden="true">C</span>
          </label>
          <label style="min-height: 56px; box-sizing: border-box; border-radius: 18px; box-shadow: inset 0 0 0 1px var(--line); background: var(--surface); padding: 14px 18px; display: flex; align-items: center; gap: 14px; cursor: pointer; font-size: 17px; line-height: 24px">
            <input type="radio" name="wx4-answer" value="d" style="margin: 0; flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--text-2); background: var(--surface); cursor: pointer">
            <span style="flex: 1">The relationship cannot be determined from the information given.</span>
            <span class="kbd" aria-hidden="true">D</span>
          </label>
      </div>

      <p style="margin: 18px 0 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; font-size: 13px; line-height: 18px; color: var(--text-2)"><span class="kbd">A</span>–<span class="kbd">D</span> answer · <span class="kbd">M</span> mark · <span class="kbd" aria-label="стрелка вправо"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span> next</p>
    </div>
  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
return { themeClass: dark ? 'dark' : '' };
}
}
</script>
</body>
</html>
