<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&amp;family=PT+Serif:ital,wght@0,400;0,700;1,400&amp;family=Caveat:wght@500;700&amp;display=swap">
<style>

</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; box-sizing: border-box; font-family: 'PT Sans', sans-serif; color: #1A1A1A; background-color: #FFFFFF; background-image: linear-gradient(#DDEAF6 1px, transparent 1px), linear-gradient(90deg, #DDEAF6 1px, transparent 1px); background-size: 20px 20px; background-position: 16px 12px; display: flex; flex-direction: column">

  <header style="height: 52px; flex: none; box-sizing: border-box; padding: 0 8px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: #FFFFFF; position: relative; z-index: 2">
    <div style="display: flex; justify-content: flex-start">
      <button type="button" style="min-height: 44px; padding: 0 8px 0 2px; border: 0; background: transparent; color: #1D3A9C; font-size: 17px; line-height: 22px; display: inline-flex; align-items: center; gap: 2px">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="#1D3A9C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
        <span>Назад</span>
      </button>
    </div>
    <div style="font-size: 17px; line-height: 22px; font-weight: 700">Поля</div>
    <div style="display: flex; justify-content: flex-end">
      <button type="button" aria-label="Меню" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: #EEF1F6; display: inline-flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="3.5" cy="9" r="1.6" fill="#1A1A1A" /><circle cx="9" cy="9" r="1.6" fill="#1A1A1A" /><circle cx="14.5" cy="9" r="1.6" fill="#1A1A1A" /></svg>
        </span>
      </button>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column">
    <div aria-hidden="true" style="position: absolute; left: 44px; top: 0; bottom: 0; width: 1.5px; background: #E58A8E"></div>

    <div style="flex: 1; min-height: 0; overflow: hidden; position: relative; box-sizing: border-box; padding: 20px 14px 0 0; display: flex; flex-direction: column">

      <div style="display: grid; grid-template-columns: 44px 1fr; column-gap: 12px">
        <div></div>
        <h1 style="margin: 0; text-align: center; font-family: 'Caveat', cursive; font-weight: 700; font-size: 30px; line-height: 40px; color: #1D3A9C">Новая тренировка</h1>
      </div>

      <!-- Сводка одной фразой: всё уже выбрано, как в прошлый раз; каждая часть раскрывает свой выбор -->
      <div style="margin-top: 20px; display: grid; grid-template-columns: 44px 1fr; column-gap: 12px">
        <div></div>
        <p style="margin: 0; font-size: 17px; line-height: 40px; color: #555B66">
          <button type="button" aria-expanded="false" style="height: 44px; margin: -2px 0; padding: 0 1px; vertical-align: middle; border: 0; background: transparent; color: #1D3A9C; font-size: 17px; text-decoration: underline; text-decoration-style: dashed; text-decoration-color: #7F96B5; text-decoration-thickness: 1.5px; text-underline-offset: 5px">Verbal</button> ·
          <button type="button" aria-expanded="true" style="height: 44px; margin: -2px 0; padding: 0 1px; vertical-align: middle; border: 0; background: transparent; color: #1D3A9C; font-size: 17px; font-weight: 700; text-decoration: underline; text-decoration-color: #1D3A9C; text-decoration-thickness: 2px; text-underline-offset: 5px">Text Completion</button> ·
          <button type="button" aria-expanded="false" style="height: 44px; margin: -2px 0; padding: 0 1px; vertical-align: middle; border: 0; background: transparent; color: #1D3A9C; font-size: 17px; text-decoration: underline; text-decoration-style: dashed; text-decoration-color: #7F96B5; text-decoration-thickness: 1.5px; text-underline-offset: 5px">все темы</button> ·
          <button type="button" aria-expanded="false" style="height: 44px; margin: -2px 0; padding: 0 1px; vertical-align: middle; border: 0; background: transparent; color: #1D3A9C; font-size: 17px; text-decoration: underline; text-decoration-style: dashed; text-decoration-color: #7F96B5; text-decoration-thickness: 1.5px; text-underline-offset: 5px">любая сложность</button> ·
          <button type="button" aria-expanded="false" style="height: 44px; margin: -2px 0; padding: 0 1px; vertical-align: middle; border: 0; background: transparent; color: #1D3A9C; font-size: 17px; text-decoration: underline; text-decoration-style: dashed; text-decoration-color: #7F96B5; text-decoration-thickness: 1.5px; text-underline-offset: 5px">10&#160;вопросов</button> ·
          <button type="button" aria-expanded="false" style="height: 44px; margin: -2px 0; padding: 0 1px; vertical-align: middle; border: 0; background: transparent; color: #1D3A9C; font-size: 17px; text-decoration: underline; text-decoration-style: dashed; text-decoration-color: #7F96B5; text-decoration-thickness: 1.5px; text-underline-offset: 5px">Практика</button>
        </p>
      </div>

      <!-- Раздел: выбранное обведено синей ручкой, как ученик обводит свой вариант -->
      <fieldset style="margin: 20px 0 0; padding: 0; border: 0; min-width: 0; display: grid; grid-template-columns: 44px 1fr; column-gap: 12px">
        <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap">Раздел</legend>
        <div></div>
        <div style="display: grid; grid-template-columns: 100px 1fr; align-items: center">
          <span aria-hidden="true" style="font-size: 15px; line-height: 20px; color: #555B66">Раздел</span>
          <div style="display: flex; gap: 4px">
            <label style="position: relative; min-width: 72px; min-height: 44px; margin: -2px 0; display: inline-flex; align-items: center; justify-content: center; font-size: 17px; line-height: 20px; font-weight: 700; color: #1D3A9C; cursor: pointer">
              <input type="radio" name="b2-section" value="verbal" checked style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none" />
              <span style="position: relative; display: inline-block">Verbal<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: -12px; top: -9px; width: calc(100% + 24px); height: calc(100% + 18px); overflow: visible; pointer-events: none"><path d="M12 9C30 2 74 1 91 8c10 5 8 20-8 26-20 6-56 6-73 0C-1 30 0 16 14 9c8-4 18-6 28-6" fill="none" stroke="#1D3A9C" stroke-width="1.75" stroke-linecap="round" vector-effect="non-scaling-stroke" /></svg></span>
            </label>
            <label style="position: relative; min-width: 72px; min-height: 44px; margin: -2px 0; display: inline-flex; align-items: center; justify-content: center; font-size: 17px; line-height: 20px; color: #1A1A1A; cursor: pointer">
              <input type="radio" name="b2-section" value="quant" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none" />
              <span>Quant</span>
            </label>
            <label style="position: relative; min-width: 72px; min-height: 44px; margin: -2px 0; display: inline-flex; align-items: center; justify-content: center; font-size: 17px; line-height: 20px; color: #1A1A1A; cursor: pointer">
              <input type="radio" name="b2-section" value="essay" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none" />
              <span>Эссе</span>
            </label>
          </div>
        </div>
      </fieldset>

      <!-- Тип задания — раскрыт (его открыла часть сводки «Text Completion») -->
      <fieldset style="margin: 20px 0 0; padding: 0; border: 0; min-width: 0; display: grid; grid-template-columns: 44px 1fr; column-gap: 12px">
        <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap">Тип задания</legend>
        <div></div>
        <div style="display: flex; flex-direction: column">
          <button type="button" aria-expanded="true" style="min-height: 44px; margin: -12px 0; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: space-between; color: #555B66; font-size: 15px; line-height: 20px; text-align: left">
            <span>Тип задания</span>
            <span style="display: inline-flex; align-items: center; gap: 2px; color: #1D3A9C">Свернуть<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 15l6.5-6.5 6.5 6.5" fill="none" stroke="#1D3A9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg></span>
          </button>
          <div style="display: flex; flex-direction: column">
            <label style="position: relative; min-height: 44px; margin: -2px 0; padding-left: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 16px; line-height: 20px; color: #1A1A1A; cursor: pointer">
              <input type="radio" name="b2-type" value="rc" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none" />
              <span>Reading Comprehension</span>
              <span style="font-size: 13px; line-height: 20px; color: #555B66; font-variant-numeric: tabular-nums">доступно 64</span>
            </label>
            <label style="position: relative; min-height: 44px; margin: -2px 0; padding-left: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 16px; line-height: 20px; color: #1A1A1A; cursor: pointer">
              <input type="radio" name="b2-type" value="tc" checked style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none" />
              <span style="position: relative; display: inline-block; font-weight: 700; color: #1D3A9C">Text Completion<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: -10px; top: -9px; width: calc(100% + 20px); height: calc(100% + 18px); overflow: visible; pointer-events: none"><path d="M88 7C70 1 26 2 10 9-2 15 1 29 18 34c20 5 54 5 70-1 13-6 12-20 0-26C80 3 70 2 60 2" fill="none" stroke="#1D3A9C" stroke-width="1.75" stroke-linecap="round" vector-effect="non-scaling-stroke" /></svg></span>
              <span style="font-size: 13px; line-height: 20px; color: #555B66; font-variant-numeric: tabular-nums">доступно 58</span>
            </label>
            <label style="position: relative; min-height: 44px; margin: -2px 0; padding-left: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 16px; line-height: 20px; color: #1A1A1A; cursor: pointer">
              <input type="radio" name="b2-type" value="se" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none" />
              <span>Sentence Equivalence</span>
              <span style="font-size: 13px; line-height: 20px; color: #555B66; font-variant-numeric: tabular-nums">доступно 41</span>
            </label>
          </div>
        </div>
      </fieldset>

      <!-- Количество -->
      <fieldset style="margin: 20px 0 0; padding: 0; border: 0; min-width: 0; display: grid; grid-template-columns: 44px 1fr; column-gap: 12px">
        <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap">Количество вопросов</legend>
        <div></div>
        <div style="display: grid; grid-template-columns: 100px 1fr; align-items: center">
          <span aria-hidden="true" style="font-size: 15px; line-height: 20px; color: #555B66">Вопросов</span>
          <div style="display: flex; gap: 4px">
            <label style="position: relative; min-width: 72px; min-height: 44px; margin: -2px 0; display: inline-flex; align-items: center; justify-content: center; font-size: 17px; line-height: 20px; color: #1A1A1A; font-variant-numeric: tabular-nums; cursor: pointer">
              <input type="radio" name="b2-count" value="5" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none" />
              <span>5</span>
            </label>
            <label style="position: relative; min-width: 72px; min-height: 44px; margin: -2px 0; display: inline-flex; align-items: center; justify-content: center; font-size: 17px; line-height: 20px; font-weight: 700; color: #1D3A9C; font-variant-numeric: tabular-nums; cursor: pointer">
              <input type="radio" name="b2-count" value="10" checked style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none" />
              <span style="position: relative; display: inline-block; padding: 0 6px">10<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: -10px; top: -10px; width: calc(100% + 20px); height: calc(100% + 20px); overflow: visible; pointer-events: none"><path d="M14 8C34 1 70 1 88 7c11 4 11 21-4 27C64 40 30 40 13 33 0 27 2 13 17 7c9-3 20-5 32-5" fill="none" stroke="#1D3A9C" stroke-width="1.75" stroke-linecap="round" vector-effect="non-scaling-stroke" /></svg></span>
            </label>
            <label style="position: relative; min-width: 72px; min-height: 44px; margin: -2px 0; display: inline-flex; align-items: center; justify-content: center; font-size: 17px; line-height: 20px; color: #1A1A1A; font-variant-numeric: tabular-nums; cursor: pointer">
              <input type="radio" name="b2-count" value="20" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none" />
              <span>20</span>
            </label>
          </div>
        </div>
      </fieldset>

      <!-- Режим -->
      <fieldset style="margin: 20px 0 0; padding: 0; border: 0; min-width: 0; display: grid; grid-template-columns: 44px 1fr; column-gap: 12px">
        <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap">Режим</legend>
        <div></div>
        <div style="display: flex; flex-direction: column; gap: 20px">
          <label style="position: relative; min-height: 44px; margin: -2px 0; padding-left: 10px; display: flex; flex-direction: column; justify-content: center; cursor: pointer">
            <input type="radio" name="b2-mode" value="practice" checked style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none" />
            <span style="align-self: flex-start; position: relative; display: inline-block; font-size: 17px; line-height: 20px; font-weight: 700; color: #1D3A9C">Практика<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: -10px; top: -8px; width: calc(100% + 20px); height: calc(100% + 16px); overflow: visible; pointer-events: none"><path d="M12 9C30 2 74 1 91 8c10 5 8 20-8 26-20 6-56 6-73 0C-1 30 0 16 14 9c8-4 18-6 28-6" fill="none" stroke="#1D3A9C" stroke-width="1.75" stroke-linecap="round" vector-effect="non-scaling-stroke" /></svg></span>
            <span style="font-size: 15px; line-height: 20px; color: #555B66">разбор после каждого вопроса, без таймера</span>
          </label>
          <label style="position: relative; min-height: 44px; margin: -2px 0; padding-left: 10px; display: flex; flex-direction: column; justify-content: center; cursor: pointer">
            <input type="radio" name="b2-mode" value="check" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none" />
            <span style="font-size: 17px; line-height: 20px; color: #1A1A1A">Проверка</span>
            <span style="font-size: 15px; line-height: 20px; color: #555B66">разбор в конце, с таймером ~15 мин</span>
          </label>
        </div>
      </fieldset>

      <!-- Быстрые наборы — вторично -->
      <div style="margin-top: 20px; display: grid; grid-template-columns: 44px 1fr; column-gap: 12px">
        <div></div>
        <div role="group" aria-labelledby="b2-presets" style="display: flex; flex-direction: column">
          <span id="b2-presets" style="font-size: 15px; line-height: 20px; color: #555B66">Быстрые наборы</span>
          <div style="display: flex; gap: 8px">
            <button type="button" style="height: 44px; margin: -2px 0; padding: 0 12px; border: 1px solid #7F96B5; border-radius: 10px; background: #FFFFFF; color: #1A1A1A; font-size: 15px; line-height: 20px">Как в прошлый раз</button>
            <button type="button" style="height: 44px; margin: -2px 0; padding: 0 12px; border: 1px solid #7F96B5; border-radius: 10px; background: #FFFFFF; color: #1A1A1A; font-size: 15px; line-height: 20px">Мои ошибки · <span style="font-weight: 700; color: #C8222B; font-variant-numeric: tabular-nums">23</span></button>
          </div>
        </div>
      </div>
    </div>

    <!-- Итог над кнопкой — под чертой, как ответ в тетради -->
    <div style="flex: none; height: 40px; position: relative; display: grid; grid-template-columns: 44px 1fr; column-gap: 12px; padding-right: 14px">
      <div></div>
      <p style="margin: 0; border-top: 1px solid #7F96B5; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; line-height: 20px; color: #1A1A1A">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="none" stroke="#555B66" stroke-width="1.75" /><path d="M12 9v4.2l2.6 1.6M9.5 3h5" fill="none" stroke="#555B66" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></svg>
        <span><b style="font-variant-numeric: tabular-nums">~15 мин</b> · разбор после каждого вопроса</span>
      </p>
    </div>
  </main>

  <div style="flex: none; padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid #DCE3EC; position: relative; z-index: 2">
    <button type="button" style="width: 100%; height: 50px; border: 0; border-radius: 10px; background: #1D3A9C; color: #FFFFFF; font-size: 17px; line-height: 20px; font-weight: 700">Начать · 10 вопросов</button>
  </div>

</div>
