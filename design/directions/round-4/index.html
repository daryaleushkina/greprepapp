<div class="app no-nav" data-screen="question">

      <div class="session-meta">

        <span class="session-count">3 из 10</span>
      </div>
      <div class="session-bar" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="2" aria-label="Пройдено 2 из 10"><span style="width:20%"></span></div>
    </header>
    <div class="q-layout">
      <section class="q-stem">
        <p class="q-instr">Выберите по одному варианту для каждого пропуска.</p>
        <p class="q-text">Although the committee’s report was praised for its <span class="blank">(i)</span>, critics noted that its brevity came at a cost: several crucial objections were dismissed in a single <span class="blank">(ii)</span> sentence.</p>
      </section>
      <section class="q-answers">
        <fieldset class="opt-group">
          <legend>Пропуск (i)</legend>
          <button type="button" class="opt" role="radio" aria-checked="false"><span class="oval"></span>thoroughness</button>
          <button type="button" class="opt" role="radio" aria-checked="true"><span class="oval"></span>concision</button>
          <button type="button" class="opt" role="radio" aria-checked="false"><span class="oval"></span>candor</button>
        </fieldset>
        <fieldset class="opt-group">
          <legend>Пропуск (ii)</legend>
          <button type="button" class="opt" role="radio" aria-checked="false"><span class="oval"></span>perfunctory</button>
          <button type="button" class="opt" role="radio" aria-checked="true"><span class="oval"></span>meticulous</button>
          <button type="button" class="opt" role="radio" aria-checked="false"><span class="oval"></span>impassioned</button>
        </fieldset>
      </section>
    </div>
    <footer class="bottom-bar">
      <button type="button" class="btn btn-ghost">Не знаю</button>
      <button type="button" class="btn btn-primary">Проверить</button>
    </footer>
  </div>
</div>

<template id="t-review">
<div class="app no-nav" data-screen="review" data-lang="ru">
  <div class="main">
    <header class="session-top sec-verbal">
      <button type="button" class="icon-btn" aria-label="Закрыть тренировку"><svg class="ic"><use href="#i-close"/></svg></button>
      <div class="session-meta">
        <span class="session-sec"><span class="sec-dot"></span>Verbal · Text Completion</span>
        <span class="session-count">3 из 10</span>
      </div>
      <div class="session-bar" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="3" aria-label="Пройдено 3 из 10"><span style="width:30%"></span></div>
    </header>
    <div class="r-layout">
      <section class="r-question">
        <div class="verdict verdict-wrong" role="status">
          <svg class="ic"><use href="#i-cross"/></svg>
          <span><b>Неверно</b> — первый пропуск верно, второй нет.</span>
        </div>
        <p class="q-text q-text-sm">Although the committee’s report was praised for its <span class="blank blank-right">concision</span>, critics noted that its brevity came at a cost: several crucial objections were dismissed in a single <span class="blank blank-wrong">meticulous</span> sentence.</p>
        <dl class="answer-table">
          <div class="ans-row">
            <dt>Пропуск (i)</dt>
            <dd><span class="ans ans-right"><svg class="ic-sm"><use href="#i-check"/></svg>concision</span></dd>
          </div>
          <div class="ans-row">
            <dt>Пропуск (ii)</dt>
            <dd>
              <span class="ans ans-wrong"><svg class="ic-sm"><use href="#i-cross"/></svg>meticulous<small>ваш ответ</small></span>
              <span class="ans ans-right"><svg class="ic-sm"><use href="#i-check"/></svg>perfunctory<small>верно</small></span>
            </dd>
          </div>
        </dl>
      </section>
      <section class="r-explain">
        <div class="explain-head">
          <h2 class="h2">Разбор</h2>
          <div class="seg" role="group" aria-label="Язык разбора">
            <button type="button" data-lang-set="ru" aria-pressed="true">RU</button>
            <button type="button" data-lang-set="en" aria-pressed="false">EN</button>
          </div>
        </div>
        <div class="explain-body" data-lang-block="ru">
          <p>«Brevity came at a cost» и «dismissed in a single sentence» говорят, что возражения разобрали наспех. Нужно слово с оттенком «для галочки».</p>
          <p><b>Perfunctory</b> — сделанный формально, поверхностно. Это и есть цена краткости.</p>
          <p class="trap"><b>Почему соблазняет meticulous.</b> Звучит как похвала отчёту, но «скрупулёзный» противоречит «dismissed»: тщательно возражения не отбрасывают.</p>
        </div>
        <div class="explain-body" data-lang-block="en">
          <p>“Brevity came at a cost” and “dismissed in a single sentence” signal that the objections were handled hastily. The blank needs a word meaning “done only as a formality.”</p>
          <p><b>Perfunctory</b> — carried out with minimal effort. That is the cost of brevity.</p>
          <p class="trap"><b>Why meticulous tempts.</b> It sounds like praise for the report, but “meticulous” clashes with “dismissed”: careful work doesn’t brush objections aside.</p>
        </div>
        <a href="#" class="topic-link"><svg class="ic-sm"><use href="#i-book"/></svg><span>Тема: контраст после <i>although</i></span><svg class="ic-sm"><use href="#i-chevron-right"/></svg></a>
        <a href="#" class="report-link"><svg class="ic-sm"><use href="#i-flag"/></svg>Сообщить об ошибке</a>
      </section>
    </div>
    <footer class="bottom-bar">
      <button type="button" class="btn btn-primary btn-wide">Дальше</button>
    </footer>
  </div>
</div>

    <a class="nav-item" href="#" aria-current="page"><svg class="ic"><use href="#i-words"/></svg><span>Слова</span></a>
    <a class="nav-item" href="#"><svg class="ic"><use href="#i-exam"/></svg><span>Экзамен</span></a>
    <a class="nav-item" href="#"><svg class="ic"><use href="#i-progress"/></svg><span>Прогресс</span></a>
  </nav>
  <div class="main">
    <header class="top top-back">
      <button type="button" class="icon-btn" aria-label="Назад к словам"><svg class="ic"><use href="#i-back"/></svg></button>

        <p class="sense-ru">лаконичный, немногословный</p>
        <blockquote class="example"><p>His laconic reply — “Fine.” — ended the discussion.</p><p class="example-ru">Его лаконичный ответ «Хорошо» закончил разговор.</p></blockquote>
      </section>

        <div class="rel"><span class="rel-label">Антонимы</span><span class="chips"><span class="chip">verbose</span><span class="chip">loquacious</span></span></div>

<script>
// Каталог: собирает рамки из шаблонов по выбранным фильтрам. Выбор фильтров помнится в браузере — удобство,
// без него страница открывается со всеми направлениями.
const DIRS = [
  { id: 'a', name: 'А · Конспект', note: 'Тёплая бумага, заголовки с засечками, один маркер на главном. Плоско, без теней — спокойствие учебника.' },
  { id: 'b', name: 'Б · Экзаменационный пульт', note: 'Строго, как в день экзамена: холодный серо-синий, сетка и тонкие рамки, цифры моноширинным.' },
  { id: 'c', name: 'В · Цветовые поля', note: 'Раздел узнаётся по цвету с первого взгляда: крупные цветные поля, тяжёлые заголовки, большие зоны нажатия.' },
  { id: 'd', name: 'Г · Ночная студия', note: 'Сначала тёмная: глубокий фон, один яркий акцент, крупные тонкие цифры. Светлая — та же сдержанность на белом.' },
];
const SCREENS = [
  { id: 'home', name: 'Тренировка' },
  { id: 'question', name: 'Вопрос' },
  { id: 'review', name: 'Разбор' },
  { id: 'stats', name: 'Прогресс' },
  { id: 'exam', name: 'Выбор экзамена' },
  { id: 'word', name: 'Слово' },
];
const state = { dir: 'all', screen: 'all', theme: 'both', device: 'phone' };
try { Object.assign(state, JSON.parse(localStorage.getItem('round4') || '{}')); } catch (e) { /* без памяти — по умолчанию */ }

function syncControls() {
  const map = { 'f-dir': ['dir', 'data-dir'], 'f-screen': ['screen', 'data-screen'], 'f-theme': ['theme', 'data-theme-pick'], 'f-device': ['device', 'data-device'] };
  for (const [id, [key, attr]] of Object.entries(map)) {
    document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute('aria-pressed', String(b.getAttribute(attr) === state[key])));
  }
}

function render() {
  const board = document.getElementById('board');
  board.textContent = '';
  board.dataset.device = state.device;
  const dirs = DIRS.filter(d => state.dir === 'all' || d.id === state.dir);
  const screens = SCREENS.filter(s => state.screen === 'all' || s.id === state.screen);
  const themes = state.theme === 'both' ? ['light', 'dark'] : [state.theme];
  for (const d of dirs) {
    const sec = document.createElement('section');
    sec.className = 'cat-dir';
    const h = document.createElement('h2'); h.textContent = d.name;
    const p = document.createElement('p'); p.textContent = d.note;
    const row = document.createElement('div'); row.className = 'cat-row';
    sec.append(h, p, row);
    for (const s of screens) {
      const group = document.createElement('figure'); group.className = 'cat-screen';
      const cap = document.createElement('figcaption'); cap.textContent = s.name;
      const frames = document.createElement('div'); frames.className = 'cat-frames';
      group.append(cap, frames);
      for (const t of themes) {
        const frame = document.createElement('div');
        frame.className = `frame dir-${d.id} device-${state.device}`;
        frame.dataset.theme = t;
        frame.append(document.getElementById(`t-${s.id}`).content.cloneNode(true));
        frames.append(frame);
      }
      row.append(group);
    }
    board.append(sec);
  }
}

document.addEventListener('click', (e) => {
  const ctl = e.target.closest('.cat-seg button');
  if (ctl) {
    if (ctl.dataset.dir) state.dir = ctl.dataset.dir;
    if (ctl.dataset.screen) state.screen = ctl.dataset.screen;
    if (ctl.dataset.themePick) state.theme = ctl.dataset.themePick;
    if (ctl.dataset.device) state.device = ctl.dataset.device;
    try { localStorage.setItem('round4', JSON.stringify(state)); } catch (err) { /* необязательно */ }
    syncControls(); render();
    return;
  }
  // Живые мелочи внутри экранов: выбор варианта в своей группе и язык разбора.
  const opt = e.target.closest('.frame .opt');
  if (opt) {
    opt.closest('.opt-group').querySelectorAll('.opt').forEach(o => o.setAttribute('aria-checked', String(o === opt)));
    return;
  }
  const lang = e.target.closest('.frame [data-lang-set]');
  if (lang) {
    const app = lang.closest('.app');
    app.dataset.lang = lang.dataset.langSet;
    app.querySelectorAll('[data-lang-set]').forEach(b => b.setAttribute('aria-pressed', String(b === lang)));
    return;
  }
  if (e.target.closest('.frame a')) e.preventDefault();
});

syncControls();
render();
</script>
</body>
</html>
